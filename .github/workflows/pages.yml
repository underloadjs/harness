# Builds the harness playground and publishes it to GitHub Pages.
#
# The playground (`playground/`) is a visual tester for the package: pick a named
# harness preset, send a prompt, and watch every `report.progress` event. It is
# not part of the npm package — `package.json` ships `dist/` only.
#
# One-time setup (repo Settings → Pages): set Source to "GitHub Actions".
# No secrets are needed: the offline `demo` preset works with no endpoint, and
# live presets take their base URL / key / model from the visitor's browser.
#
# Base path: `actions/configure-pages` reports the Pages base path, and
# `PLAYGROUND_BASE` feeds it to vite (see playground/vite.config.ts), so the same
# build works for a project site (/<repo>/) or a user site (/).

name: Deploy playground

on:
    push:
        branches: [main]
        paths:
            - 'src/**'
            - 'playground/**'
            - 'package.json'
            - '.github/workflows/pages.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            # No lockfile is committed, so `npm install` rather than `npm ci`.
            - name: Install dependencies
              run: npm install

            - name: Configure Pages
              id: pages
              uses: actions/configure-pages@v5

            - name: Typecheck
              run: npm run typecheck

            - name: Build playground
              run: npm run build:playground
              env:
                  PLAYGROUND_BASE: ${{ steps.pages.outputs.base_path }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: playground/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
