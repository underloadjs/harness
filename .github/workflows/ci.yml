# Typecheck, test, and build the package and the harness app, then publish the
# built UI (src/frontend/dist) to GitHub Pages on pushes to main.
#
# The normal host remains the @underload/service gateway (`yarn start-service`),
# which discovers the harness endpoint modules; the UI is a separate Vite launch
# (`yarn dev:frontend`) and the optional standalone API launcher is
# `yarn dev:server`. This workflow verifies that the library, the server tests,
# the UI tests, and the client bundle all compile, and additionally deploys the
# static UI bundle to Pages (https://underloadjs.github.io/harness/).
#
# One-time repo setting (required once, not per-deploy):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deploy at a time; new pushes cancel in-flight deploys
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            # No lockfile is committed, so `npm install` rather than `npm ci`.
            - name: Install dependencies
              run: npm install

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            # The UI suite is a separate vitest config (jsdom, src/frontend/), so
            # the package's default `test` script cannot cover it.
            - name: Test UI
              run: npm run test:frontend

            - name: Build library
              run: npm run build

            - name: Build UI
              run: npm run build:frontend
              # Pages serves this repo under the /harness/ project path, so the
              # bundle's asset URLs must be prefixed (src/frontend/vite.config.ts
              # reads PLAYGROUND_BASE for exactly this). Default '/' would 404
              # every asset at https://underloadjs.github.io/harness/.
              env:
                  PLAYGROUND_BASE: harness

            - name: Configure Pages
              if: github.event_name != 'pull_request'
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v3
              with:
                  # The UI app build (NOT the root dist/, which is the npm
                  # library output of `vite build` and has no index.html).
                  path: src/frontend/dist

    deploy:
        # PRs only verify the build; pushes to main (and manual runs) publish.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
