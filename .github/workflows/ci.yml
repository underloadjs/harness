# Typecheck, test, and generate the package manifests.
#
# The deployable UI build and its Pages deployment moved to
# `@loadscript/harness` together with the client sources. The optional
# standalone API launcher is `yarn dev:server`.

name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            # No lockfile is committed, so `npm install` rather than `npm ci`.
            - name: Install dependencies
              run: npm install

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            # `build` regenerates the two GENERATED catalogues (harness-tools.manifest.json
            # + the plugin manifest). The package publishes `src/*.ts`, so there is no
            # library bundle to build here.
            - name: Generate catalogues
              run: npm run build
