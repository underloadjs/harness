# ---------------------------------------------------------------------------
# Underload Harness - target REST + WebSocket contract
#
# Codegrounded sources (read-only, no implementation claims below):
#   src/server/api.ts        - route dispatcher, envelopes, field allowlists, status codes, body caps
#   src/server/protocol.ts   - wire types (session, turn, thread, tool, model, transcript, action)
#   src/server/sessions.ts   - store semantics, queue, threads, transcripts, pending actions, limits
#   src/server/config.ts     - provider defaults, credential rule, runtime configuration
#   src/server/harnesses/    - harness definition registry (create/patch/delete, built-in tombstones)
#   src/server/journal.ts    - durable event record, (turnId, index) locator
#   src/server/turn-projector.ts, src/shared/turn-display.ts - display projection + addressed ops
#   src/core/command.ts, src/core/command-builtins.ts        - slash-command grammar and built-ins
#   src/types/index.ts       - harness domain types (events, messages, tools, threads, commands)
# ---------------------------------------------------------------------------
openapi: 3.0.3
info:
  title: Underload Harness API
  version: 1.0.0-target
  description: >-
    TARGET CONTRACT for the harness server, mounted at `/v1/harness`. This is a design document: the
    server work needed to satisfy it is expected, and nothing here should be read as a claim that a
    running build already answers every route exactly as written. It is one complete contract with no
    second vocabulary, no optional second spelling of any field, and no surface kept alongside the
    canonical one.


    WHAT THIS API IS. A local, operator-facing control plane for long-running harness sessions. The
    server owns every conversation record: sessions, persistent threads, recorded turns, transcripts,
    pending owner questions, per-session agent and tool registries, and the harness definitions new
    sessions inherit. Clients are renderers and operators; the model never calls this API.


    GRANULARITY AND LAZY LOADING (the governing rule of the whole document). No route returns a whole
    conversation tree by default. The resource tree is addressable one level at a time: service info,
    then a session summary, then session metadata, then a PAGE of turn rows, then ONE turn's display
    tree, then ONE step or ONE context segment, then ONE transcript message page. Every list is a
    bounded projection with a cursor. Heavy content - recorded events, transcript messages, prompt and
    instruction text, tool source code, attachment bytes, raw tool results - is reachable only through
    an explicitly named subresource, and a summary always names the fields it omits. Write responses
    are receipts or the single mutated resource, never an aggregate. The only live-update surface is the
    WebSocket stream, whose frames are ordered, bounded deltas; it never carries a full session tree
    either.


    PAGES AND REVISIONS. Paginated reads accept `limit` (default 25, maximum 100) and an opaque
    `cursor`, and answer `{ items, limit, next_cursor, observed_at, revision }`. A cursor encodes the
    ordering key and the revision it was taken at, so a page never skips or repeats an entry across a
    concurrent mutation; an unrecognised cursor is a 400 naming the parameter. Every addressable
    resource instance carries an integer `revision` that increases by one on every accepted mutation of
    that instance, and every collection page carries the collection `revision`. A revision is a
    staleness test, not a cursor: it orders "did my read race my subscription" and it never enumerates
    history. Revisions restart at 1 for a freshly created resource, and a server restart starts a new
    stream epoch (see the stream extension), so a client never compares revisions across epochs.


    CONCURRENCY. General REST mutations are LAST-WRITE-WINS: a write is accepted against whatever state the
    resource is in when it is processed, it never carries a precondition, and the response's `revision` is the
    number the write landed at. Revisions elsewhere in this contract are READ reconciliation - the tool for
    ordering a read against a subscription - and are never a conditional-write token. Exactly one resource offers
    an optimistic lock, because exactly one resource is edited as a whole document by a human: the transcript
    replacement accepts `if_revision`, and a stale value is refused with 409 naming the current revision with
    nothing written. A lifecycle guard is a different thing from a lock and stays a 409 wherever it applies (a
    busy session cannot be reset, a running conversation cannot be deleted, a busy session cannot take a manual
    tool call); those refusals are about server state, not about a client's copy being out of date.


    SCOPE AND SNAPSHOT ISOLATION. A session owns a frozen copy of the harness definition it was created
    from (`SessionDefinitionResource`, the record a saved session restores from). Global resources -
    harness definitions, agent profiles, the tool catalogue, global configuration - are the inheritance
    source for NEW sessions only. Mutating a global resource never rewrites an existing session, its
    turns, its threads, or its registries, and an in-flight provider request keeps the model it started
    with. Conversely a session-local change (agent binding, tool registration, live `agent_models`)
    never writes the global catalogue, the global configuration, or another session. Inheritance is
    therefore one-way and snapshot-based, which is why a global DELETE is a tombstone plus a restore
    rule rather than a cascade.


    SECRETS. A provider API key is write-only. No response, example, or stream frame ever contains one;
    a read reports only `has_api_key`. A key a client sends for one request is used only against the
    configured provider origin plus base path, so a foreign `base_url` with no key means "no key" and
    never means "use the server key". Runtime worker knobs are deployment-owned: readable for
    diagnosis, refused with a 400 that names the field if a client tries to write one.


    SAFETY OF WRITES. Agents are trusted, code-defined profiles. No route uploads an agent
    implementation: a global agent write changes declarative text (title, description, instruction
    override, guidelines) and a session agent write binds an existing profile and overrides its model
    id or instruction text. Tools are the one place executable code legitimately exists. Global tools
    are composed by the deployment, so the global tool surface is read plus execute, never upload. A
    session tool registration is declarative `ToolCreation` (name, description, tags, JSON Schema,
    optional function body or module text) compiled by the host realm with NO sandbox and NO isolation:
    submitting code is therefore a capability grant, and a deployment that does not grant it answers
    403 on that route. `protected: true` marks the harness-owned control plane (the tools a session runs
    on: `toolRegistry`, `toolRequest`, `toolCreate`, `toolManage`, `task`, `delegate`); a protected
    entry cannot be replaced, edited, disabled, or deleted by any route - 403, not 409 - because
    removing it would break that session's own control surface. Every write rejects unknown properties
    outright instead of ignoring them, so a client is never left believing it changed something.


    LIMITS (the same numbers travel to a client in `GET /v1/harness`, so they are contract, not
    folklore). Request body 1,000,000 bytes; a task submit may reach 16,777,216 bytes because base64
    media rides inside the JSON. Task input 200,000 characters. At most 100 pending (queued) tasks per
    session, 429 beyond that. At most 256 persistent thread records per session. At most 4 attachments
    per turn, 4,194,304 bytes each, 8,388,608 bytes per turn. At most 16 result references per submit.
    At most 4 live pending action requests per session, and at most 64 steered-submit audit records on
    one turn. At most 32 tools created per harness lifetime. A model-facing tool result is bounded to
    65,536 bytes of text; the detail routes answer recorded bytes verbatim and state the cap they were
    measured against. Stream limits are stated on the stream operation itself.


    ERRORS. Every failure answers `{ "error": { "message": string } }` with one of 400, 403, 404, 405,
    409, 413, 415, 429, 500, 502, 503. A 405 names the methods that path accepts, and any method a path
    item does not declare is a 405 even where the response is not repeated inline. 403 is always a
    scope or operator-policy refusal. 409 always means "the resource state refuses this operation and
    it is safe to retry once that state changes". Note that an EXECUTION failure of a manually called
    tool is not an HTTP error at all: the call itself succeeded and the tool reported the failure, so
    the answer is 200 with `ok: false` (see `ToolCallResult`).


    AUTHENTICATION. None, and none is invented here. The service applies an Origin check for its own
    browser client and a client-hint header on one mount; neither is a credential. Treat this API as a
    trusted local or operator surface. No route implies a security scheme, no `WWW-Authenticate` is
    defined, and the WebSocket handshake carries no token, cookie, or key in a query string.


    NAMING. Path parameters, query parameters, HTTP envelopes, receipts, pages, control-plane
    resources, and request bodies are snake_case throughout. Two payload families keep their own
    spelling on purpose, because the server transports them rather than restating them: a verbatim
    recorded payload (`HarnessEvent`, `HarnessMessage`, `HarnessUsage`, `HarnessToolCall`,
    `HarnessAttachment`, `HarnessActionRequest`, `AgentResultReference`) is the durable record's bytes,
    and the display projection (`TurnSummary`, `TurnSection`, `DisplayNode`, `DisplayStep`,
    `ContextBlock`, `TurnDisplayOp`, `TurnBlockDetail`, `TurnStepDetail`) is the projector's data
    contract, shared by the durable projection and the live stream. A client can tell the two families
    apart by which routes carry them: the record and display routes below name it explicitly.


    LIVE UPDATES. `GET /v1/harness/stream` is the only live surface: an ordered, cursor-based
    WebSocket conversation for subscriptions, control acknowledgements, and bounded deltas. Every
    durable mutation is a REST write. The stream issues no commands that change server state, so there
    is exactly one way to mutate a resource and no duplicated mutation semantics.
servers:
  - url: http://127.0.0.1:5000
    description: Local harness host, canonical mount `/v1/harness`
tags:
  - name: Service
    description: Service identity, capability advertisement, and liveness.
  - name: Configuration
    description: Host-wide provider defaults. Never per-session, never session-writable.
  - name: Harnesses
    description: Named harness definitions - the inheritance source for new sessions.
  - name: Agents
    description: Global trusted agent catalogue and its declarative overrides.
  - name: Tools
    description: Global tool catalogue and direct (session-less) execution.
  - name: Models
    description: Provider model discovery performed by the server on the client's behalf.
  - name: Sessions
    description: Server-owned conversations with a frozen harness snapshot.
  - name: Session Agents
    description: Session-local agent bindings, overrides, and effective instruction text.
  - name: Session Tools
    description: Session-local toolbox, registrations, source, and execution.
  - name: Tasks
    description: Submits, the queue, steering, reset, and cancel.
  - name: Threads
    description: Persistent agent conversations inside one session.
  - name: Transcript
    description: One conversation's model-facing message list, paged, editable.
  - name: Turns
    description: Recorded tasks and their lazy display, event, step, block, and media surfaces.
  - name: Actions
    description: Pending owner questions a model asked and a host answers.
  - name: Commands
    description: The session's slash-command registry (discovery; execution is a task submit).
  - name: Usage
    description: Server-summed token accounting for one session.
  - name: Stream
    description: The WebSocket conversation for rapid UI updates.
paths:
  /v1/harness:
    get:
      tags: [Service]
      operationId: getServiceInfo
      summary: Service identity, capabilities, and contract limits
      description: >-
        The boot document, deliberately the smallest thing a client can ask for. It identifies the API,
        states which capabilities this deployment offers, publishes the numeric envelope every other
        route is bounded by, and links to the collections a client needs first. It carries NO catalogue,
        NO agent or tool list, NO provider defaults, and NO sessions: a client that wants the harness
        catalogue calls `GET /v1/harness/harnesses`, and a client that wants sessions calls
        `GET /v1/harness/sessions`. `links` is a name-to-path map so a client never hard-codes a mount.
        `api_root` is the API URL this document was served from, never a filesystem path: the file tools
        resolve relative paths against the server process's working directory, so there is no workspace
        root to advertise.
      responses:
        '200':
          description: Service document.
          headers:
            X-Harness-Epoch:
              description: >-
                Opaque server-lifetime epoch id. A client passes it back to the stream when it
                reconnects, and a change to this value is the signal that retained cursors are dead.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
              example:
                api_root: /v1/harness
                service: underload-harness
                api_version: '1.0'
                build_version: 0.3.0
                server_time: 1762250000000
                epoch: 9f2c17a4
                capabilities:
                  websocket_stream: true
                  tool_execution: true
                  tool_registration: true
                  transcript_editing: true
                  command_dispatch: true
                  model_discovery: true
                  harness_definition_writes: true
                  agent_writes: true
                  persistent_threads: true
                limits:
                  body_bytes: 1000000
                  submit_body_bytes: 16777216
                  input_chars: 200000
                  pending_tasks: 100
                  thread_records: 256
                  attachments_per_turn: 4
                  attachment_bytes: 4194304
                  total_attachment_bytes: 8388608
                  result_references: 16
                  pending_actions: 4
                  steer_records: 64
                  created_tools: 32
                  tool_result_bytes: 65536
                  page_limit_default: 25
                  page_limit_max: 100
                links:
                  health: /v1/harness/health
                  config: /v1/harness/config
                  harnesses: /v1/harness/harnesses
                  agents: /v1/harness/agents
                  tools: /v1/harness/tools
                  sessions: /v1/harness/sessions
                  stream: /v1/harness/stream
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/harness/health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Liveness probe
      description: >-
        Cheap and side-effect free. `sessions` is the number of sessions the store holds right now, and
        `epoch` lets a monitoring client detect a restart without parsing a version string. This route
        never touches the harness registry, the catalogue, or any session record.
      responses:
        '200':
          description: Health envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/harness/config:
    get:
      tags: [Configuration]
      operationId: getGlobalConfig
      summary: Read global provider defaults and deployment runtime facts
      description: >-
        GLOBAL scope. These are the host-wide defaults a new session is created on top of; a session's
        own merged settings are per-session state and are reported on the session, never here. The API
        key is never returned, only `has_api_key`. `runtime` is deployment-owned and read-only.
        `writable_fields` states the exact allowlist `PATCH` accepts, so a client cannot guess it.
      responses:
        '200':
          description: Global configuration document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalConfigDocument'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    patch:
      tags: [Configuration]
      operationId: updateGlobalConfig
      summary: Change global provider defaults
      description: >-
        Whole-field patch of the host defaults; only `settings` is writable. A `null` value for
        `base_url` or `model` restores the built-in default. `api_key` is write-only, and an explicit
        empty string or `null` REMOVES the configured server key (the response then reports
        `has_api_key: false`); omitting the property leaves the key untouched, so a client can never
        clobber it by echoing a read. Every change affects FUTURE sessions only - an existing session
        already captured the settings it runs with. Bounds come from `src/server/config.ts`
        (`base_url` 2048 characters, `model` 256). A runtime knob in this body is a 400 naming it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalConfigUpdateRequest'
            examples:
              retarget-provider:
                summary: Point future sessions at another gateway without sending a key
                value:
                  settings:
                    base_url: http://localhost:5500/providers/private/v1
                    model: merge/ds4-flash
              drop-key:
                summary: Remove the configured server key
                value:
                  settings:
                    api_key: ''
      responses:
        '200':
          description: Updated global configuration document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalConfigDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/harness/harnesses:
    get:
      tags: [Harnesses]
      operationId: listHarnesses
      summary: List harness definitions
      description: >-
        A paginated page of `HarnessCard` rows: the metadata a picker needs (name, title, description,
        entry agent, delegation allowlist, declared tools, whether a provider endpoint is required, and
        whether the entry is built in). Each row OMITS the per-agent instruction TEXT, the per-agent
        model map, and the resolved core-tool set - those are on the identified read, where a client
        that is about to create a session actually needs them. A deleted built-in name is absent from
        this page and stays absent across restarts.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive substring match against `name`, `title`, and `description`. It filters the
            page; it never widens the row shape.
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Page of harness cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessCardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Harnesses]
      operationId: createHarness
      summary: Create a harness definition
      description: >-
        Selection-only body: a client picks trusted agent names and may record per-agent model ids and
        instruction overrides. It cannot supply a provider, a credential, a transport, or a tool list -
        those are deployment-owned. The registry validates every member name against the trusted agent
        catalogue and every override key against the resulting member set, so 400 (unknown member) and
        404 (unknown profile) are both possible before anything is written. A new definition is the
        inheritance source for sessions created AFTER it; no existing session changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHarnessRequest'
            examples:
              writer:
                summary: A primary writer with two subagents and one instruction override
                value:
                  name: writer
                  title: Long-form writer
                  primary: writer
                  subagents: [researcher, editor]
                  agent_models:
                    researcher: merge/ds4-flash
                  agent_instructions:
                    editor: Tighten prose. Never restructure headings.
      responses:
        '201':
          description: Created definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/harnesses/{harness_name}:
    parameters:
      - $ref: '#/components/parameters/HarnessName'
    get:
      tags: [Harnesses]
      operationId: getHarness
      summary: Read one harness definition
      description: >-
        The identified read: the card plus `agent_models`, the resolved `core_tools` the definition's
        runs will actually declare (which is runtime visibility, including `search` only when a provider
        key exists), and `instruction_summary` - one entry per member stating whether an override
        exists and how long it is, WITHOUT the text. Instruction text is a separate, explicitly named
        subresource, because a definition that embeds every member's system prompt is the single largest
        payload class this API removes.
      responses:
        '200':
          description: Harness definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessDefinitionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Harnesses]
      operationId: updateHarness
      summary: Change a harness definition
      description: >-
        `harness_name` is immutable; an omitted field keeps its current value. `agent_models` and
        `agent_instructions` REPLACE the map they name: `{}` clears it, every key must name a member of
        the resulting definition (400 otherwise), and an override for a member the same patch removes is
        dropped rather than rejected. Changing `primary` without `subagents` removes the new primary from
        the old allowlist. A PATCH produces a new immutable registry entry under the same name and
        raises its `revision`; the definition an existing session captured does not move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHarnessRequest'
      responses:
        '200':
          description: Updated definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Harnesses]
      operationId: deleteHarness
      summary: Remove a harness definition from the catalogue
      description: >-
        Removes the definition so it can no longer be selected for a NEW session. A built-in is removed
        exactly like a created one, and its name is tombstoned so a restart does not re-ship it. This
        never cascades: every existing session runs, and a saved session restores from, the definition
        it captured, so deleting a definition with live or saved conversations is not an error. A repeat
        delete is 404 because the second call removed nothing. `restored_by_restart: true` states the
        restore rule honestly: only a host restart re-ships a built-in, and there is no HTTP undo.
      responses:
        '200':
          description: Removal receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteHarnessResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/harnesses/{harness_name}/instructions:
    parameters:
      - $ref: '#/components/parameters/HarnessName'
    get:
      tags: [Harnesses]
      operationId: listHarnessInstructions
      summary: List which members carry an instruction override
      description: >-
        The index behind `instruction_summary`, addressable on its own so a configuration dialog can
        show "3 of 5 members are overridden" and resolve one member's text without reading the whole
        definition. One row per member of the definition, in `[primary, ...subagents]` order, each
        naming the provenance of the text the member would actually run (`catalogue`, `global`,
        `harness`) and its exact character count. No row carries text.
      responses:
        '200':
          description: Instruction index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessInstructionIndexResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/harnesses/{harness_name}/instructions/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/HarnessName'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Harnesses]
      operationId: getHarnessInstruction
      summary: Read one member's effective instruction text
      description: >-
        The recorded or inherited instruction for exactly one member of this definition. Resolution
        order is the harness override, then the global profile override, then the trusted catalogue, and
        `source` states which one supplied the text. `guidelines` are included because an instruction
        override replaces only the identity sentence and never the rules appended after it. A member
        outside the definition's member set is 404, which is how a client learns membership rather than
        reading an empty string.
      responses:
        '200':
          description: Instruction text for one member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessInstructionTextResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List trusted agent profiles
      description: >-
        GLOBAL, read-only at the collection level. Rows are `AgentSummary`: identity, title,
        description, and `has_instruction_override`. The instruction and guideline TEXT - trusted
        catalogue content, potentially thousands of characters per profile - is deliberately absent; the
        identified read is the only route that carries it. Availability is not reported here: only the
        tool catalogue has credential-dependent availability.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of agent summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/harness/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Read one trusted agent profile
      description: >-
        The identified read, carrying the full trusted text (`instruction`, `guidelines`) plus
        `instruction_source` (whether the text is the shipped catalogue value or a global override) and
        `referenced_by` (the harness definitions currently naming this member, so a client can explain
        why a DELETE would be refused). One profile costs one request; a client never has to download
        the catalogue to resolve one binding.
      responses:
        '200':
          description: Agent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Agents]
      operationId: updateAgent
      summary: Override an agent profile's declarative text
      description: >-
        GLOBAL write, declarative only. `title`, `description`, `instruction`, and `guidelines` replace
        the whole field they name (no array merging, so `guidelines: []` is an explicit clear and an
        omitted field is no change); an explicit `null` restores the shipped catalogue value for that
        field, which is how an override is undone without a restart. Nothing here touches an agent's
        IMPLEMENTATION - transport, tools, delegation, and turn limits stay code-owned, and no route
        accepts source for an agent. The write affects FUTURE sessions only, and a harness's own
        instruction override still wins over the global profile because the resolution order is
        catalogue, then global, then harness, then session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: Retire an agent profile from the catalogue
      description: >-
        Tombstones the profile so a restart does not re-ship a built-in - the same lifecycle as a
        harness definition. It removes availability for NEW sessions and for member selection only. It
        never cascades: existing sessions keep running the definition they captured, their transcripts
        stay renderable, and their session-local bindings that referenced this profile keep working.
        A profile still named by a live harness definition is refused with 409 naming the referencing
        definitions, because a harness has no frozen-copy mechanism for its member list. A repeat delete
        is 404. There is no HTTP undo: `restored_by_restart` states the only restore path.
      responses:
        '200':
          description: Retirement receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/tools:
    get:
      tags: [Tools]
      operationId: listTools
      summary: List the global tool catalogue
      description: >-
        GLOBAL metadata, answerable without constructing a harness. Rows are `ToolSummary`: `name`,
        display `group`, `description`, `tags`, `visibility` (`core` is the harness-owned set,
        `searchable` is discovery-eligible), `availability`, and `session_bound`. The argument JSON
        Schema is omitted from a row and lives on the identified read, where a client that is about to
        execute the tool needs it. An unconfigured credential-dependent entry has no runnable
        implementation, so its state is `unconfigured` with the environment VARIABLE NAMES and a
        non-secret hint - never a value. There is no global write surface: the catalogue is composed at
        host startup from configuration and credentials, and per-session registration has its own home
        under `/v1/harness/sessions/{session_id}/tools`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: group
          in: query
          required: false
          description: Exact display group to filter by (for example `Core tools`).
          schema:
            type: string
            maxLength: 120
        - name: availability
          in: query
          required: false
          description: Filter to entries that are runnable now, or to entries that are unconfigured.
          schema:
            type: string
            enum: [available, unconfigured]
      responses:
        '200':
          description: Page of tool rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/harness/tools/{tool_id}:
    parameters:
      - $ref: '#/components/parameters/ToolId'
    get:
      tags: [Tools]
      operationId: getTool
      summary: Read one catalogue entry with its argument schema
      description: >-
        The identified read adds `parameters` (the JSON Schema the model is given) and `execution` -
        whether this entry can be executed without a session - to everything a row already carries.
        A `session_bound` entry has no standalone implementation, and `execution.scope` states that
        instead of leaving a client to infer it from `group`.
      responses:
        '200':
          description: Catalogue entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/tools/{tool_id}/executions:
    parameters:
      - $ref: '#/components/parameters/ToolId'
    post:
      tags: [Tools]
      operationId: executeGlobalTool
      summary: Execute a catalogue tool without a session
      description: >-
        Direct execution against the deployment catalogue. The body carries `parameters` only: this
        route has no session field at all, because a call made here resolves through the static global
        registry, not a conversation's registry. A `session_bound` entry (the harness-owned control
        plane) has no standalone implementation and is refused with 400 naming the session-scoped
        route that does have one. A tool that fails at execution is a 200 with `ok: false` plus the
        serialised failure - the call succeeded and the tool reported the failure - so a client must
        read `ok`, not only the status. A credential-dependent entry that is unconfigured is 409.
        Results are the tool's own value with panels and media DESCRIPTORS only: no base64 travels on
        this route, because a catalogue call has no transcript to attach bytes to.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalToolExecutionRequest'
            examples:
              word-count:
                summary: A direct call with named arguments
                value:
                  parameters:
                    path: notes/draft.md
      responses:
        '200':
          description: Execution outcome, successful or reported as a tool failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/harness/models:
    post:
      tags: [Models]
      operationId: discoverModels
      summary: Ask the provider for the model ids it serves
      description: >-
        A browser cannot call a provider directly: it does not hold the server key and must not be
        handed one, and the harness server sends no CORS headers. So the client posts the endpoint
        settings it would use for a session and the server performs the provider request itself. The
        answer is ids only, in provider order, deduplicated, and an empty array is a valid answer. The
        key travels in this request body and never in a query string. Credential rule
        (`src/server/config.ts` `mergeSettings`): a blank or omitted `api_key` reuses the SERVER key only
        when `base_url` is the configured provider's origin plus base path; for any other `base_url` it
        means "no key". An upstream that is unreachable or answers unusably is 502; an upstream that
        answers with a list is never a 502.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelDiscoveryRequest'
            examples:
              with-client-key:
                summary: Discover against a gateway the server has no key for
                value:
                  settings:
                    base_url: https://gateway.example.test/v1
                    api_key: sk-client-supplied
      responses:
        '200':
          description: Discovered model ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelIndex'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/harness/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List sessions as bounded summaries
      description: >-
        A page of `SessionSummary` rows - one per live or restored session, newest activity first. A row
        is metadata and counters only: id, optional display title, harness name, status, queue depth, resolved
        model, timestamps,
        turn and thread counts, and the last error string. It carries NO turns, NO recorded events, NO
        thread roster, NO transcript, NO display tree, NO harness definition, and NO agent or tool
        registries, which is what keeps a session rail a constant-size request however long the
        conversations are. `agent_models` is on the session read, not on a row.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Filter to sessions in one status.
          schema:
            type: string
            enum: [idle, running, error]
        - name: harness
          in: query
          required: false
          description: Exact harness definition name to filter by.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]*$'
      responses:
        '200':
          description: Page of session summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Create a session from a harness definition
      description: >-
        Freezes the named harness definition into the new session and merges the supplied endpoint
        settings with the host defaults. Unknown harness name is 404; a definition that needs a provider
        endpoint and receives neither an explicit nor a configured one is 400. `title` is optional display
        data for a session rail and carries no authority, so two sessions may share one title.
        `settings.api_key` is
        accepted here, used for this session only, and never echoed back. The answer is the created
        session resource (metadata plus counters), not a conversation tree.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            examples:
              basic:
                summary: Create a session on the writer definition
                value:
                  harness: writer
                  title: Repo survey
                  settings:
                    model: merge/ds4-pro
      responses:
        '201':
          description: Created session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /v1/harness/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Read one session's metadata
      description: >-
        The session resource: identity, optional display title, harness name, status, queue depth, resolved
        model, the live
        `agent_models` map, timestamps, counters (turns, threads, pending actions, created tools),
        `runtime_execution` (`inline` or `worker`, so a client can explain where a turn runs), the last
        error, and `revision`. Deliberately absent: the turn list, the thread roster, any event, any
        display tree, any transcript, and the frozen definition's instruction text. Those are one
        addressable subresource each (`/turns`, `/threads`, `/definition`, `/agents`, `/tools`,
        `/queue`, `/actions`, `/usage`).
      responses:
        '200':
          description: Session resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Sessions]
      operationId: updateSession
      summary: Change which model a session's agents run
      description: >-
        The session-level writes. A session's harness, settings, recorded history, and frozen definition are
        immutable over HTTP. `agent_models` maps agent id to model id and MERGES: an agent absent from the body
        keeps the model it currently runs, so changing one dropdown does not reset its siblings, while `{}` is a
        400 no-op. Every key must name a member of this session's frozen definition and every value a non-empty
        model id, or the whole patch is refused with 400 and nothing is applied. `title` replaces the display
        name and an explicit `null` clears it; it is presentation data, never an identifier, so renaming a
        session never changes how it is addressed. The patch is accepted while the session is running; an
        in-flight request keeps the model it started with and only later requests observe the change. The answer
        is the mutated session resource, whose `model` and `agent_models` reflect the change and whose `revision`
        moved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Mutated session resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Dispose a session
      description: >-
        Drops the session from the store and removes its persisted record. Any live run is aborted and
        any queued task is dropped as part of disposal, so this is the terminal operator action for a
        conversation. The receipt names the session and reports what was discarded; no aggregate is
        echoed, because the caller that deletes a session already knows it is gone. A session with no
        live work answers the same way.
      responses:
        '200':
          description: Disposal receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSessionResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/definition:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSessionDefinition
      summary: Read the harness definition this session froze
      description: >-
        The definition captured at creation - the authority for this session's member set, delegation
        allowlist, declared and core tools, and per-agent overrides - plus `source_revision`: the
        `definition_revision` of the registry entry at capture time, which lets a client state "this
        session runs an older copy" without fetching that copy. Instruction TEXT is omitted, exactly as
        on a global definition read; `instruction_summary` gives per-member provenance and length, and
        the effective text for a member of THIS session is the session agent instruction route, which
        also accounts for session-level overrides. A later global edit cannot move this resource.
      responses:
        '200':
          description: Frozen definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDefinitionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/usage:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Usage]
      operationId: getSessionUsage
      summary: Read the session's token accounting
      description: >-
        A server-computed fold of every recorded turn. Honest about unknowns: a provider that never
        reports usage contributes nothing, so `usage` is absent when no turn reported any rather than
        printed as zero, and `reported_turns` names how many turns carried a tally. `by_thread` totals
        cost per conversation and is bounded by the session's thread budget; `truncated` states when a
        deployment with the full thread budget returns the aggregate instead of every row.
      responses:
        '200':
          description: Session usage aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUsageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/commands:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Commands]
      operationId: listSessionCommands
      summary: List the slash commands this session can run
      description: >-
        The session harness's live command registry, projected for a composer: name, the `/name` line a
        client inserts, one-line description, and the argument template. Built-ins are `help`, `tools`,
        `task`, `websearch`, and `webfetch`, and a harness or plugin may add or replace entries, so this
        route is the only honest source. The read is a frozen snapshot of the live registry, so a later
        registration does not mutate a page already returned. DISCOVERY ONLY: a command runs by
        submitting the line through `POST /v1/harness/sessions/{session_id}/tasks`, which dispatches it
        in-process and records a normal turn; there is no second command-execution surface.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of command descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/queue:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Tasks]
      operationId: listSessionQueue
      summary: List the tasks waiting in this session's queue
      description: >-
        The turn rows whose status is `queued`, in the order the pump will take them, each with its
        position. This is a narrow projection of the same turn records the turn list pages through, and
        it exists because a queue panel must be cheap: a row carries a bounded prompt preview with its exact
        length, the target thread, the
        reference labels, and attachment counts, and no display tree, event, or attachment byte. The
        active (running) turn is not part of the queue; the session resource's `queue_depth` is the same
        count in one integer. A queued task is stopped with the session cancel (`all: true`) or by
        cancelling its thread; there is no per-task cancel that would silently drop a user's submit.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of queued tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedTaskPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Tasks]
      operationId: submitSessionTask
      summary: Submit a task, or steer a running conversation
      description: >-
        The single durable submit surface, and the only way to start or feed work. The server owns
        execution: the answer is a 202 receipt immediately and the work continues even if the client
        disconnects. Input is trimmed and bounded to 200,000 characters; empty or whitespace input is
        accepted only when at least one attachment is present. Text beginning with `/` is dispatched as
        a slash command in-process (no model request, no queue entry) and still produces a recorded
        turn; a command refuses attachments and references with 400 and ignores `thread_id`, because a
        command acts on the session rather than on one conversation.


        `thread_id` decides the destination. ABSENT opens a NEW host thread for the primary agent, so
        unfocused input becomes its own conversation without touching any other, and when the task
        references prior blocks the new thread is CONNECTED to the referenced threads - a reference
        edge, never ownership. PRESENT and RUNNING steers the text into that conversation at its next
        safe model boundary: no new turn record is created and the receipt names the OWNING turn with
        `steered: true`. A steered submit cannot expand a reference whose block has not completed, and
        the runtime's steering API carries text only, so either case becomes a QUEUED CONTINUATION in
        that thread instead (the receipt then has no `steered` marker). PRESENT and IDLE or STOPPED
        starts a continuation turn in that thread, reviving a stopped thread by this explicit host
        action and preserving its transcript while other threads keep running concurrently. An unknown
        or deleted `thread_id` is 404 before anything mutates.


        `references` names prior blocks whose completed content this task wants as context; malformed
        entries, unknown turn or label ids, and already-failed or cancelled blocks are all 400 before a
        turn exists. Typed `#LABEL` tokens inside `input` are also resolved server-side, so a client
        without metadata still works. Validation is complete up front: an oversized body is 413, an
        unusable media type or a kind that disagrees with its MIME is 415, a full queue is 429, and
        nothing is mutated by a refusal. Every new thread gets its own execution lane, so two unfocused
        submits run concurrently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
            examples:
              focused-continuation:
                summary: Continue one conversation
                value:
                  input: Now tighten the third section.
                  thread_id: 6f1c0d2e-4b7a-4c11-9a2e-0d5b7f9a1c22
              command:
                summary: Run a slash command
                value:
                  input: /task add "re-read the citations"
      responses:
        '202':
          description: Accepted; execution is owned by the server.
          headers:
            X-Harness-Revision:
              description: The session revision this receipt was produced at, for stream reconciliation.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/harness/sessions/{session_id}/reset:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Tasks]
      operationId: resetSession
      summary: Discard a session's conversation state
      description: >-
        Clears the recorded turns, transcripts, discovery, and created-tool state, leaving the session
        addressable with its frozen definition and settings intact. A session that is running or has
        queued work is refused with 409 - cancel it first - so a reset can never destroy work that has
        not been stopped. The receipt reports what was discarded and the new session revision; it does
        not echo the emptied aggregate.
      responses:
        '200':
          description: Reset receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetSessionResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/harness/sessions/{session_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Tasks]
      operationId: cancelSession
      summary: Stop the active run, and optionally drain the queue
      description: >-
        An absent body or `{}` cancels the active run only and leaves queued tasks untouched.
        `all: true` is the Stop button: it also drops every queued task, which stay recorded as
        `cancelled` turn rows rather than disappearing, so history stays honest. `cancelled: false` is
        a success, not an error: nothing was running and nothing was queued. Cancellation is durable and
        a client disconnect never causes it; only this route cancels work.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSessionRequest'
      responses:
        '200':
          description: Cancel outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSessionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/sessions/{session_id}/actions:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Actions]
      operationId: listSessionActions
      summary: List the owner questions still waiting for an answer
      description: >-
        Live pending requests only, in the order they were opened, at most 4 per session. Each entry is
        the verbatim `HarnessActionRequest` the model produced plus the routing context a reconnecting
        client needs to answer the right one: the turn whose run is parked, the conversation it came
        from, and the agent that asked. A request restored from disk is expired and is NOT listed,
        because its promise no longer exists - that is why this route, not an event replay, is the
        authority for "what is still waiting".
      responses:
        '200':
          description: Pending action list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/actions/{request_id}/answer:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Actions]
      operationId: answerSessionAction
      summary: Answer one owner question
      description: >-
        Answers with exactly one of the frozen choice shapes: `{ "kind": "option", "option_id": ... }`
        naming an option the model offered, or `{ "kind": "custom", "text": ... }` free text. The server
        validates the choice against the RECORDED request - an unknown option id or a malformed body is
        400 - and resolves that pending promise exactly once. Answering is allowed while the session is
        busy, because the run is parked waiting for this answer. Already answered or expired is 409. The
        response is deliberately minimal: the authoritative record is the persisted `action_answer` event
        on the turn, which every client can also see, so this route does not restate the choice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerActionRequest'
            examples:
              option:
                summary: Pick a recommended option
                value:
                  choice:
                    kind: option
                    option_id: keep
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/sessions/{session_id}/agents:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Session Agents]
      operationId: listSessionAgents
      summary: List this session's agent roster
      description: >-
        The live roster: the members of the frozen definition joined with the running agents, each row
        stating its role, where it came from (`definition` or `session`), the model it runs NOW, the
        model it would run if its session override were cleared, and the provenance of its current
        instruction text. Rows omit the instruction and guideline TEXT - one row per member stays
        constant-size however long the prompts are - and the roster itself is contract-bounded to 64
        entries, so this response has no page cursor by design. Membership is the frozen definition: a
        later global agent edit cannot add or remove a member here.
      responses:
        '200':
          description: Session agent roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAgentListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Session Agents]
      operationId: createSessionAgent
      summary: Bind a trusted profile into this session
      description: >-
        Creates a SESSION-LOCAL binding of an existing trusted profile, so `profile` must name a live
        global agent (404 otherwise). A client selects and re-instructs a profile; it cannot supply an
        implementation, a transport, a tool list, or a provider, which is why no route in this contract
        can inject agent code. `model` must be a non-empty model id and `instruction` bounded non-empty
        text; both are overrides recorded on the session and never on the profile. The binding exists in
        this session only - the global catalogue and every other session are untouched - and it must not
        collide with an existing roster key (409), because a session's agent keys are its delegation and
        identity namespace. A 65th binding is 409 against the 64-binding roster budget. `role: subagent`
        adds the binding to the primary's delegation allowlist for this session only; `role: primary`
        re-targets the entry agent of subsequent unfocused submits and is refused with 409 while the
        session is running. The new agent is immediately addressable by a task that names its thread. The
        frozen definition is not rewritten: `origin: session` is what distinguishes a local binding from
        an inherited member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionAgentRequest'
            examples:
              local-editor:
                summary: Bind the trusted editor profile for this conversation only
                value:
                  name: editor
                  profile: editor
                  instruction: You tighten prose. Never restructure headings.
                  role: subagent
      responses:
        '201':
          description: Created session-local binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAgentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/sessions/{session_id}/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Session Agents]
      operationId: getSessionAgent
      summary: Read one session agent binding
      description: >-
        The identified read of one roster row: identity, provenance, live and inherited model, instruction
        provenance, and the capability flags (`editable`, `deletable`, `restorable`) that tell a client
        which write it may offer. Instruction and guideline text still live on the instruction
        subresource, so one row read is a constant-size request.
      responses:
        '200':
          description: Session agent binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAgentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Session Agents]
      operationId: updateSessionAgent
      summary: Override one session agent's model or instruction
      description: >-
        Stated per field: an omitted property is no change, a string REPLACES that field, and an explicit
        `null` clears the session override and RESTORES the inherited binding - for `model` the model it
        would otherwise run, for `instruction` the harness, global, or catalogue text. That is what makes
        an override reversible without rebuilding the session, and the response states the resulting
        provenance. `{}` and an all-`null` body are both valid, the second clearing every override.
        Writes are session-local and never reach the global catalogue, the harness definition, or another
        session. Concurrency matches the session patch: accepted while running, an in-flight request keeps
        the model it started with. Identity, profile, tools, and the delegation graph are immutable here,
        so only selection-shaped data is writable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionAgentRequest'
            examples:
              restore-inherited-instruction:
                summary: Drop the local instruction override
                value:
                  instruction: null
      responses:
        '200':
          description: Mutated binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAgentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Session Agents]
      operationId: deleteSessionAgent
      summary: Remove one session agent binding
      description: >-
        Precisely what it removes. For a session-created binding (`origin: session`) it removes the agent
        from THIS session's roster: its default conversation is detached, it can no longer be targeted or
        delegated to, and its transcript stops growing. Already-recorded turns keep the agent name they ran
        with, because turn records are verbatim history and a delete must not rewrite them. For an
        inherited member (`origin: definition`) DELETE is 400 stating the alternative: clearing every
        session override with a `null` patch restores the inherited binding exactly, and an inherited
        member cannot be removed because its member set is frozen with the session and its delegation
        allowlist would become unresolvable. Nothing global changes in either case. A conversation still
        running or queued answers 409, matching thread deletion, so an agent cannot be pulled out from
        under its own run.
      responses:
        '200':
          description: Removal receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSessionAgentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/sessions/{session_id}/agents/{agent_id}/instruction:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Session Agents]
      operationId: getSessionAgentInstruction
      summary: Read one session agent's effective instruction
      description: >-
        The instruction text this agent actually runs with, plus its guidelines and the `source` that
        supplied the text: `session`, `harness`, `global`, or `catalogue`, resolved in that order. This
        is the session-scoped answer, so it already accounts for a session override - unlike the global
        definition's instruction route. It is the lazy surface behind a "show prompt" affordance: the
        roster and the session read never carry this text. A recorded conversation's actual system messages
        are a different thing and are served by the turn block detail route of kind `system`.
      responses:
        '200':
          description: Effective instruction text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInstructionTextResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/tools:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Session Tools]
      operationId: listSessionTools
      summary: List this session's toolbox
      description: >-
        The union the model actually sees: declared catalogue entries, the tools `toolRequest` enabled
        (in discovery order), and tools created at runtime. Each row is the catalogue projection plus the
        live session facts the catalogue cannot state: `declared` (this turn's run declares it), `enabled`
        (callable here), `origin` (`catalogue`, `discovered`, or `created`), `protected`, whether an
        editable source revision exists, and the created-tool budget. Rows omit the argument JSON Schema
        and the source text; the identified read adds the schema, the source route adds the code.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: enabled
          in: query
          required: false
          description: Filter to entries the model can call right now, or to entries withheld from it.
          schema:
            type: boolean
        - name: origin
          in: query
          required: false
          description: Filter by how the entry entered this session's toolbox.
          schema:
            type: string
            enum: [catalogue, discovered, created]
      responses:
        '200':
          description: Page of session tool rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToolPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Session Tools]
      operationId: createSessionTool
      summary: Register a session-local tool
      description: >-
        Declarative tool creation, the same capability the model already uses through `toolCreate`.
        `name` must match the registry-safe name pattern, `description` is bounded text, `tags` are
        REQUIRED because an untagged tool could never be discovered, and `parameters` is a JSON Schema
        bounded in depth (12), node count (256), and serialised size (16,384 bytes). Registration
        compiles a candidate and NEVER runs it, so creating a tool has no side effect until a call.
        TRUST: an optional function body or module text is compiled with the host realm's `Function`
        constructor and runs with the process's own permissions - there is no sandbox and no isolation,
        the same model as the `shell` tool - so submitting code is a capability grant and a deployment
        that does not grant it answers 403 here. A name this session already resolves is 409 unless the
        body sets `replace: true`, and a `protected` harness-owned name is 403 even with `replace`,
        because replacing the tools a session runs on would break that session's own control plane. A
        replacement does not consume the created-tool budget; a creation stops at it (409, with
        `budget` in the receipt stating used and limit). A created tool is registered searchable and
        enabled at once, so the next turn can call it without a discovery round. The whole effect is
        confined to this session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionToolRequest'
            examples:
              word-count:
                summary: A small created tool, searchable and enabled at once
                value:
                  name: word_count
                  description: Count words in a named text file
                  tags: [files, analysis]
                  parameters:
                    type: object
                    properties:
                      path:
                        type: string
                    required: [path]
                  source: 'return { words: String(args.path).split(/\s+/).length };'
      responses:
        '201':
          description: Registered session tool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToolRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /v1/harness/sessions/{session_id}/tools/{tool_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ToolId'
    get:
      tags: [Session Tools]
      operationId: getSessionTool
      summary: Read one session tool with its argument schema
      description: >-
        Everything a row carries, plus the `parameters` JSON Schema the model is given and the current
        source `revision` when one exists. The source TEXT is still not here - it is the source route -
        so a client that only needs to render or validate a call never pays for the code.
      responses:
        '200':
          description: Session tool detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToolResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Session Tools]
      operationId: updateSessionTool
      summary: Edit or re-enable one session tool
      description: >-
        An omitted property is no change and a supplied value REPLACES the whole field (arrays and schemas
        are replaced, never merged); at least one property is required, so `{}` is a 400 no-op. Metadata
        and gate changes do not mint a source revision. Supplying `source` or `module_text` goes through
        the registration kernel and publishes a NEW revision atomically, and a compile failure is 400 with
        the previous revision still callable - a broken edit can never take a live tool down. `enabled`
        is the reversible gate: `false` withdraws the tool from this session's callable set without losing
        anything, `true` restores the inherited binding exactly. A `protected` entry refuses every PATCH
        with 403, because disabling the tools a session runs on is not a user-level edit. Writes are
        session-local and never change the global catalogue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionToolRequest'
            examples:
              withdraw:
                summary: Withhold a tool from the model without unregistering it
                value:
                  enabled: false
      responses:
        '200':
          description: Registration outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToolRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    delete:
      tags: [Session Tools]
      operationId: deleteSessionTool
      summary: Remove one session tool registration
      description: >-
        What it actually does, stated in the receipt, because removal has two different outcomes:
        deleting a name that this session OVERRODE restores the inherited catalogue binding
        (`restored_inherited: true`), while deleting a name created in this session removes it until it is
        created again (`removed_created: true`). An inherited entry with no session-local registration has
        nothing to remove and answers 400, and a `protected` harness-owned entry answers 403 - the control
        plane is not deletable. Nothing global is touched either way.
      responses:
        '200':
          description: Removal receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSessionToolResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/sessions/{session_id}/tools/{tool_id}/source:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ToolId'
    get:
      tags: [Session Tools]
      operationId: getSessionToolSource
      summary: Read one tool's installed source revision
      description: >-
        The editable code bytes of the installed revision: `module_text`, or the function body of a body-shaped registration, plus
        any captured helper modules and the entry path a restore re-reads. `revision` is content-addressed,
        so a client can diff what is live against what it last sent instead of re-reading to find out.
        Absent `source_available` handling: a definition-registered tool has no editable source and answers
        404 with a message saying so, which is more honest than an empty string. This is the only route in
        the contract that returns source text, and it is a deliberate operator surface (a tool editor),
        never part of a render path.
      responses:
        '200':
          description: Installed source revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToolSourceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/tools/{tool_id}/executions:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ToolId'
    post:
      tags: [Session Tools]
      operationId: executeSessionTool
      summary: Execute a tool through this session's registry
      description: >-
        Manual execution that resolves through THIS session's live registry, which is the only way a
        session-bound control tool (`toolRegistry`, `toolRequest`, `toolCreate`, `task`, `delegate`), a
        replaced entry, or a runtime-created name can be called - those names exist only inside a
        conversation, and the global route has no session field to reach them with. The body carries
        `parameters` only: the session is already in the path, so there is no redundant session field and
        no way for a body to contradict the URL. Unknown tool in this session is 404 (a `delegate` entry
        absent from a session with no subagents is a 404 naming that reason). The session answers 409 when
        it is busy - an active run, a reset, or another manual call - so a manual mutation cannot race an
        operation the user is watching. A tool that fails at execution is a 200 with `ok: false`, identical
        to the global route. Registration and discovery side effects land in this session only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionToolExecutionRequest'
            examples:
              registry-read:
                summary: Read this session's tool registry
                value:
                  parameters:
                    action: list
      responses:
        '200':
          description: Execution outcome, successful or reported as a tool failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/harness/sessions/{session_id}/threads:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Threads]
      operationId: listSessionThreads
      summary: List this session's conversations
      description: >-
        A page of conversation rows in creation order: identity, owning agent, origin (`agent` for an
        agent's default conversation, `host` for an additional one), status, label, the parent thread for
        a delegated child, reference edges, and transcript SIGNALS only (`message_count`, `chars`,
        `has_transcript`, a preview of at most 280 characters). Rows carry NO messages, NO tool results, and
        NO invocation roster - a long transcript costs nothing in this list. A conversation whose stored
        transcript this build could not read is a row with `transcript_state: unreadable` plus the refusal
        reason, so one hand-broken transcript never costs the user the rest of the session.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: agent
          in: query
          required: false
          description: Exact agent name to filter by.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]*$'
        - name: status
          in: query
          required: false
          description: Filter conversations by lifecycle state.
          schema:
            type: string
            enum: [idle, running, stopped]
      responses:
        '200':
          description: Page of conversation rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Threads]
      operationId: createSessionThread
      summary: Open an additional conversation
      description: >-
        Opens a persistent host conversation for one member agent of this session's frozen definition.
        Nothing runs until a task names the returned thread, so creating a thread is free and lets a client
        set up parallel work lanes. `agent` must be a member (400 otherwise); `owner_thread_id` must name an
        existing HOST thread, because an agent's default conversation is implicit and is never persisted as
        a record that could be restored as an owner. A session at its 256-thread budget answers 409 naming
        the budget. The label is display-only: it grants no authority and is not an identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionThreadRequest'
      responses:
        '201':
          description: Created conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/sessions/{session_id}/threads/{thread_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ThreadId'
    get:
      tags: [Threads]
      operationId: getSessionThread
      summary: Read one conversation's metadata
      description: >-
        The full row for one conversation: everything the list projects plus the invocation roster
        (`invocation_ids`, oldest first - the join key to invocation cards inside turn events), the result
        blocks this conversation consumes, its connected conversations, and transcript metadata with its
        `revision`. Still no messages: those are the transcript routes. `invocation_ids` is bounded by the
        session's recorded-work budget and is truncated with an explicit `invocation_ids_truncated` flag
        rather than silently.
      responses:
        '200':
          description: Conversation metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Threads]
      operationId: deleteSessionThread
      summary: Delete one conversation
      description: >-
        Removes the conversation, its descendants, and their turns, result references, and transcripts,
        including the persisted copies. A running or queued conversation is refused with 409 - stop it
        first - and an agent's default `agent:<name>` conversation is not deletable (400: use reset),
        because it is implicit rather than a record. A repeat delete is 404. The receipt names what was
        removed and the resulting session revision; it never echoes the session aggregate.
      responses:
        '200':
          description: Deletion receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteThreadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/sessions/{session_id}/threads/{thread_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ThreadId'
    post:
      tags: [Threads]
      operationId: cancelSessionThread
      summary: Stop one conversation
      description: >-
        Aborts this conversation's live run and drops its queued continuations without touching any other
        conversation, so a focused Stop button stops exactly what the user is looking at. A delegated child
        is not cascaded: stopping a parent neither aborts nor purges a child that merely REFERENCES it,
        because a reference is an edge and not ownership - only `owner_thread_id` lineage is honoured. The
        thread is left `stopped`, which an explicit later submit to this thread revives.
        `cancelled: false` is a success: the conversation was idle with no work, so it was marked stopped.
      responses:
        '200':
          description: Stop outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelThreadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/harness/sessions/{session_id}/threads/{thread_id}/transcript:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ThreadId'
    get:
      tags: [Transcript]
      operationId: getThreadTranscript
      summary: Read one transcript's state and size
      description: >-
        The cheap head of a transcript: message count, exact character and byte size, the last-write
        `revision`, per-role counts, and `transcript_state` (`ok` or `unreadable`). When it is unreadable,
        `unreadable_reason` carries the validation refusal message and `stored_type` says what kind of JSON
        value is actually stored, which is everything an editor needs to decide whether to fetch the
        document. No message content travels here, so the roster can be open while a transcript is
        megabytes long.
      responses:
        '200':
          description: Transcript metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptMetadataResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Transcript]
      operationId: replaceThreadTranscript
      summary: Replace one transcript with a whole document
      description: >-
        The deliberate whole-document write - an editor's Save, or an operator's import - which is the only
        place a complete message list is sent in one body. `messages` is DELIBERATELY untyped arbitrary
        JSON, because a transcript is fully user-editable and a structurally broken value is a SUCCESSFUL
        write, not a 400: only an absent `messages` property (a malformed body) is a 400. On a broken value
        the server persists what it was given, keeps the conversation's LIVE transcript a valid placeholder,
        and answers `accepted_as: raw` with the structured `invalid` explanation - so an invalid draft is
        always stored and always explained, and an invalid transcript is never installed into the model's
        context. A running or queued conversation answers 409, so an edit cannot land mid-run. `if_revision` is the
        ONE optimistic lock in this API: supply the revision the document was edited from, and a mismatch is 409
        naming the current revision with nothing written - the general rule elsewhere is last-write-wins with no
        precondition, because no other resource is edited as a whole human-authored document. The receipt
        carries the new `revision`, the resulting message count, and nothing else; the client re-reads the
        page it needs rather than receiving the tree back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThreadTranscriptRequest'
            examples:
              broken-draft:
                summary: A hand-edited value that is not a valid transcript
                value:
                  messages:
                    - role: user
                      content: 42
      responses:
        '200':
          description: Write receipt with the validation outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptWriteReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /v1/harness/sessions/{session_id}/threads/{thread_id}/transcript/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ThreadId'
    get:
      tags: [Transcript]
      operationId: listThreadTranscriptMessages
      summary: Page through one transcript's messages
      description: >-
        The model-facing message list in conversation order, one page at a time. `cursor` is the ordinal of
        the first entry to return, so a client can jump to an end (`cursor` past the last entry answers an
        empty page plus `total`) or stream forward from a known point without re-reading. Every entry is a
        verbatim `HarnessMessage` in the shape the harness manipulates, and a tool entry may carry tool
        result text up to the model-facing 65,536-byte bound - which is exactly why this is a paged route.
        An unreadable transcript answers a valid placeholder list plus `transcript_state: unreadable`; the
        broken stored value is on the document route, never here.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: role
          in: query
          required: false
          description: Filter entries by role, so an operator can jump to the tool traffic.
          schema:
            type: string
            enum: [system, user, assistant, tool]
      responses:
        '200':
          description: Page of transcript entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptMessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/threads/{thread_id}/transcript/document:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ThreadId'
    get:
      tags: [Transcript]
      operationId: getThreadTranscriptDocument
      summary: Read one transcript as the editor's document
      description: >-
        The pretty-printed JSON text an editor edits, with the `revision` it was rendered from - the
        counterpart of the whole-document PUT, and the pair that makes transcript import and export an
        explicit, bounded, per-conversation operation instead of a side effect of reading a session. When
        the transcript is unreadable this returns the stored value verbatim, so what a client shows is what
        is actually saved and an operator can fix the real bytes. `content_type` is `application/json` with
        the document delivered as a JSON STRING field: the field is the text an editor needs verbatim,
        including formatting, which a re-serialised object could not preserve.
      responses:
        '200':
          description: Transcript document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptDocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/turns:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Turns]
      operationId: listSessionTurns
      summary: Page through recorded turns
      description: >-
        The renderable record, one page at a time, oldest first by default. Items are `TurnSummary` rows:
        everything a turn tile shows, computed server-side - id, index, a bounded prompt preview plus its exact
        length, status, the folded
        display state, thread identity and label, timestamps, the server-owned token tally, section and step
        counts, active agents, attachment chip summaries WITHOUT bulk bytes, result-reference summaries, the
        bounded steer audit ring, and the reference-picker block list. A row carries NO event array, NO
        `eventTimes`, NO display tree, NO full tool result, and NO instruction or reasoning text, which is
        what keeps one page of a long conversation a bounded request. Filters narrow the page, never the row
        shape.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: thread_id
          in: query
          required: false
          description: Restrict the page to one conversation.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Restrict the page to turns in one recorded status.
          schema:
            $ref: '#/components/schemas/SessionTurnStatus'
        - name: order
          in: query
          required: false
          description: >-
            `asc` is recorded order (the default, and the only order a cursor is stable across). `desc`
            answers newest first for a tail-following client, and its cursor is a different ordinal space.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Page of turn rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/turns/{turn_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TurnId'
    get:
      tags: [Turns]
      operationId: getSessionTurn
      summary: Read one turn's record metadata
      description: >-
        The durable record of one task, addressed as history rather than as a render target: recorded
        identity (`id`, `index`, `status`, `prompt`, `thread_id`, `thread_label`), timing, the
        server-summed usage, the recorded failure when there is one, the result references, the bounded
        steer audit ring, and COUNTS for the heavy members - `event_count`, `event_time_count`,
        `attachment_count`, `steer_text_count` - instead of the arrays. That count set is what a transcript
        copy or export client needs to decide how many follow-up reads to make; the arrays themselves are
        on the events, attachments, and display routes.
      responses:
        '200':
          description: Turn record metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/turns/{turn_id}/display:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TurnId'
    get:
      tags: [Turns]
      operationId: getTurnDisplay
      summary: Read one turn's compiled display tree
      description: >-
        The display projection of exactly one turn: sections (one per agent flow, nesting resolved
        server-side so a renderer never infers a parent), each with its ordered nodes, its tool and action
        steps, the ONE context bar as metadata, and the designated current tail. Text inside is bounded -
        previews are 200 to 320 characters depending on the payload, each with the EXACT recorded `chars` -
        except the designated full payloads named by a section's `answerNodeId` and `tail`, which are the
        complete recorded bytes. Absent means absent: this tree carries no event list, no transcript, and
        no sibling turns, so opening one turn costs one bounded request however long the session is.
      responses:
        '200':
          description: Turn display tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnDisplayResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/turns/{turn_id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TurnId'
    get:
      tags: [Turns]
      operationId: listTurnEvents
      summary: Page through one turn's recorded events
      description: >-
        The verbatim recorded event stream of one turn - the same stored bytes the journal holds - which is
        the debug and transcript-copy surface, never a UI default. `cursor` is the event ordinal to start
        at, matching the `(turnId, index)` locator of `src/server/journal.ts`, so an index seen in a step
        detail or a context block resolves here and to nothing else. Each item pairs the event with its
        `index` and its `at` from `eventTimes`, keeping the two parallel arrays addressable without a
        client re-pairing them. A running turn answers the events recorded SO FAR plus `partial: true`, and
        a later page continues from `next_cursor`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          required: false
          description: >-
            Filter to one event type (`tool_result` alone, for example). The filter applies to the page and
            `next_cursor` still addresses the unfiltered ordinal space.
          schema:
            $ref: '#/components/schemas/HarnessEventType'
      responses:
        '200':
          description: Page of recorded events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/turns/{turn_id}/steps/{step_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TurnId'
      - $ref: '#/components/parameters/StepId'
    get:
      tags: [Turns]
      operationId: getTurnStepDetail
      summary: Read one step's recorded request and result together
      description: >-
        The on-click answer for one tool or action row: the OPENING event and the RESULT event, both
        verbatim, each with its index and its recorded `at`. They come together because the full request
        (`arguments`) and the full response (`content`, every panel, every media descriptor) are what a
        details dialog must draw at once, and fetching them separately would double the round trips and
        could pair same-name siblings differently. Nothing is truncated here and nothing is re-projected:
        the pair is retrievable exactly, before or after a restart, from the durable record. `result` is
        absent while the step is still running or for a call that never settled, which is the honest answer
        rather than a synthesized one. `step_id` is the opening event's index as a decimal string, so a
        click needs no lookup and the id survives a display-tree rebuild.
      responses:
        '200':
          description: Step detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnStepDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/turns/{turn_id}/blocks/{block_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TurnId'
      - $ref: '#/components/parameters/BlockId'
    get:
      tags: [Turns]
      operationId: getTurnBlockDetail
      summary: Read one context segment's recorded text
      description: >-
        One segment of one turn's context bar answered with its own metadata plus its recorded TEXT, for
        any kind: prompt, instruction, reasoning, an earlier answer, or a tool call. Served from the durable
        record - the turn's events over the block's `event_from..event_to` range, its prompt or steered
        submits, or the turn's persisted instruction sources - so it answers identically live, after a
        restart, and for a session folded from a checkpoint that has no journal. Exactly one payload shape
        applies per kind: `text` for a user, reasoning, or assistant segment; `args` and `result` for a
        tool's two halves; `entries` for a system segment (one entry per recorded system message, in send
        order, which is how "what prompt did this agent actually run" is answered). A segment the bar never
        minted, or one dropped with a discarded attempt, is 404, and a blank id is 400. The turn and block
        identity are echoed inside the payload so a late answer can be matched to the click that asked.
      responses:
        '200':
          description: Context segment detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnBlockDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/sessions/{session_id}/turns/{turn_id}/attachments/{attachment_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TurnId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Turns]
      operationId: getTurnAttachment
      summary: Read one attachment's recorded bytes
      description: >-
        The lazy media surface for one attachment: descriptors ride the turn row (`DisplayAttachmentSummary`)
        and the turn metadata counts, and the canonical base64 exists only here. `attachment_id` is the
        attachment's own stable id, unique within the turn, so a preview can be updated in place and a
        snapshot round-trips; it is never an array position. The contract caps one attachment at 4,194,304
        decoded bytes, so this response is bounded by a declared number rather than by hope. No file is
        served from a path: bytes come from the recorded turn, which is why no unsafe path-based access
        exists anywhere in this API.
      responses:
        '200':
          description: Attachment bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/harness/stream:
    get:
      tags: [Stream]
      operationId: openUpdateStream
      summary: Open the update stream (WebSocket upgrade)
      description: >-
        THE live-update surface, and the only one. `GET` on this path is an HTTP upgrade handshake, not a
        streamed read: the answer is `101 Switching Protocols` and the connection then carries a
        bidirectional, ordered, cursor-based conversation. OpenAPI 3.0 has no way to describe a
        bidirectional message conversation, so this operation describes the handshake it CAN express (the
        `101` response with its upgrade headers) plus the conversation in the `x-websocket` extension on
        this operation, whose message unions are the concrete `components.schemas` `WsClientMessage` and
        `WsServerMessage` with worked examples. Standard OAS tooling validates the HTTP half of this
        operation and treats `x-websocket` as vendor data: the message unions are normative for
        implementations even though a generic validator will not enforce them. A separate contract file is
        NOT required, because the schemas live in this document's `components.schemas` and are the same
        objects the REST reads return - one vocabulary, one source of truth.


        WHAT THE STREAM IS FOR. Telling a client that something changed, and shipping the small bounded
        delta that goes with it. A frame never carries a session tree, a snapshot, an event array, a
        transcript, instruction text, tool source, or attachment bytes. When a client needs more than the
        delta, the frame names the REST resource to read. Every mutation is a REST write: the stream issues
        no commands that change server state, so there is exactly one way to mutate a resource. Closing the
        connection cancels nothing - execution is owned by the server, and a dropped or slow client never
        aborts a run.


        SCOPES. A subscription names exactly one scope: `global` (catalogue and configuration invalidations),
        `session` (row upserts, queue depth, status, actions, usage), `thread` (transcript and roster
        invalidations), or `turn` (display ops and step sets). A UI that shows one conversation subscribes to
        one `session` scope and one `turn` scope; it never subscribes to `events` unless raw event frames are
        explicitly requested, because raw events are the debug payload, not the render payload.


        RECONCILIATION WITHOUT A SNAPSHOT. On subscribe the server answers `subscription_state` with the
        epoch, the current `sequence`, the opaque `cursor`, and `revisions`: the current revision of every
        resource family that scope publishes. The client then performs its REST reads. Because the
        subscription is registered before that answer is sent, the state captured at registration is atomic:
        every `update` frame with `sequence` at or below the `subscription_state` sequence is already reflected
        in a read issued afterwards, so the client DROPS those frames, and every frame above it is applied. A
        read that returns a resource `revision` at or above the revision recorded in `revisions` is
        authoritative and supersedes any pending frame for that resource. This closes the read-versus-subscribe
        gap without transferring history.


        ORDERING, CURSORS, AND REPLAY. Frames are per-subscription, strictly monotonic in `sequence`, and
        lossless: there are no coalesced or lossy token patches, so there is no partial-text reconciliation
        rule to get wrong - a gap is always explicit and always resolved by `resync_required`. A `cursor` is
        an opaque base64url encoding of `epoch` plus `sequence`; the journal's `(turn_id, index)` locator is
        NOT used as a stream cursor, because it addresses recorded events inside one turn and cannot order a
        transcript edit, a registry change, or a queue mutation. Replay is retained per subscription for
        512 frames or 60 seconds, whichever ends first. A cursor older than that, or one from another epoch,
        is refused with `resync_required` naming the REST resources to re-read.


        RECONNECT AND RESUME. There is exactly ONE resume input: the client's first `hello` frame, which carries
        the last `epoch` and `cursor` it processed. The HTTP handshake carries no resume state at all (no query
        parameter, no header) - it only upgrades the connection and negotiates the subprotocol - so there is no
        second place a cursor could be sent and no precedence rule to remember. A `hello` that arrives after the
        first `subscribe` is refused as `late_hello` and has no effect; the connection stays usable. A matching
        epoch replays the retained frames; a mismatched epoch answers `resync_required{ reason: epoch_mismatch }`
        and the client re-reads the resources it cares about, bounded by their own pages, never one whole-session
        read.


        SUBSCRIPTION REGISTRATION AND THE READ BASELINE. A subscription is registered when its `subscribe` frame
        is processed, and registration is atomic: the same instant fixes the revision baseline reported in
        `subscription_state.revisions` AND the point from which frames are buffered. So a client that subscribes
        first and reads REST second can drop every frame at or below `subscription_state.sequence` (the read
        already reflects them) and apply every frame above it. A `subscribe` naming a session, thread, or turn
        that does not exist is refused with `unknown_resource` for THAT `subscription_id`; the connection and the
        other subscriptions keep working, so one stale id cannot take a UI down.


        VALIDATION PRECEDENCE. One deterministic order, applied per client frame: (1) the frame must be a UTF-8
        JSON text object - otherwise 1003 or `frame_too_large` for an oversize frame; (2) its `type` must exist
        in `WsClientMessage` and the frame must validate against that member - any failure is `invalid_payload`,
        because a scope value outside the fixed four (or any other enum violation) is a schema failure, not a
        separate condition; (3) a frame that validates but names a required resource id that does not exist is
        `unknown_resource`; (4) a frame that validates and whose `filters` entry is not published for that scope
        is `unsupported_filter`; (5) only then are the budgets checked (`too_many_subscriptions`, `rate_limited`).
        A schema failure therefore never also reports a scope or budget condition, and there is no negotiated or
        build-specific scope outside the fixed `WsSubscriptionScope` enum.


        HEARTBEAT, BACKPRESSURE, AND LIMITS. All numbers are the target contract's, stated in `x-websocket` and
        handed to the client in `welcome.limits` (`WsStreamLimits`), so a client reads them from the connection it
        is on instead of assuming them, and no prose number differs from a schema number. `x-websocket` classifies
        which of them a deployment may retune and which are fixed by the contract.
      responses:
        '101':
          description: >-
            Switching Protocols. The connection is now the WebSocket conversation described by
            `x-websocket`; the server sends `welcome` first, then one `subscription_state` per subscription.
          headers:
            Upgrade:
              description: '`websocket`, echoing the requested upgrade token.'
              schema:
                type: string
                example: websocket
            Connection:
              description: '`Upgrade`.'
              schema:
                type: string
                example: Upgrade
            Sec-WebSocket-Protocol:
              description: >-
                The negotiated subprotocol, always `harness.v1`. A client that did not offer it gets a
                subprotocol-less upgrade and must not assume the vocabulary.
              schema:
                type: string
                example: harness.v1
            X-Harness-Epoch:
              description: >-
                The current server epoch. It changes on every restart, which is how a client learns that any
                cursor it retained is dead before it sends a single frame.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-websocket:
        subprotocol: harness.v1
        framing:
          frame_types: [text]
          payload_encoding: utf-8 json, one message object per text frame
          max_client_frame_bytes: 16384
          max_server_frame_bytes: 65536
          client_messages_per_second: 32
        handshake:
          method: GET
          upgrade: websocket
          required_headers: [Upgrade, Connection, Sec-WebSocket-Key, Sec-WebSocket-Version]
          response_status: 101
          authentication: >-
            None. The host's Origin gate may refuse the upgrade with 403 before it is accepted, which is a
            policy refusal, not an authentication challenge. No credential is defined for this conversation, and
            the handshake carries NO query parameter or resume header: `GET /v1/harness/stream` takes no
            parameters at all, so the only resume input in the contract is the client's `hello` frame.
        resume:
          input: hello_frame_only
          handshake_carries_resume_state: false
          hello_must_precede_first_subscribe: true
          late_hello_code: late_hello
          rules: >-
            One canonical resume path, stated so a client never has to decide which of two inputs wins: the
            handshake only upgrades the connection, `hello` (optional, first frame only) carries `epoch` and
            `cursor`, and each `subscribe` may carry a `cursor` to resume THAT subscription from. A `hello`
            arriving after the first `subscribe` is refused with `late_hello` and changes nothing, and a
            subscribe-level cursor is authoritative for its own subscription over any `hello` cursor. There is no
            conflict to arbitrate, because the scopes of the two inputs do not overlap.
        message_unions:
          client_to_server:
            schema: WsClientMessage
            schema_ref: '#/components/schemas/WsClientMessage'
          server_to_client:
            schema: WsServerMessage
            schema_ref: '#/components/schemas/WsServerMessage'
          discriminator: type
          rule: >-
            A frame that does not validate against its union is a protocol error: the server answers
            `WsProtocolError` with `code: invalid_payload` and keeps the connection open, unless three
            consecutive frames are invalid, in which case it closes with 1007.
        validation_precedence:
          order:
            - frame_is_json_text_object
            - client_union_schema_valid
            - hello_only_as_first_frame
            - subscription_id_known_for_ack_unsubscribe_ping
            - required_resource_exists
            - filter_supported_for_scope
            - budgets_and_rates
          mapping:
            - { failure: not_json_or_too_large, code: frame_too_large, close: 1003_or_1009 }
            - { failure: union_schema_failure, code: invalid_payload, close: 1007_after_three_consecutive }
            - { failure: hello_after_first_subscribe, code: late_hello, close: none }
            - { failure: unknown_or_closed_subscription_id, code: unknown_subscription, close: none }
            - { failure: unknown_session_thread_turn_id, code: unknown_resource, close: none }
            - { failure: filter_not_published_for_scope, code: unsupported_filter, close: none }
            - { failure: subscription_budget_full, code: too_many_subscriptions, close: 4401 }
            - { failure: client_rate_exceeded, code: rate_limited, close: 4429 }
          rule: >-
            Exactly one condition is reported per frame, in this order, so a scope value outside the fixed enum
            (which IS a schema failure) can never also be reported as a resource or budget problem, and a
            resource that does not exist can never be reported as a schema error. The scope set is closed: there
            is no negotiated, negotiated-at-runtime, or build-specific scope outside `WsSubscriptionScope`.
            `internal` is the only code outside the table, reserved for a server-side failure of an otherwise
            valid frame.
        subscription_scopes:
          - scope: global
            ids_required: []
            ids_forbidden: [session_id, thread_id, turn_id]
            publishes: [catalogue.updated, config.updated]
            optional_filters: []
            events_filter_allowed: false
            notes: >-
              Invalidation only. A client re-reads `GET /v1/harness/harnesses`, `/agents`, `/tools`, or
              `/config`, each of which is already a bounded page.
          - scope: session
            ids_required: [session_id]
            ids_forbidden: [thread_id, turn_id]
            publishes: [session.updated, turn.upsert, turn.removed, action.opened, action.closed, usage.updated, thread.upsert, thread.removed, tool.registry_updated, agent.registry_updated, run.event]
            optional_filters: [status, thread_id, events]
            events_filter_allowed: true
            notes: >-
              `events` is a FILTER on this scope (see `WsSubscriptionFilters.events`), not a separate scope: it
              adds the `run.event` kind, which is listed in `publishes` so every kind has a reachable publishing
              scope. The filter defaults to false, and a UI render path never turns it on, which is what keeps
              raw event text out of normal traffic. A `thread_id` filter narrows the conversation whose rows and
              ops are published; it does not change the required id set.
          - scope: thread
            ids_required: [session_id, thread_id]
            ids_forbidden: [turn_id]
            publishes: [transcript.updated, thread.upsert]
            optional_filters: []
            events_filter_allowed: false
            notes: >-
              Carries counts and a revision, never message bodies: a transcript edit says "revision N, M entries"
              and the client pages `GET .../transcript/messages` for the content it is showing. `status`,
              `sections`, `context`, and `events` are not supported here and answer `unsupported_filter`, because
              this scope publishes none of the kinds those filters gate.
          - scope: turn
            ids_required: [session_id, turn_id]
            ids_forbidden: [thread_id]
            publishes: [display.ops, usage.updated, turn.upsert]
            optional_filters: [sections, context]
            events_filter_allowed: false
            notes: >-
              The only high-frequency scope. `sections: false` suppresses node and step payloads and keeps the
              metadata-only frames; `context: false` suppresses `context:*` ops for a client not drawing the
              context bar. `status` and `events` are not supported here and answer `unsupported_filter`.
        ordering:
          sequence_space: per subscription, starting at 0 with `subscription_state` and increasing by one per frame
          cursor: opaque base64url of `epoch:sequence`; never parsed by a client
          delivery: "ordered and unacknowledged by default; a pace of `ack` makes the server wait for `ack` on that subscription"
          monotonic_rule: >-
            Two frames for the same resource always arrive in mutation order, and a frame's `at` is the server
            clock time of the mutation, not of the send, so a client can order across subscriptions by `at`.
          atomic_registration: >-
            The state captured for `subscription_state` and the point from which frames are buffered for this
            subscription are the same instant, which is why the revision comparison above has no race.
        replay:
          retained_frames_per_subscription: 512
          retained_seconds: 60
          expired_response: resync_required
          expired_reasons: [cursor_expired, epoch_mismatch]
          dropped_reason: frames_dropped
          reason_rule: >-
            `resync_required` is the frame; the REASON states the cause, and the set is closed to three values
            (see `WsResyncRequired.reason`). A cursor older than the retention window or from another epoch is
            `cursor_expired` / `epoch_mismatch` at reconnect; frames lost while the connection stayed open are
            `frames_dropped`. A filter that a scope does not publish is never a resync reason: it is refused at
            subscribe time by `WsProtocolError{ code: unsupported_filter }`.
          restart_rule: >-
            An epoch change invalidates every retained cursor; the server closes live connections with 1012 and
            a reconnect answers `resync_required{ reason: epoch_mismatch }`.
        resync: >-
          `WsResyncRequired` carries a reason and a short list of `WsResourceLink` entries - resource family,
          ids, and the concrete REST path to read. It never carries a payload of the resource itself, so the
          recovery cost is exactly the page the client needs.
        heartbeat:
          interval_ms: 15000
          server_frame: heartbeat
          client_reply_frame: pong
          timeout_intervals: 3
          timeout_close_code: 4408
          note: >-
            The server pings; a client answers `pong` with the echoed `at`. Silence for three intervals closes
            the connection, which is how a half-open browser tab stops holding a subscription open.
        backpressure:
          send_queue_frames: 256
          send_queue_bytes: 1048576
          policy: >-
            When a connection's send queue is full the server drops the OLDEST droppable `update` frames per
            subscription, oldest first, never a `welcome`, `subscription_state`, `resync_required`, `error`,
            `heartbeat`, or `pong`, and never a frame that would leave a display op stream half-applied inside
            one frame. It then emits `resync_required{ reason: backpressure }` for each affected subscription,
            so loss is always explicit and always recoverable by a bounded read.
          sustained_stall_ms: 10000
          sustained_stall_close_code: 1013
          ack_paced_rule: >-
            For a subscription with `pace: ack`, the server withholds new frames until `ack` names the highest
            sequence it has sent; an `ack` that never arrives for 5000 ms converts that subscription to
            `resync_required` rather than queueing without bound.
        limits:
          subscriptions_per_connection: 64
          ops_per_update_frame: 32
          delta_chars_per_append_op: 2000
          events_per_update_frame: 16
          ids_per_invalidation_frame: 64
          max_client_frame_bytes: 16384
          max_server_frame_bytes: 65536
          client_messages_per_second: 32
          heartbeat_interval_ms: 15000
          heartbeat_timeout_intervals: 3
          heartbeat_timeout_close_code: 4408
          replay_frames: 512
          replay_seconds: 60
          send_queue_frames: 256
          send_queue_bytes: 1048576
          sustained_stall_ms: 10000
          ack_timeout_ms: 5000
          exceeded_subscription_close_code: 4401
          exceeded_rate_close_code: 4429
          revision_records_per_state: 20
        limits_are_one_source: >-
          Every number in this map is the SAME constant as the `WsStreamLimits` property of the same name, whose
          `default` carries the identical value, and `welcome.limits` is a required field of `WsWelcome`. The
          prose in `framing`, `heartbeat`, `replay`, and `backpressure` restates these constants rather than
          adding new ones, so a machine check can compare extension, schema, and the frame a client actually
          receives. `revision_records_per_state` is the size of the per-scope revision baseline array.
        configurability:
          fixed_by_contract:
            - ops_per_update_frame
            - delta_chars_per_append_op
            - events_per_update_frame
            - ids_per_invalidation_frame
            - max_client_frame_bytes
            - max_server_frame_bytes
            - heartbeat_interval_ms
            - heartbeat_timeout_intervals
            - heartbeat_timeout_close_code
            - replay_frames
            - replay_seconds
            - revision_records_per_state
          deployment_tunable_within_declared_bounds:
            - subscriptions_per_connection
            - client_messages_per_second
            - send_queue_frames
            - send_queue_bytes
            - sustained_stall_ms
            - ack_timeout_ms
          rule: >-
            A `fixed_by_contract` value is the same on every deployment, so a client may hard-code it and a test
            may assert it. A `deployment_tunable_within_declared_bounds` value may be retuned by the host, but
            never outside the `minimum` and `maximum` the property declares, and the value IN FORCE is always
            delivered in `welcome.limits`, which is therefore the only source a client may rely on at runtime. A
            deployment never invents a new scope, kind, or close code.
        close_codes:
          - { code: 1000, reason: normal_closure, side: either, meaning: A clean goodbye, sent by `bye` or by a client closing. }
          - { code: 1001, reason: going_away, side: server, meaning: Host shutdown while background work drains. }
          - { code: 1002, reason: protocol_error, side: server, meaning: A frame the conversation cannot honour. }
          - { code: 1003, reason: unsupported_data, side: server, meaning: 'A non-text frame: this conversation is JSON text only.' }
          - { code: 1007, reason: invalid_payload, side: server, meaning: Three consecutive frames failed the client union. }
          - { code: 1008, reason: policy, side: server, meaning: The Origin gate refused this upgrade peer. }
          - { code: 1009, reason: message_too_big, side: server, meaning: A client frame above the advertised `max_client_frame_bytes`. }
          - { code: 1012, reason: restart, side: server, meaning: The server epoch changed; every retained cursor is dead. }
          - { code: 1013, reason: try_again_later, side: server, meaning: Send queue stalled beyond the advertised `sustained_stall_ms`. }
          - { code: 4401, reason: too_many_subscriptions, side: server, meaning: The advertised `subscriptions_per_connection` budget is full. }
          - { code: 4408, reason: heartbeat_timeout, side: server, meaning: No `pong` for the advertised `heartbeat_timeout_intervals`. }
          - { code: 4429, reason: rate_limited, side: server, meaning: More than the advertised `client_messages_per_second`. }
        kind_payload_matrix: >-
          Normative and exhaustive; the machine-checked form is the 15 per-kind variants under `WsUpdate`
          (`WsUpdateSession`, `WsUpdateTurnUpsert`, `WsUpdateTurnRemoved`, `WsUpdateDisplayOps`, `WsUpdateUsage`,
          `WsUpdateActionOpened`, `WsUpdateActionClosed`, `WsUpdateThreadUpsert`, `WsUpdateThreadRemoved`,
          `WsUpdateTranscript`, `WsUpdateToolRegistry`, `WsUpdateAgentRegistry`, `WsUpdateRunEvent`,
          `WsUpdateCatalogue`, `WsUpdateConfig`), each with `additionalProperties: false`. Metadata (`type`,
          `subscription_id`, `sequence`, `cursor`, `kind`, `at`) is always required. Payloads: `session.updated`
          carries `session`; `turn.upsert` carries `turn`; `turn.removed` carries `turn_id` and is otherwise
          payload-free; `display.ops` carries `turn_id` AND `ops`; `usage.updated` carries `usage_patch` and
          optionally `turn_id`; `action.opened` carries `action`; `action.closed` carries `action_closed`;
          `thread.upsert` carries `thread`; `thread.removed` carries `thread_id`; `transcript.updated` carries
          `transcript`; `tool.registry_updated` and `agent.registry_updated` carry a non-empty `ids` array;
          `run.event` carries `turn_id` AND `events`; `catalogue.updated` carries `catalogue` AND `ids`;
          `config.updated` carries NO payload field at all, because the global configuration is one named
          resource with no id set, so the subscription itself identifies it. Any other combination fails
          validation rather than being reconciled by convention, and an invalidation kind never carries a body.
        examples:
          - name: open-subscribe-pace-probe-goodbye
            direction: client_to_server
            frames:
              - { type: hello, protocol: harness.v1, epoch: 9f2c17a4, cursor: OWYyYzE3YTQ6MQ }
              - { type: subscribe, subscription_id: s1, scope: session, session_id: 8c1b-uuid, filters: { status: running } }
              - { type: subscribe, subscription_id: s2, scope: turn, session_id: 8c1b-uuid, turn_id: 4d7a-uuid, pace: ack }
              - { type: subscribe, subscription_id: s3, scope: session, session_id: 8c1b-uuid, filters: { events: true } }
              - { type: subscribe, subscription_id: sg, scope: global }
              - { type: ack, subscription_id: s2, sequence: 12 }
              - { type: ping, at: 1762250003000 }
              - { type: bye, reason: tab-closed }
          - name: welcome-subscription-state-then-ordered-deltas
            direction: server_to_client
            frames:
              - type: welcome
                protocol: harness.v1
                epoch: 9f2c17a4
                at: 1762250001000
                limits:
                  subscriptions_per_connection: 64
                  ops_per_update_frame: 32
                  delta_chars_per_append_op: 2000
                  events_per_update_frame: 16
                  ids_per_invalidation_frame: 64
                  max_client_frame_bytes: 16384
                  max_server_frame_bytes: 65536
                  client_messages_per_second: 32
                  heartbeat_interval_ms: 15000
                  heartbeat_timeout_intervals: 3
                  heartbeat_timeout_close_code: 4408
                  replay_frames: 512
                  replay_seconds: 60
                  send_queue_frames: 256
                  send_queue_bytes: 1048576
                  sustained_stall_ms: 10000
                  ack_timeout_ms: 5000
                  revision_records_per_state: 20
              - type: subscription_state
                subscription_id: s1
                scope: session
                epoch: 9f2c17a4
                sequence: 0
                cursor: OWYyYzE3YTQ6MA
                replayed_frames: 0
                filters_applied: { status: running }
                publishes: [session.updated, turn.upsert, turn.removed, action.opened, action.closed, usage.updated, thread.upsert, thread.removed, tool.registry_updated, agent.registry_updated]
                revisions:
                  - { resource: session, id: 8c1b-uuid, revision: 12, epoch: 9f2c17a4 }
                  - { resource: turns, id: 8c1b-uuid, revision: 41, epoch: 9f2c17a4 }
                  - { resource: queue, id: 8c1b-uuid, revision: 6, epoch: 9f2c17a4 }
                  - { resource: actions, id: 8c1b-uuid, revision: 3, epoch: 9f2c17a4 }
                  - { resource: usage, id: 8c1b-uuid, revision: 39, epoch: 9f2c17a4 }
                  - { resource: threads, id: 8c1b-uuid, revision: 7, epoch: 9f2c17a4 }
                  - { resource: session_agents, id: 8c1b-uuid, revision: 2, epoch: 9f2c17a4 }
                  - { resource: session_tools, id: 8c1b-uuid, revision: 5, epoch: 9f2c17a4 }
              - type: update
                subscription_id: s1
                sequence: 1
                cursor: OWYyYzE3YTQ6MQ
                at: 1762250002500
                kind: session.updated
                session: { id: 8c1b-uuid, status: running, queue_depth: 1, revision: 13 }
              - type: update
                subscription_id: s2
                sequence: 1
                cursor: OWYyYzE3YTQ6MQ
                at: 1762250002510
                kind: display.ops
                turn_id: 4d7a-uuid
                ops:
                  - { op: 'node:insert', turnId: 4d7a-uuid, sectionId: '4d7a-uuid:1', node: { kind: text, id: '9', committed: false, chars: 0 } }
                  - { op: 'node:append', turnId: 4d7a-uuid, sectionId: '4d7a-uuid:1', nodeId: '9', delta: 'Measuring the repo now' }
          - name: cursor-expired
            direction: server_to_client
            frames:
              - type: resync_required
                subscription_id: s1
                reason: cursor_expired
                epoch: 9f2c17a4
                cursor: OWYyYzE3YTQ6Mjg
                lost_frames: 512
                resources:
                  - { resource: turns, id: 8c1b-uuid, revision: 41, epoch: 9f2c17a4, link: '/v1/harness/sessions/8c1b-uuid/turns?limit=25' }
                  - { resource: actions, id: 8c1b-uuid, revision: 3, epoch: 9f2c17a4, link: '/v1/harness/sessions/8c1b-uuid/actions' }
          - name: one-frame-per-remaining-update-kind
            direction: server_to_client
            frames:
              - type: update
                subscription_id: s0
                sequence: 4
                cursor: OWYyYzE3YTQ6NA
                at: 1762250016090
                kind: turn.removed
                turn_id: 4d7a-uuid
              - type: update
                subscription_id: s0
                sequence: 5
                cursor: OWYyYzE3YTQ6NA
                at: 1762250016100
                kind: turn.upsert
                turn: { id: 4d7a-uuid, index: 4, promptPreview: Survey the repo, promptChars: 16, status: running, state: streaming, updatedAt: 1762250016100, sectionCount: 1, stepCount: 0, activeAgents: [writer], blocks: [] }
              - type: update
                subscription_id: s0
                sequence: 5
                cursor: OWYyYzE3YTQ6NA
                at: 1762250016110
                kind: usage.updated
                usage_patch: { revision: 40, turn_id: 4d7a-uuid, latest_input: 812, cached_input: 640 }
              - type: update
                subscription_id: s0
                sequence: 6
                cursor: OWYyYzE3YTQ6NA
                at: 1762250016120
                kind: action.opened
                action:
                  request: { requestId: req-1, question: 'Keep this heading?', recommended: keep, options: [{ id: keep, label: Keep }, { id: drop, label: Drop }], allowCustom: true }
                  turn_id: 4d7a-uuid
                  agent: writer
                  received_at: 1762250016120
              - type: update
                subscription_id: s0
                sequence: 7
                cursor: OWYyYzE3YTQ6NA
                at: 1762250016130
                kind: action.closed
                action_closed: { request_id: req-1, reason: answered }
              - type: update
                subscription_id: s0
                sequence: 8
                cursor: OWYyYzE3YTQ6NA
                at: 1762250016140
                kind: thread.upsert
                thread: { id: 6f1c-uuid, agent: writer, origin: host, status: running, sequence: 2, transcript_state: ok, message_count: 4, has_transcript: true }
              - type: update
                subscription_id: s0
                sequence: 9
                cursor: OWYyYzE3YTQ6NA
                at: 1762250016150
                kind: thread.removed
                thread_id: 6f1c-uuid
              - type: update
                subscription_id: s4
                sequence: 10
                cursor: OWYyYzE3YTQ6MTA
                at: 1762250016160
                kind: transcript.updated
                transcript: { thread_id: 6f1c-uuid, revision: 9, message_count: 5, transcript_state: ok }
              - type: update
                subscription_id: s0
                sequence: 11
                cursor: OWYyYzE3YTQ6MTE
                at: 1762250016170
                kind: tool.registry_updated
                ids: [word_count, glob]
              - type: update
                subscription_id: s0
                sequence: 12
                cursor: OWYyYzE3YTQ6MTI
                at: 1762250016180
                kind: agent.registry_updated
                ids: [editor]
              - type: update
                subscription_id: sg
                sequence: 1
                cursor: OWYyYzE3YTQ6MQ
                at: 1762250016190
                kind: catalogue.updated
                catalogue: harnesses
                ids: [writer]
              - type: update
                subscription_id: sg
                sequence: 2
                cursor: OWYyYzE3YTQ6Mg
                at: 1762250016200
                kind: config.updated
              - type: update
                subscription_id: s3
                sequence: 1
                cursor: OWYyYzE3YTQ6MQ
                at: 1762250016210
                kind: run.event
                turn_id: 4d7a-uuid
                events:
                  - { index: 12, at: 1762250016210, event: { type: tool_call, agent: writer, call: { id: call_1, name: glob, arguments: '{"pattern":"src/**"}' } } }
              - { type: heartbeat, at: 1762250016220 }
              - { type: pong, at: 1762250016220 }
          - name: protocol-error-keeps-connection
            direction: server_to_client
            frames:
              - { type: error, code: unknown_subscription, message: 'No subscription named s9 is open on this connection.', subscription_id: s9, retryable: true }
              - { type: error, code: unsupported_filter, message: 'Scope thread does not publish the filter events.', subscription_id: s4, retryable: false }
              - { type: error, code: unknown_resource, message: 'No turn named zz-1 exists in session 8c1b-uuid.', subscription_id: s5, retryable: false }
        invalid_examples:
          note: >-
            Every frame below MUST be rejected by the union in this document, and each names the rule it breaks.
            They are contract content so a client or server implementation can be tested against exactly the
            ambiguity this design removes, instead of against a permissive reader.
          frames:
            - { reason: welcome_without_limits, frame: { type: welcome, protocol: harness.v1, epoch: 9f2c17a4, at: 1762250001000 } }
            - { reason: subscription_state_needs_resource_keyed_revisions, frame: { type: subscription_state, subscription_id: s1, scope: session, epoch: 9f2c17a4, sequence: 0, cursor: OWYyYzE3YTQ6MA, revisions: { session: 12 } } }
            - { reason: config_updated_carries_no_payload, frame: { type: update, subscription_id: sg, sequence: 3, cursor: OWYyYzE3YTQ6Mw, at: 1762250016200, kind: config.updated, ids: [defaults] } }
            - { reason: display_ops_requires_turn_id_with_ops, frame: { type: update, subscription_id: s2, sequence: 3, cursor: OWYyYzE3YTQ6Mw, at: 1762250016200, kind: display.ops, ops: [{ op: 'tail:clear', turnId: 4d7a-uuid, sectionId: '4d7a-uuid:1' }] } }
            - { reason: invalidation_kind_carries_a_body, frame: { type: update, subscription_id: s1, sequence: 4, cursor: OWYyYzE3YTQ6NA, at: 1762250016210, kind: turn.removed, turn_id: 4d7a-uuid, session: { id: 8c1b-uuid, revision: 13 } } }
            - { reason: scope_value_outside_enum_is_a_schema_failure, frame: { type: subscribe, subscription_id: s5, scope: workspace, session_id: 8c1b-uuid } }
            - { reason: turn_scope_requires_turn_id, frame: { type: subscribe, subscription_id: s5, scope: turn, session_id: 8c1b-uuid } }
            - { reason: global_scope_forbids_ids, frame: { type: subscribe, subscription_id: sg, scope: global, session_id: 8c1b-uuid } }
            - { reason: session_scope_forbids_thread_id, frame: { type: subscribe, subscription_id: s1, scope: session, session_id: 8c1b-uuid, thread_id: 6f1c-uuid } }
            - { reason: unknown_client_message_type, frame: { type: refresh, subscription_id: s1 } }
components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      description: >-
        Opaque session identifier minted by the server (`randomUUID`). Every session-scoped route is
        isolated to this session, and an unknown id answers 404 before anything mutates. A thread, turn,
        action, or tool id is unique WITHIN a session, never globally, so a nested route never crosses
        sessions implicitly.
      schema:
        type: string
    ThreadId:
      name: thread_id
      in: path
      required: true
      description: >-
        One PERSISTENT conversation inside the session. Stable for the thread's whole life, including
        across persistence and restore, never derived from model input, and unique within one session. Not
        an invocation id: a thread owns many invocations, listed as `invocation_ids` on the thread read.
      schema:
        type: string
    TurnId:
      name: turn_id
      in: path
      required: true
      description: >-
        One recorded task. The same id is reused across its queued, running, and terminal states, so a
        client upserts by id rather than by position.
      schema:
        type: string
    StepId:
      name: step_id
      in: path
      required: true
      description: >-
        The recorded event index that OPENS the step, as a decimal string (the same derivation as
        `DisplayStep.id`). It addresses the recorded request AND its recorded result together, and it does
        not renumber when the display tree is rebuilt.
      schema:
        type: string
        pattern: '^[0-9]+$'
    BlockId:
      name: block_id
      in: path
      required: true
      description: >-
        One context-bar segment key, `${section_ordinal}-${kind}-${key}` - for example `2-tool-7`,
        `1-system-instructions`, `3-user-prompt`. A segment dropped with a discarded attempt is removed by
        id and never renumbered, so an id captured before a restart still resolves.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      description: >-
        The attachment's own stable id, unique within one turn, so a preview can be updated in place and a
        recorded turn round-trips. Never an array position.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequestId:
      name: request_id
      in: path
      required: true
      description: >-
        One pending owner question. Generated by the runtime, never by the model, and unique within the
        session.
      schema:
        type: string
    HarnessName:
      name: harness_name
      in: path
      required: true
      description: >-
        Harness definition name. Identity only, so it is immutable on PATCH. A deleted name is absent and
        stays absent, so it resolves 404 rather than to a tombstone.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]*$'
    AgentId:
      name: agent_id
      in: path
      required: true
      description: >-
        Agent name in the relevant scope: a trusted catalogue profile at the global level, a session roster
        key at the session level. Names are unique within their scope and there is no cross-scope fallback
        in either direction.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]*$'
    ToolId:
      name: tool_id
      in: path
      required: true
      description: >-
        Tool wire name: the name the model calls and the registry key, matched case-sensitively and unique
        within its registry.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]*$'
    Limit:
      name: limit
      in: query
      required: false
      description: >-
        Entries per page. The same default and maximum apply to every paginated route in this contract, so
        a client writes one paging helper. A page that returns exactly `limit` items always carries
        `next_cursor` (possibly to an empty page), which is how the end is detected without a total.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque position token issued by the route that accepts it (a collection revision plus an ordering
        key, or an event or message ordinal). A client never decodes one; an unrecognised or stale cursor
        answers 400 naming the parameter, and the client restarts from the first page.
      schema:
        type: string
        maxLength: 256
  responses:
    BadRequest:
      description: >-
        The request is malformed, carries an unknown field, or fails validation. Every write in this API
        rejects unknown properties outright rather than ignoring them, so a client is never left believing
        it changed something. The message names the offending field or rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            unknown-field:
              value:
                error:
                  message: 'Unknown field "instructions". Allowed fields: name, title, description, primary, subagents, agent_models, agent_instructions.'
            stale-cursor:
              value:
                error:
                  message: 'cursor is not a valid position token for this collection; start from the first page.'
    Forbidden:
      description: >-
        The request is well formed but the operation is not permitted in this deployment or scope: a
        protected harness-owned tool was replaced, edited, disabled, or removed; executable tool source was
        submitted to a deployment that did not grant that operator capability; or a global write was refused
        because the host runs its catalogue and configuration read-only. This status is always a POLICY
        outcome, never an authentication outcome: there is no credential to send, no `WWW-Authenticate`
        header, and no security scheme in this contract. The host's Origin check and its client-hint header
        are neither an identity nor a secret.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            protected-tool:
              value:
                error:
                  message: 'toolCreate is a protected harness tool and cannot be replaced or removed.'
            code-grant:
              value:
                error:
                  message: 'This deployment does not allow submitting tool source over HTTP.'
    NotFound:
      description: >-
        No resource with that identity exists in the addressed scope. A nested route answers 404 when either
        ancestor is missing (unknown session, unknown thread inside a known session) and never silently
        crosses into another session. A repeat delete is 404 because the second call removed nothing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    MethodNotAllowed:
      description: >-
        The path exists but the method does not, and the message names the methods that path accepts. Any
        method a path item does not declare is a 405, whether or not that response is repeated on the
        operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            sessions-item:
              value:
                error:
                  message: Use GET, PATCH or DELETE for /v1/harness/sessions/:session_id.
    Conflict:
      description: >-
        The resource state refuses the operation, and the operation is safe to retry once that state changes.
        Every conflict here is a concurrency or lifecycle guard rather than a validation error: a session is
        busy or has queued work (reset, transcript write, manual tool call), a conversation is running or
        queued (delete, agent removal), a name collides with an existing registry entry, a tool is
        unconfigured, the created-tool or thread-record budget is reached, a definition still references an
        agent, or an action was already answered or has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            reset-busy:
              value:
                error:
                  message: A running or queued session cannot be reset; cancel it first.
    PayloadTooLarge:
      description: >-
        The body exceeds the route's declared byte budget: 1,000,000 bytes for an ordinary request, or
        16,777,216 bytes for a task submit, which carries base64 media inside JSON. On a submit the same
        status also covers one attachment above 4,194,304 bytes or a per-turn total above 8,388,608 bytes.
        The general cap is decimal bytes and the media caps are binary mebibytes; the contract states bytes
        so the two are never conflated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    UnsupportedMediaType:
      description: >-
        The submitted content type, or an attachment's declared media type, is not accepted. An attachment's
        `kind` and `mime` must agree with each other and with the profile the route validates against, and an
        upload of an arbitrary binary `file` kind is refused explicitly rather than silently dropped.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    TooManyRequests:
      description: >-
        A bounded budget is full. On a task submit it means the session already holds 100 pending tasks - the
        active turn is not counted - so the caller must wait for a slot rather than assume its work was
        accepted. The same status covers a client that submits faster than the stream's advertised rate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    InternalError:
      description: >-
        The server failed to complete an operation it accepted. The message is the serialised failure, never
        a stack trace, and an accepted submit that fails this way keeps its turn record with status `error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    BadGateway:
      description: >-
        An upstream provider could not be reached or answered unusably. This is distinct from a tool failure,
        which is a 200 carrying `ok: false`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unavailable:
      description: >-
        The host cannot serve this request right now: it is shutting down and draining background work, a
        required worker could not be started, or the stream is refusing new upgrades during an epoch change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    # ---------------------------------------------------------------------
    # Paging primitive: one shape for every collection in the contract.
    # ---------------------------------------------------------------------
    PageMeta:
      type: object
      description: >-
        The fields every page carries. `limit` echoes the effective page size, `next_cursor` is null at the
        end of the collection, `observed_at` is the server clock time the page was assembled, and
        `revision` is the collection revision at that moment - the figure a client compares against a
        stream frame to decide which one is newer.
      required: [limit, next_cursor, observed_at, revision]
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: The page size actually applied (the request's `limit`, or 25 when omitted).
        next_cursor:
          type: string
          nullable: true
          maxLength: 256
          description: Opaque position for the following page, or null when this page is the last one.
        observed_at:
          type: integer
          description: Epoch milliseconds at which the page was assembled.
        revision:
          type: integer
          minimum: 0
          description: >-
            Monotonic revision of THIS collection in this scope. It changes on any mutation that adds,
            removes, or reorders an entry, so a client can tell whether a read and a stream frame describe
            the same state.
    # ---------------------------------------------------------------------
    # Service and configuration
    # ---------------------------------------------------------------------
    ErrorBody:
      type: object
      description: >-
        The one error envelope every failing route returns (`ApiErrorBody`, src/server/protocol.ts). It is
        the only response shape shared by all failures, so a client has one error path.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [message]
          additionalProperties: false
          properties:
            message:
              type: string
              description: >-
                Human-readable, names the field or rule that failed. Never a stack trace and never a
                credential.
    HealthResponse:
      type: object
      description: Liveness plus the number of sessions the store currently holds.
      required: [ok, sessions, epoch]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        sessions:
          type: integer
          minimum: 0
        epoch:
          type: string
          maxLength: 64
          description: The server epoch, identical to the value `GET /v1/harness` reports.
    ServiceCapabilities:
      type: object
      description: >-
        What THIS deployment offers, stated as booleans so a client hides an affordance instead of discovering
        a 403 or a 404 by clicking it. Every capability here maps onto real routes; a false value means the
        routes exist and answer 403 (policy) or 404 (not applicable), not that a different path exists.
      required:
        - websocket_stream
        - tool_execution
        - tool_registration
        - transcript_editing
        - command_dispatch
        - model_discovery
        - harness_definition_writes
        - agent_writes
        - persistent_threads
      additionalProperties: false
      properties:
        websocket_stream:
          type: boolean
          description: Whether `GET /v1/harness/stream` completes an upgrade.
        tool_execution:
          type: boolean
          description: Whether manual tool execution routes are enabled at all.
        tool_registration:
          type: boolean
          description: >-
            Whether a session tool may be created or edited over HTTP. False means executable source is not
            accepted anywhere: those writes answer 403 and the toolbox stays read-only.
        transcript_editing:
          type: boolean
          description: Whether the whole-document transcript PUT is enabled.
        command_dispatch:
          type: boolean
          description: >-
            Whether a `/`-prefixed submit is executed by the in-process command registry rather than sent to a
            model.
        model_discovery:
          type: boolean
          description: Whether the server will perform a provider model list on a client's behalf.
        harness_definition_writes:
          type: boolean
          description: Whether harness definitions may be created, edited, and removed over HTTP.
        agent_writes:
          type: boolean
          description: Whether global agent profile text may be overridden over HTTP.
        persistent_threads:
          type: boolean
          description: Whether this session family supports persistent conversations.
    ServiceLimits:
      type: object
      description: >-
        The numeric envelope every route is bounded by, published once so a client validates before sending
        and explains a refusal without guessing. These are contract numbers, not aspirations: a route refuses
        a value above them with 400, 413, 415, or 429 as stated on the operation.
      required:
        - body_bytes
        - submit_body_bytes
        - input_chars
        - pending_tasks
        - thread_records
        - attachments_per_turn
        - attachment_bytes
        - total_attachment_bytes
        - result_references
        - pending_actions
        - steer_records
        - created_tools
        - tool_result_bytes
        - page_limit_default
        - page_limit_max
      additionalProperties: false
      properties:
        body_bytes:
          type: integer
          minimum: 1
          description: Ordinary request body cap in bytes (decimal).
        submit_body_bytes:
          type: integer
          minimum: 1
          description: Task submit body cap in bytes, higher because base64 media rides inside the JSON.
        input_chars:
          type: integer
          minimum: 1
          description: Trimmed task input cap in characters.
        pending_tasks:
          type: integer
          minimum: 0
          description: Queued tasks allowed per session before a submit answers 429.
        thread_records:
          type: integer
          minimum: 1
          description: Persistent thread records per session.
        attachments_per_turn:
          type: integer
          minimum: 0
          description: Attachments accepted per submitted turn.
        attachment_bytes:
          type: integer
          minimum: 1
          description: Decoded bytes per attachment.
        total_attachment_bytes:
          type: integer
          minimum: 1
          description: Decoded bytes across one turn's attachments.
        result_references:
          type: integer
          minimum: 0
          description: Result blocks one submit may reference.
        pending_actions:
          type: integer
          minimum: 0
          description: Live owner questions open per session.
        steer_records:
          type: integer
          minimum: 1
          description: >-
            Entries kept in one turn's steer AUDIT ring. Archived steer TEXT is not ring-bounded, which is why
            the block detail route can still answer a segment the ring has moved past.
        created_tools:
          type: integer
          minimum: 1
          description: Tools one session's harness may create in its lifetime, across resets.
        tool_result_bytes:
          type: integer
          minimum: 1
          description: Model-facing text bound for one tool result; detail routes answer verbatim recorded bytes.
        page_limit_default:
          type: integer
          minimum: 1
          maximum: 100
        page_limit_max:
          type: integer
          minimum: 1
          maximum: 100
    ServiceInfo:
      type: object
      description: >-
        The boot document: identity, capability advertisement, contract limits, and links. Nothing else. It
        carries no catalogues, no defaults, and no sessions, so booting a client costs one small constant-size
        request.
      required: [api_root, service, api_version, server_time, epoch, capabilities, limits, links]
      additionalProperties: false
      properties:
        api_root:
          type: string
          description: The API URL this document was served from (the mount), never a filesystem path.
        service:
          type: string
        api_version:
          type: string
          description: The contract line this server implements, e.g. `1.0`.
        build_version:
          type: string
          description: The host's package version, informational.
        server_time:
          type: integer
          description: Epoch milliseconds, so a client can render relative times against the server clock.
        epoch:
          type: string
          maxLength: 64
          description: >-
            Opaque server-lifetime id. It changes on every restart, which invalidates every retained stream
            cursor and is the only restart signal a client is given.
        capabilities:
          $ref: '#/components/schemas/ServiceCapabilities'
        limits:
          $ref: '#/components/schemas/ServiceLimits'
        links:
          type: object
          description: >-
            Canonical path for each named resource family, so a client never hard-codes the mount. Keys are
            stable names; values are paths relative to the server origin.
          additionalProperties:
            type: string
    ProviderDefaults:
      type: object
      description: >-
        Key-free provider defaults advertised to clients. The API key itself is NEVER sent, only whether one
        exists; the values come from the server environment (src/server/config.ts).
      required: [base_url, model, has_api_key]
      additionalProperties: false
      properties:
        base_url:
          type: string
          maxLength: 2048
          description: Provider base URL the defaults point at.
        model:
          type: string
          maxLength: 256
        has_api_key:
          type: boolean
          description: >-
            True when a server key is configured. No read document can show, replace, or remove the key; only
            `PATCH /config` writes it and no response echoes it.
    RunnerSettingsInput:
      type: object
      description: >-
        The provider settings a caller may change per session or per discovery request. Partial by
        construction: an omitted field keeps the configured default. `api_key` is write-only and travels only
        in a request body.
      additionalProperties: false
      properties:
        base_url:
          type: string
          maxLength: 2048
        api_key:
          type: string
          writeOnly: true
          description: >-
            Sent to the provider as a bearer header. Credential rule (src/server/config.ts `mergeSettings`): a
            blank or omitted key reuses the SERVER key only when `base_url` is the configured provider's origin
            plus base path; for any other base URL it means "no key".
        model:
          type: string
          maxLength: 256
    RuntimeSettings:
      type: object
      description: >-
        DEPLOYMENT-owned execution configuration, readable for diagnosis and never writable over HTTP. These
        decide where a turn's body runs, and a bad value is a startup failure rather than a client error, so a
        client that sends one in a write body gets a 400 naming it.
      required: [thread_execution, worker_idle_ms, max_lane_workers, worker_handshake_ms]
      additionalProperties: false
      properties:
        thread_execution:
          type: string
          enum: [inline, worker]
          description: >-
            `inline` runs every conversation on the server's event loop. `worker` runs each persistent
            thread's turn on its own worker thread so a heavy lane cannot freeze a sibling or the HTTP
            surface; it is a promise, not a hint, so a session whose harness a worker cannot rebuild is
            REJECTED with a reason instead of silently running inline.
        worker_idle_ms:
          type: integer
          minimum: 0
          maximum: 3600000
          description: Reclaim a lane worker after this much idle time; 0 keeps it until the session goes.
        max_lane_workers:
          type: integer
          minimum: 1
          maximum: 64
          description: Upper bound on concurrently live lane workers per store (the memory guard).
        worker_handshake_ms:
          type: integer
          minimum: 1000
          maximum: 600000
          description: Upper bound on the worker hello handshake (import, build, capability report).
        worker_entry_configured:
          type: boolean
          description: >-
            True when the deployment pins an explicit worker entry path instead of resolving the built
            default. A path is never echoed, because it is a host filesystem detail.
    GlobalConfigDocument:
      type: object
      description: >-
        GLOBAL configuration: the session-visible provider defaults plus read-only deployment runtime facts.
        A session's own merged settings are per-session state and are reported on the session, never here.
      required: [defaults, writable_fields, revision]
      additionalProperties: false
      properties:
        defaults:
          $ref: '#/components/schemas/ProviderDefaults'
        runtime:
          $ref: '#/components/schemas/RuntimeSettings'
        writable_fields:
          type: array
          description: The exact fields `PATCH /config` accepts, so a client cannot guess the allowlist.
          items:
            type: string
            enum: [settings.base_url, settings.model, settings.api_key]
          example: [settings.base_url, settings.model, settings.api_key]
        revision:
          type: integer
          minimum: 0
          description: >-
            Monotonic revision of the global configuration document. A stream `config.updated` frame carries
            this value, so a client that already read a newer revision ignores the frame.
    GlobalConfigUpdateRequest:
      type: object
      description: >-
        Whole-field patch of the global defaults. Unknown fields are 400. `settings` must contain at least one
        recognised property, and a runtime knob in this body is a 400 naming it, which is how
        "deployment-only" stays enforceable rather than being prose.
      required: [settings]
      additionalProperties: false
      properties:
        settings:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            base_url:
              type: string
              nullable: true
              maxLength: 2048
              description: A `null` value restores the built-in default base URL.
            model:
              type: string
              nullable: true
              maxLength: 256
              description: A `null` value restores the built-in default model.
            api_key:
              type: string
              nullable: true
              writeOnly: true
              description: >-
                Write-only. A non-empty string replaces the server key, an explicit empty string or `null`
                REMOVES it (the response then reports `has_api_key: false`), and an omitted property leaves it
                untouched. The stored value is never echoed back.
    # ---------------------------------------------------------------------
    # Harness definitions
    # ---------------------------------------------------------------------
    HarnessCard:
      type: object
      description: >-
        One named harness definition as a picker needs it: identity, the entry agent, the delegation
        allowlist, the declared tool set, and whether a provider endpoint is required. `agents` is derived as
        `[primary, ...subagents]`. A card omits per-agent instruction TEXT, the per-agent model map, and the
        resolved core-tool set; the identified read adds those.
      required: [name, title, description, requires_endpoint, primary, subagents, agents, tools, builtin, definition_revision]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
        title:
          type: string
        description:
          type: string
        requires_endpoint:
          type: boolean
          description: False only for a scripted definition that needs no provider base URL.
        primary:
          type: string
          description: The entry agent, and the agent an unfocused submit opens a conversation for.
        subagents:
          type: array
          description: The exact delegation allowlist. Empty means `delegate` is not registered at all.
          items:
            type: string
        agents:
          type: array
          items:
            type: string
        tools:
          type: array
          description: The declared tool set of this definition.
          items:
            type: string
        builtin:
          type: boolean
          description: >-
            Shipped with the application rather than created through POST. Informational only: a built-in is
            edited and deleted exactly like a created entry.
        definition_revision:
          type: integer
          minimum: 1
          description: >-
            Monotonic revision of this registry entry. A PATCH produces a new immutable entry under the same
            name and raises it, which is how a session can state which copy it froze.
    HarnessInstructionSummaryEntry:
      type: object
      description: >-
        One member's instruction PROVENANCE AND LENGTH with no text, so a definition read stays constant-size
        however long the prompts are. `source` names the layer that supplies the text the member runs:
        `harness` (this definition overrides), `global` (a profile override), or `catalogue` (the trusted
        profile). The text is one named subresource away.
      required: [agent, source, overridden, chars]
      additionalProperties: false
      properties:
        agent:
          type: string
        source:
          type: string
          enum: [catalogue, global, harness]
        overridden:
          type: boolean
          description: True when this definition itself carries an override for the member.
        chars:
          type: integer
          minimum: 0
          description: EXACT character count of the effective text, so a client can size a preview honestly.
    HarnessDefinition:
      type: object
      description: >-
        The identified read of one definition: a card plus the per-agent model overrides, the resolved
        core-tool set, and the instruction summary.
      allOf:
        - $ref: '#/components/schemas/HarnessCard'
        - type: object
          additionalProperties: false
          properties:
            core_tools:
              type: array
              description: >-
                The core tools this definition's runs will actually declare - the file tools when registered,
                the harness-owned control tools, `delegate` when a subagent allowlist exists, and `search` only
                when a provider key exists. Runtime visibility, not a hard-coded list.
              items:
                type: string
            agent_models:
              type: object
              description: >-
                Per-agent MODEL overrides (agent name to model id), present only when this definition overrides
                something. A member absent from the map uses the session's model. This is the creation-time
                record; the live map a session runs now is on the session resource.
              additionalProperties:
                type: string
            instruction_summary:
              type: array
              description: One row per member, in `[primary, ...subagents]` order. No text.
              items:
                $ref: '#/components/schemas/HarnessInstructionSummaryEntry'
    CreateHarnessRequest:
      type: object
      description: >-
        Selection-only body. A client picks trusted agent names and may record per-agent model ids and
        instruction overrides; it cannot supply a provider, a credential, a transport, or a tool list. Every
        override key must name a member of the resulting definition.
      required: [name, primary]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        primary:
          type: string
        subagents:
          type: array
          maxItems: 32
          items:
            type: string
        agent_models:
          type: object
          description: Agent name to model id. An id only - never a provider or a credential.
          additionalProperties:
            type: string
            maxLength: 256
        agent_instructions:
          type: object
          description: >-
            Agent name to instruction OVERRIDE text. The override replaces only the profile's identity
            sentence; its guidelines still apply, and the trusted profile itself is never rewritten.
          additionalProperties:
            type: string
            maxLength: 200000
    UpdateHarnessRequest:
      type: object
      description: >-
        An omitted field keeps its current value; the name is immutable. `agent_models` and
        `agent_instructions` REPLACE the map they name (`{}` clears it), and an override for a member this
        patch removes is dropped rather than rejected. Changing `primary` without `subagents` removes the new
        primary from the old allowlist.
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        primary:
          type: string
        subagents:
          type: array
          maxItems: 32
          items:
            type: string
        agent_models:
          type: object
          additionalProperties:
            type: string
            maxLength: 256
        agent_instructions:
          type: object
          additionalProperties:
            type: string
            maxLength: 200000
    HarnessCardPage:
      description: Page of definition cards.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/HarnessCard'
    HarnessDefinitionResponse:
      type: object
      description: Envelope of a definition read, create, or patch.
      required: [harness]
      additionalProperties: false
      properties:
        harness:
          $ref: '#/components/schemas/HarnessDefinition'
    HarnessInstructionIndexResponse:
      type: object
      description: >-
        Envelope of the instruction index: one row per member with provenance and length, no text, and no page
        cursor because the member set is bounded by the definition.
      required: [harness_name, items, total]
      additionalProperties: false
      properties:
        harness_name:
          type: string
        total:
          type: integer
          minimum: 1
          description: Number of members, which is `items.length`.
        items:
          type: array
          maxItems: 33
          items:
            $ref: '#/components/schemas/HarnessInstructionSummaryEntry'
    HarnessInstructionTextResponse:
      type: object
      description: One member's effective instruction text, with its provenance.
      required: [harness_name, agent, source, instruction, guidelines, chars]
      additionalProperties: false
      properties:
        harness_name:
          type: string
        agent:
          type: string
        source:
          type: string
          enum: [catalogue, global, harness]
        instruction:
          type: string
          maxLength: 200000
        guidelines:
          type: array
          description: The rules appended to the instruction at runtime; an instruction override never changes them.
          items:
            type: string
        chars:
          type: integer
          minimum: 0
          description: EXACT character count of `instruction`, so a client can state truncation honestly.
    DeleteHarnessResult:
      type: object
      description: >-
        Receipt of a definition removal. Deliberately minimal: the authoritative record is that the entry is
        gone (and, for a built-in, that its name is tombstoned so a restart does not re-ship it), not a second
        copy of the definition on this route.
      required: [deleted, harness_name, tombstoned, restored_by_restart]
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          enum: [true]
        harness_name:
          type: string
        tombstoned:
          type: boolean
          description: True when the removed entry was shipped by the application, so the name stays absent.
        restored_by_restart:
          type: boolean
          description: >-
            True states the restore rule: only a host restart re-ships a built-in. There is no HTTP undo, and a
            created entry is simply gone.
    # ---------------------------------------------------------------------
    # Global agents
    # ---------------------------------------------------------------------
    AgentSummary:
      type: object
      description: >-
        One trusted profile without its text: identity, title, description, and whether the global layer
        currently overrides anything.
      required: [name, title, description, has_instruction_override, has_global_override]
      additionalProperties: false
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        has_instruction_override:
          type: boolean
          description: True when the effective instruction differs from the shipped catalogue value.
        has_global_override:
          type: boolean
          description: True when a global (host-level) override of any kind is recorded for this profile.
    AgentProfile:
      type: object
      description: >-
        The full trusted profile as a client needs it to choose a primary or subagent. Every text field is
        trusted catalogue content, never client input and never secret: `instruction` is the identity system
        message and `guidelines` are the rules appended to it at runtime.
      required:
        - name
        - title
        - description
        - instruction
        - guidelines
        - instruction_source
        - referenced_by
        - revision
      additionalProperties: false
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        instruction:
          type: string
          maxLength: 200000
        guidelines:
          type: array
          items:
            type: string
        instruction_source:
          type: string
          enum: [catalogue, global]
          description: Which layer supplied the text this read returns.
        overridden_fields:
          type: array
          description: The fields the global layer currently overrides, so an operator sees the delta at a glance.
          items:
            type: string
            enum: [title, description, instruction, guidelines]
        referenced_by:
          type: array
          description: >-
            Harness definitions that currently name this profile as a member. A non-empty list is why a DELETE
            answers 409 rather than orphaning a definition.
          items:
            type: string
        revision:
          type: integer
          minimum: 0
    AgentSummaryPage:
      description: Page of agent summaries.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/AgentSummary'
    AgentProfileResponse:
      type: object
      description: Envelope of an agent profile read or patch.
      required: [agent]
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/AgentProfile'
    UpdateAgentRequest:
      type: object
      description: >-
        Declarative text overrides only. A value REPLACES the whole field it names (`guidelines: []` is an
        explicit clear), an omitted field is no change, and an explicit `null` restores the shipped catalogue
        value for that field. No transport, tool list, delegation, turn limit, or source is accepted, because
        none of those is data an HTTP client may change.
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        instruction:
          type: string
          nullable: true
          maxLength: 200000
        guidelines:
          type: array
          nullable: true
          maxItems: 64
          items:
            type: string
            maxLength: 4000
    DeleteAgentResult:
      type: object
      description: >-
        Receipt of a profile retirement: the profile is unavailable for NEW sessions and member selection, and
        nothing else changed. Existing sessions keep the definition they captured.
      required: [deleted, agent_id, tombstoned, restored_by_restart]
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          enum: [true]
        agent_id:
          type: string
        tombstoned:
          type: boolean
          description: True when the retired profile shipped with the application, so a restart does not re-add it.
        restored_by_restart:
          type: boolean
          description: >-
            True states the only restore path. A re-created profile with the same name is a code change, so this
            contract does not imply an HTTP undo.
    # ---------------------------------------------------------------------
    # Global tools
    # ---------------------------------------------------------------------
    ToolAvailability:
      type: object
      description: >-
        Whether the server can actually run a listed tool. `environment` names environment VARIABLES only -
        never values - and `hint` is a non-secret sentence a client can print verbatim.
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [available, unconfigured]
        environment:
          type: array
          description: Variable NAMES the entry needs; never their values.
          items:
            type: string
        hint:
          type: string
          maxLength: 500
          description: Non-secret sentence explaining what to configure.
    ToolSummary:
      type: object
      description: >-
        One catalogue entry as a list projects it: identity, display group, description, tags, visibility,
        availability, and whether the entry can only run inside a session. The argument JSON Schema is on the
        identified read.
      required: [name, group, description, tags, visibility, session_bound]
      additionalProperties: false
      properties:
        name:
          type: string
        group:
          type: string
          description: Display group. `Core tools` is the harness-owned set, listed for review and manual execution but only runnable inside a session.
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        visibility:
          type: string
          enum: [core, searchable]
          description: '`core` is the harness-owned set; `searchable` is discovery-eligible through `toolRequest`.'
        availability:
          $ref: '#/components/schemas/ToolAvailability'
        session_bound:
          type: boolean
          description: >-
            True for a harness-owned entry with no standalone implementation, which must be executed through a
            session's registry.
    ToolDetail:
      type: object
      description: >-
        A catalogue entry plus what only the identified read carries: the argument schema the model is given,
        and the execution scope this entry supports.
      allOf:
        - $ref: '#/components/schemas/ToolSummary'
        - type: object
          required: [execution]
          additionalProperties: false
          properties:
            parameters:
              type: object
              description: >-
                The JSON Schema of the arguments, exactly as the model sees it. Bounded in depth (12), node
                count (256), and serialised size (16,384 bytes).
              additionalProperties: true
            execution:
              type: object
              description: >-
                Whether this entry can be executed at all, and from which route. Stated instead of inferred,
                because `group` and `visibility` are display concepts and cannot classify runnability.
              required: [scope, manual]
              additionalProperties: false
              properties:
                scope:
                  type: string
                  enum: [global, session_required]
                  description: >-
                    `global` answers on `POST /tools/{tool_id}/executions`; `session_required` answers only on
                    `POST /sessions/{session_id}/tools/{tool_id}/executions`.
                manual:
                  type: boolean
                  description: >-
                    False when an operator call is refused even in a valid scope, for example a control tool
                    whose effect requires an active run. The reason is in the 409 message.
    ToolSummaryPage:
      description: Page of catalogue rows.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ToolSummary'
    ToolDetailResponse:
      type: object
      description: Envelope of one catalogue entry read.
      required: [tool]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/ToolDetail'
    GlobalToolExecutionRequest:
      type: object
      description: >-
        `parameters` is DELIBERATELY untyped: it is the tool's own JSON-Schema-shaped argument value, and the
        tool - not this contract - decides what is valid, reporting a bad argument as a `ok: false` result.
        There is no session field here, because this route resolves through the deployment catalogue.
      additionalProperties: false
      properties:
        parameters:
          description: Arbitrary JSON (object, array, string, number, boolean, or `null`).
    SessionToolExecutionRequest:
      type: object
      description: >-
        Same untyped argument value as a global call. The session is already in the path, so there is no
        session field to contradict it and no way for a body to reach another session's registry.
      additionalProperties: false
      properties:
        parameters:
          description: Arbitrary JSON (object, array, string, number, boolean, or `null`).
    ToolCallSuccess:
      type: object
      description: >-
        A call that executed and reported success. `result` is the tool's ordinary value, already unwrapped
        from a `toolUi(content, panels)` envelope. Panels are presentation data only (no HTML, script, or
        actions) and media entries are DESCRIPTORS - id, kind, name, MIME, size - never base64, because a
        manual call has no transcript to attach bytes to.
      required: [ok, result, duration_ms]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        result:
          description: The tool's result value, arbitrary JSON.
        panels:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ToolUiPanel'
        media:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ToolMediaDescriptor'
        duration_ms:
          type: integer
          minimum: 0
    ToolCallFailure:
      type: object
      description: >-
        A call that executed and reported failure. This is a 200 response, because the invocation succeeded
        and the tool answered: only a call the server could not make at all is an HTTP error.
      required: [ok, error, duration_ms]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/HarnessErrorInfo'
        duration_ms:
          type: integer
          minimum: 0
    ToolCallResult:
      description: >-
        The outcome of one manual tool execution, discriminated by `ok`. A client branches on `ok`, never on the
        status code alone, because both outcomes are 200.
      oneOf:
        - $ref: '#/components/schemas/ToolCallSuccess'
        - $ref: '#/components/schemas/ToolCallFailure'
    ToolUiBlock:
      type: object
      description: >-
        One declarative block inside a panel, discriminated by `type`: `text`, `table` (fixed string columns and
        rows), or `keyValue` (label and value pairs). No block carries markup or an action.
      required: [type]
      properties:
        type:
          type: string
          enum: [text, table, keyValue]
        text:
          type: string
          maxLength: 4000
          description: "`text` only."
        columns:
          type: array
          items:
            type: string
          description: '`table` only.'
        rows:
          type: array
          items:
            type: array
            items:
              type: string
          description: '`table` only, every row the width of `columns`.'
        items:
          type: array
          description: '`keyValue` only.'
          items:
            type: object
            required: [label, value]
            additionalProperties: false
            properties:
              label:
                type: string
              value:
                type: string
    ToolUiPanel:
      type: object
      description: One declarative panel a tool supplied with its result.
      required: [id, slot, title, blocks]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable within one tool result, so a client can update a panel in place.
        slot:
          type: string
          description: Placement hint, extensible by the host; `right` is the default mount point.
        title:
          type: string
          maxLength: 200
        blocks:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ToolUiBlock'
    ToolMediaDescriptor:
      type: object
      description: >-
        One file a tool produced, described rather than carried. `size` is the decoded byte length and is
        always below the download profile's per-attachment cap, so a client can offer a download it knows the
        attachment route will actually serve.
      required: [id, kind, name, mime, size]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [image, video, audio, pdf, file]
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          minimum: 0
    # ---------------------------------------------------------------------
    # Model discovery
    # ---------------------------------------------------------------------
    ModelDiscoveryRequest:
      type: object
      description: >-
        The endpoint settings the client would use for a session. Absent means "use the host defaults".
        `api_key` is write-only and never appears in any response, and the key travels in this body rather
        than in a query string.
      additionalProperties: false
      properties:
        settings:
          $ref: '#/components/schemas/RunnerSettingsInput'
    ModelIndex:
      type: object
      description: >-
        The provider's model ids in provider order, deduplicated. An empty array is a valid answer: it means
        the provider answered and served nothing usable, which is different from 502.
      required: [models, observed_at]
      additionalProperties: false
      properties:
        models:
          type: array
          maxItems: 2000
          items:
            type: string
            maxLength: 256
        observed_at:
          type: integer
          description: Epoch milliseconds at which the provider answered.
    # ---------------------------------------------------------------------
    # Sessions
    # ---------------------------------------------------------------------
    SessionStatus:
      type: string
      description: >-
        Session lifecycle as the server owns it. `running` means at least one turn is executing; a queued
        turn does NOT make a session `running` on its own, which is what `queue_depth` reports separately.
      enum: [idle, running, error]
    SessionTurnStatus:
      type: string
      description: >-
        Recorded task state. `queued` means the turn exists with a stable id and index but has no
        `started_at` yet; the server stamps it when execution begins.
      enum: [queued, running, done, error, cancelled]
    SessionSummary:
      type: object
      description: >-
        One session as a list row: metadata and counters, nothing else. Deliberately absent: turns, events,
        the thread roster, transcripts, display trees, the frozen definition, and the live `agent_models`
        map. A rail of a hundred long conversations is therefore a constant-size response.
      required: [id, harness, status, model, created_at, updated_at, turn_count, thread_count, revision]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 200
          description: >-
            The operator or client supplied display name, when one was set. It grants no authority and is never
            an identifier - the same rule as a conversation label - which is why a session stays addressable by
            `id` even with a duplicate or missing title.
        harness:
          type: string
          description: The definition this session froze.
        status:
          $ref: '#/components/schemas/SessionStatus'
        queue_depth:
          type: integer
          minimum: 1
          description: >-
            Tasks waiting in the server queue; the active turn is not counted. ABSENT when the queue is empty,
            which is how "nothing waiting" and "zero waiting" stay one honest statement.
        model:
          type: string
          description: The model the entry agent runs now.
        created_at:
          type: integer
        updated_at:
          type: integer
        last_error:
          type: string
          maxLength: 2000
          description: The failure the session is currently sitting on, when it is in `error`.
        turn_count:
          type: integer
          minimum: 0
          description: Recorded turns of every status, so a client pages `/turns` with a total in hand.
        thread_count:
          type: integer
          minimum: 0
          description: Persistent conversations, so a client pages `/threads` without a second request.
        revision:
          type: integer
          minimum: 0
    SessionResource:
      type: object
      description: >-
        The identified read of one session: everything a row carries plus the live model map, the key-free
        endpoint view, the created-tool and pending-action counts, and where turns actually execute. Still
        none of the heavy children: those are each one named subresource away.
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required: [definition_revision, agent_models, endpoint, runtime_execution, pending_action_count, created_tool_count, created_tool_limit]
          additionalProperties: false
          properties:
            definition_revision:
              type: integer
              minimum: 1
              description: >-
                The `definition_revision` of the registry entry this session froze. Compare it with
                `GET /harnesses/{harness_name}` to state "this session runs an older copy" without fetching the
                copy.
            agent_models:
              type: object
              description: >-
                The LIVE agent id to model id map, after every session override. An agent absent from the map
                runs `model`.
              additionalProperties:
                type: string
            endpoint:
              $ref: '#/components/schemas/ProviderDefaults'
            runtime_execution:
              type: string
              enum: [inline, worker]
              description: >-
                Where this session's turns run, resolved from the deployment. Reported rather than advertised,
                because it is a deployment fact the client cannot derive.
            pending_action_count:
              type: integer
              minimum: 0
              maximum: 4
              description: Owner questions waiting right now. The list itself is `/actions`.
            created_tool_count:
              type: integer
              minimum: 0
              description: Tools created in this session so far, against the created-tool budget.
            created_tool_limit:
              type: integer
              minimum: 1
              description: >-
                This session's lifetime created-tool budget, so a client can explain a 409 instead of guessing.
                Replacements do not consume it.
    SessionResponse:
      type: object
      description: Envelope of a session read, create, or patch.
      required: [session]
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/SessionResource'
    SessionSummaryPage:
      description: Page of session rows.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/SessionSummary'
    DeleteSessionResult:
      type: object
      description: >-
        Receipt of a disposal. Intentionally minimal, like every destructive route here: the caller knows
        which session it deleted, so the response reports what was discarded and nothing else.
      required: [deleted, session_id, aborted_turns, dropped_queued_tasks]
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          enum: [true]
        session_id:
          type: string
        aborted_turns:
          type: integer
          minimum: 0
          description: Turns that were executing and are now terminal.
        dropped_queued_tasks:
          type: integer
          minimum: 0
          description: Queued tasks discarded by the disposal.
    SessionDefinitionResource:
      type: object
      description: >-
        The harness definition this session captured at creation, which is the authority for its member set,
        delegation allowlist, declared and core tools, and per-agent overrides. A saved session restores from
        this record, so a later global edit cannot move it.
      allOf:
        - $ref: '#/components/schemas/HarnessDefinition'
        - type: object
          required: [session_id, frozen_at, source_revision, current_revision, current, revision]
          additionalProperties: false
          properties:
            session_id:
              type: string
            revision:
              type: integer
              minimum: 0
              description: >-
                The `definition` counter of `StreamResourceKind`, defined to equal `current_revision`: the frozen
                copy itself never moves, so the only honest change signal is the live registry entry this session is
                behind. A `session` subscription reports THIS figure, so a client compares one number in both
                places.
            frozen_at:
              type: integer
              description: Epoch milliseconds at which the session captured this definition.
            source_revision:
              type: integer
              minimum: 1
              description: The `definition_revision` this copy came from.
            current_revision:
              type: integer
              minimum: 1
              description: >-
                The live registry entry's revision right now. Equal to `source_revision` means this session is
                running the current copy.
            current:
              type: boolean
              description: >-
                `current_revision === source_revision`, published as a boolean so a client states currency
                without arithmetic. False is not an error: running a captured copy is the whole point of
                snapshot isolation.
            discovered_tools:
              type: array
              description: >-
                The tools `toolRequest` has enabled in this session, in discovery order. Read-only; a reset
                empties it.
              items:
                type: string
    SessionDefinitionResponse:
      type: object
      description: Envelope of the frozen-definition read.
      required: [definition]
      additionalProperties: false
      properties:
        definition:
          $ref: '#/components/schemas/SessionDefinitionResource'
    CreateSessionRequest:
      type: object
      description: >-
        Selects the definition to freeze and optionally overrides the endpoint settings for THIS session only.
        Recorded history, member set, and tool list are not accepted: a session is created from a definition,
        not configured into one.
      required: [harness]
      additionalProperties: false
      properties:
        harness:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
        title:
          type: string
          maxLength: 200
          description: >-
            Optional display name for a rail or a picker. Trimmed server-side; it carries no authority, so a
            duplicate title is not a conflict.
        settings:
          $ref: '#/components/schemas/RunnerSettingsInput'
    UpdateSessionRequest:
      type: object
      description: >-
        The session-level writes, both declarative. An omitted property is no change. `agent_models` MERGES: an
        agent absent from the body keeps the model it currently runs, so changing one selection does not reset
        its siblings; every key must name a member of this session's frozen definition and every value a
        non-empty model id, or the whole patch is refused with 400 and nothing is applied. `title` REPLACES the
        display name, and an explicit `null` clears it. `{}` is a 400 no-op. Recorded history, the harness
        definition, and the endpoint settings are immutable over HTTP.
      minProperties: 1
      additionalProperties: false
      properties:
        agent_models:
          type: object
          minProperties: 1
          description: Agent id to model id.
          additionalProperties:
            type: string
            maxLength: 256
        title:
          type: string
          nullable: true
          maxLength: 200
    # ---------------------------------------------------------------------
    # Session agents
    # ---------------------------------------------------------------------
    SessionAgentBinding:
      type: object
      description: >-
        One entry of a session's live agent roster. Identity and model come from the frozen definition joined
        with the running agents, so a row states both what the session was BUILT with and what it RUNS now.
        Instruction and guideline TEXT is absent here and lives on the instruction subresource.
      required:
        - agent_id
        - profile
        - role
        - origin
        - model
        - inherited_model
        - instruction_source
        - instruction_chars
        - editable
        - deletable
        - restorable
        - revision
      additionalProperties: false
      properties:
        agent_id:
          type: string
          description: The session roster key, which is also the delegation and identity namespace name.
        profile:
          type: string
          description: The trusted catalogue profile this binding resolves to. A session agent is always a BINDING of a profile, never an uploaded implementation.
        role:
          type: string
          enum: [primary, subagent]
          description: '`subagent` means the primary may delegate to it; `primary` is the entry agent.'
        origin:
          type: string
          enum: [definition, session]
          description: >-
            `definition` means inherited from the frozen definition (not removable, overrides restorable);
            `session` means created through this API (removable).
        model:
          type: string
          description: The model this agent runs NOW, after any session override.
        inherited_model:
          type: string
          description: What it would run if the session override were cleared, so a client can show a `null` patch's effect.
        instruction_source:
          type: string
          enum: [catalogue, global, harness, session]
          description: Provenance of the effective text, so a client states where it came from instead of guessing.
        instruction_chars:
          type: integer
          minimum: 0
          description: EXACT character count of the effective instruction text, without carrying the text.
        has_instruction_override:
          type: boolean
          description: True when this session carries its own instruction override for this binding.
        guidelines_count:
          type: integer
          minimum: 0
          description: How many rule lines are appended to the instruction; the lines are on the instruction route.
        editable:
          type: boolean
          description: False only when the deployment froze session writes.
        deletable:
          type: boolean
          description: True only for a binding whose `origin` is `session`, because an inherited member set is frozen with the session.
        restorable:
          type: boolean
          description: >-
            True for an inherited member: clearing every override with a `null` patch returns it to its default,
            so an override always has a stated undo.
        busy:
          type: boolean
          description: True while this agent has a run or queued work, which is what a DELETE answers 409 on.
        revision:
          type: integer
          minimum: 0
          description: Increases on every accepted write to this binding.
    SessionAgentListResponse:
      type: object
      description: >-
        Envelope of the session agent roster. Not paged: membership comes from the frozen definition plus the
        64-binding roster budget, so the whole roster is already the bounded projection.
      required: [session_id, agents, total, revision]
      additionalProperties: false
      properties:
        session_id:
          type: string
        total:
          type: integer
          minimum: 1
        agents:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/SessionAgentBinding'
        revision:
          type: integer
          minimum: 0
          description: >-
            The `session_agents` counter of `StreamResourceKind`, matching the baseline a `session` subscription
            reports, so a binding change can be ordered against a roster read.
    SessionAgentResponse:
      type: object
      description: Envelope of a session agent read, create, or patch.
      required: [agent]
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/SessionAgentBinding'
    CreateSessionAgentRequest:
      type: object
      description: >-
        Binds an existing trusted profile into this session. No implementation, tool list, or transport is
        accepted, so nothing here can inject code.
      required: [name, profile]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
          maxLength: 64
          description: The session roster key. Must not collide with an existing member (409).
        profile:
          type: string
          description: Must name a live global agent profile (404 otherwise).
        model:
          type: string
          maxLength: 256
          description: Optional model id. Omitted inherits the session model.
        instruction:
          type: string
          maxLength: 200000
          description: Optional non-empty override text. Never mutates the profile it overrides.
        role:
          type: string
          enum: [primary, subagent]
          default: subagent
          description: >-
            `subagent` adds this binding to the primary's delegation allowlist for THIS session only.
            `primary` re-targets the entry agent of subsequent submits and is refused with 409 while the
            session is running, because the entry agent decides what an unfocused submit opens.
    UpdateSessionAgentRequest:
      type: object
      description: >-
        An omitted property is no change; a string REPLACES the whole field; an explicit `null` clears the
        session override and RESTORES the inherited binding. Identity, profile, tools, and the delegation graph
        are immutable here.
      minProperties: 1
      additionalProperties: false
      properties:
        model:
          type: string
          nullable: true
          maxLength: 256
        instruction:
          type: string
          nullable: true
          maxLength: 200000
    DeleteSessionAgentResult:
      type: object
      description: >-
        Receipt of a roster removal. It states what was detached rather than echoing the roster, because the
        roster is one bounded read away and a client that removed a binding needs the roster anyway.
      required: [deleted, agent_id, session_id, detached_threads, revision]
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          enum: [true]
        agent_id:
          type: string
        session_id:
          type: string
        detached_threads:
          type: integer
          minimum: 0
          description: Conversations that belonged to this binding and stopped growing.
        revision:
          type: integer
          minimum: 0
          description: The roster revision after the removal.
    SessionInstructionTextResponse:
      type: object
      description: The effective instruction text one session agent actually runs with, plus its provenance.
      required: [session_id, agent_id, source, instruction, guidelines, chars]
      additionalProperties: false
      properties:
        session_id:
          type: string
        agent_id:
          type: string
        source:
          type: string
          enum: [catalogue, global, harness, session]
          description: Resolved in that order; the value names the layer that supplied the text.
        instruction:
          type: string
          maxLength: 200000
        guidelines:
          type: array
          items:
            type: string
        chars:
          type: integer
          minimum: 0
          description: EXACT character count of `instruction`.
    # ---------------------------------------------------------------------
    # Session tools
    # ---------------------------------------------------------------------
    SessionToolSummary:
      type: object
      description: >-
        A catalogue projection plus the live session facts the catalogue cannot state. Composed additively, so
        the catalogue shape a global read returns is unaffected by the session surface.
      allOf:
        - $ref: '#/components/schemas/ToolSummary'
        - type: object
          required: [declared, enabled, origin, protected, source_available, session_id]
          additionalProperties: false
          properties:
            session_id:
              type: string
            declared:
              type: boolean
              description: True when the current run declares the tool, so the model may call it right now.
            enabled:
              type: boolean
              description: >-
                True when the tool is callable in this session, whether declared, discovered through
                `toolRequest`, or created at runtime. `PATCH` toggles this, and re-enabling restores the
                inherited binding exactly.
            origin:
              type: string
              enum: [catalogue, discovered, created]
              description: How it got into this session's toolbox.
            protected:
              type: boolean
              description: >-
                True for the harness-owned control plane (`toolRegistry`, `toolRequest`, `toolCreate`,
                `toolManage`, `task`, `delegate`). A protected entry refuses create-collision, PATCH, and
                DELETE with 403, not 409, because replacing or removing the tools a session runs on breaks its
                own control surface.
            source_available:
              type: boolean
              description: >-
                False states "this registration has no editable source" rather than returning an empty string,
                so an editor can tell an inherited entry from an empty created one.
            source_revision:
              type: string
              description: >-
                Content-addressed revision of the installed source registration. Absent for a
                definition-registered tool, which has no editable source.
    SessionToolDetail:
      type: object
      description: A session tool row plus the argument schema and the execution gate, as on the global detail read.
      allOf:
        - $ref: '#/components/schemas/SessionToolSummary'
        - type: object
          additionalProperties: false
          properties:
            parameters:
              type: object
              description: >-
                The JSON Schema of the arguments as this session's registry holds it, which for a created tool is
                the schema the operator submitted.
              additionalProperties: true
            execution:
              $ref: '#/components/schemas/ToolExecutionScope'
    ToolExecutionScope:
      type: object
      description: >-
        How this entry may be called from HTTP, stated rather than inferred. `session_required` is the normal
        answer for a protected control tool, whose effect depends on a live conversation.
      required: [scope, manual]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [global, session_required, session_only]
          description: >-
            `global` may also be called without a session; `session_required` is the same entry seen from the
            session route; `session_only` means the entry exists only in this session (created or replaced).
        manual:
          type: boolean
          description: False when an operator call is refused even in a valid scope, with the reason in the 409 message.
    SessionToolPage:
      description: >-
        Page of session toolbox rows. Deliberately absent from every row: the argument JSON Schema, the source
        text, and any tool result payload.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, budget]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/SessionToolSummary'
            budget:
              type: object
              description: The created-tool budget, reported on the collection so a client can explain a 409 before trying.
              required: [used, limit]
              additionalProperties: false
              properties:
                used:
                  type: integer
                  minimum: 0
                limit:
                  type: integer
                  minimum: 1
    SessionToolResponse:
      type: object
      description: Envelope of one session tool detail read.
      required: [tool]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/SessionToolDetail'
    CreateSessionToolRequest:
      type: object
      description: >-
        Declarative tool creation. Compiles a candidate and NEVER runs it, so registering has no side effect
        until a call. Tags are REQUIRED because an untagged tool could never be discovered.
      required: [name, description, tags]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
          maxLength: 64
        description:
          type: string
          maxLength: 2000
          description: Shown to the model and used by discovery matching.
        tags:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 64
        parameters:
          type: object
          description: JSON Schema for the arguments, bounded in depth (12), node count (256), and serialised bytes (16,384).
          additionalProperties: true
        source:
          type: string
          maxLength: 65536
          description: >-
            Optional async function BODY, e.g. `return args.toUpperCase();`. Compiled with the host realm's
            `Function` constructor and run with the process's own permissions: no sandbox, no isolation, the
            same trust model as the `shell` tool. Mutually exclusive with `module_text`.
        module_text:
          type: string
          maxLength: 262144
          description: >-
            Full editable module source for a module revision. Mutually exclusive with `source`, and both are
            refused with 403 on a deployment that does not grant source submission.
        source_path:
          type: string
          maxLength: 512
          description: >-
            Package-relative or absolute entry path, so a restore can re-read the editable source. A path the
            host can already resolve; this route never uploads a file tree.
        dependencies:
          type: array
          maxItems: 32
          description: Captured local helper modules belonging to this revision.
          items:
            type: object
            required: [path, text]
            additionalProperties: false
            properties:
              path:
                type: string
                maxLength: 512
              text:
                type: string
                maxLength: 262144
        visibility:
          type: string
          enum: [core, searchable]
          description: Omitted means `searchable`, registered enabled at once, so the next turn can call it without a discovery round.
        replace:
          type: boolean
          description: >-
            Must be true to publish over a name this session already resolves; without it a collision is 409. A
            `protected` name is refused with 403 even with this set.
    UpdateSessionToolRequest:
      type: object
      description: >-
        An omitted property is no change and a supplied value REPLACES the whole field (arrays and schemas are
        replaced, never merged). At least one property is required, so `{}` is a 400 no-op. Supplying source
        publishes a NEW revision atomically; a compile failure is 400 and the previous revision stays callable.
      minProperties: 1
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 2000
        tags:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 64
        parameters:
          type: object
          additionalProperties: true
        visibility:
          type: string
          enum: [core, searchable]
        enabled:
          type: boolean
          description: >-
            The reversible gate. `false` withdraws the tool from this session's callable set without losing
            anything; `true` restores the inherited binding exactly.
        source:
          type: string
          maxLength: 65536
        module_text:
          type: string
          maxLength: 262144
        dependencies:
          type: array
          maxItems: 32
          items:
            type: object
            required: [path, text]
            additionalProperties: false
            properties:
              path:
                type: string
                maxLength: 512
              text:
                type: string
                maxLength: 262144
        replace:
          type: boolean
          description: Required to publish a new source revision over a name another registration already owns.
    SessionToolRegistrationResult:
      type: object
      description: >-
        Metadata only: no function, schema body, or source text is echoed, so a create or update costs one short
        result and a client reads the source route when it needs the bytes.
      required: [name, source_revision, created, replaced, budget]
      additionalProperties: false
      properties:
        name:
          type: string
        source_revision:
          type: string
          description: The installed revision. A replacement changes this value.
        created:
          type: boolean
          description: True when the name was not registered in this session before this call.
        replaced:
          type: boolean
          description: True when an existing registration was atomically replaced.
        previous_revision:
          type: string
        source_path:
          type: string
        checks:
          type: array
          description: The validation checks the registration kernel performed for this revision.
          items:
            type: string
        budget:
          type: object
          description: The created-tool budget after this call, so a client learns the limit was consumed without a second read.
          required: [used, limit]
          additionalProperties: false
          properties:
            used:
              type: integer
              minimum: 0
            limit:
              type: integer
              minimum: 1
    SessionToolRegistrationResponse:
      type: object
      description: Envelope of a session tool create or update.
      required: [registration]
      additionalProperties: false
      properties:
        registration:
          $ref: '#/components/schemas/SessionToolRegistrationResult'
    DeleteSessionToolResult:
      type: object
      description: >-
        The receipt states what the removal actually did, because removing a name this session OVERRODE restores
        the inherited catalogue binding, while removing a name created in this session simply ends it.
      required: [deleted, tool_id, session_id, removed_created, restored_inherited]
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          enum: [true]
        tool_id:
          type: string
        session_id:
          type: string
        removed_created:
          type: boolean
          description: True when the removed registration was a tool created in this session.
        restored_inherited:
          type: boolean
          description: >-
            True when a catalogue or harness-level binding became visible again because the session-local
            registration is gone - the undo a deletion performs rather than a destruction.
    SessionToolSourceResponse:
      type: object
      description: The installed source revision of one session tool.
      required: [name, revision, session_id]
      additionalProperties: false
      properties:
        session_id:
          type: string
        name:
          type: string
        revision:
          type: string
          description: Content-addressed, so a client can diff what is live against what it last sent.
        source_path:
          type: string
        module_text:
          type: string
          maxLength: 262144
        source:
          type: string
          maxLength: 65536
          description: The function body of a body-shaped registration, absent for a module-shaped one.
        dependencies:
          type: array
          maxItems: 32
          items:
            type: object
            required: [path, text]
            additionalProperties: false
            properties:
              path:
                type: string
              text:
                type: string
    # ---------------------------------------------------------------------
    # Tasks, queue, reset, cancel
    # ---------------------------------------------------------------------
    SubmitTaskRequest:
      type: object
      description: >-
        The durable submit body. `input` is trimmed and bounded server-side; empty or whitespace input is
        accepted only when at least one attachment is present. Attachments are referenced by the markers inside
        the text. Every field is re-validated BEFORE a turn exists, so a malformed, oversized, or mismatched
        submission answers 400/413/415 with nothing mutated.
      required: [input]
      additionalProperties: false
      properties:
        input:
          type: string
          maxLength: 200000
        attachments:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/HarnessAttachment'
        references:
          type: array
          maxItems: 16
          description: >-
            Prior blocks whose completed results this task wants as context. A malformed entry, an unknown turn
            or label, and an already-failed or cancelled block are all 400 before a turn exists. Typed `#LABEL`
            tokens inside `input` are resolved server-side when the array is absent or does not already cover
            that label, so a client without metadata still works.
          items:
            $ref: '#/components/schemas/AgentResultReference'
        thread_id:
          type: string
          description: >-
            The persistent conversation this input belongs to. Absent opens a NEW host thread for the primary
            agent, connected by a reference edge to any referenced threads. Present and RUNNING steers the text
            into that conversation at its next safe model boundary, unless an attachment is present or a
            reference has not completed - both become a QUEUED CONTINUATION instead. Present and IDLE or STOPPED
            starts a continuation turn in that thread, reviving a stopped conversation. Unknown or deleted ids
            are 404 before anything mutates.
    TaskReceipt:
      type: object
      description: >-
        The 202 answer: what the server accepted, where it put it, and which resources moved. It never echoes
        the session or the turn record, because a receipt plus the stream's `turn.upsert` frame plus a bounded
        `/turns` page carry the same information at a fraction of the size.
      required: [session_id, turn_id, status, thread_id, session_revision, accepted_at, links]
      additionalProperties: false
      properties:
        session_id:
          type: string
        turn_id:
          type: string
          description: >-
            The created turn, or the OWNING turn when the submit was steered into a running conversation rather
            than becoming a new record. A slash command is terminal by the time this receipt is produced, so a
            command submit may report `done` or `error` directly.
        status:
          $ref: '#/components/schemas/SessionTurnStatus'
        thread_id:
          type: string
          description: The conversation this input will run in.
        steered:
          type: boolean
          enum: [true]
          description: Present ONLY when the submit folded into a running conversation.
        steered_thread_id:
          type: string
          description: >-
            Always names the conversation the text was delivered to, which disambiguates `turn_id` when the
            owning turn belongs to a PARENT conversation (a steered delegated child).
        queue_position:
          type: integer
          minimum: 1
          description: Present when the submit became a queued task, and equal to `GET .../queue`'s ordering.
        session_revision:
          type: integer
          minimum: 0
          description: The session revision this receipt was produced at, echoed in `X-Harness-Revision`.
        accepted_at:
          type: integer
        links:
          type: object
          description: >-
            Concrete paths for the resources this submit created or changed, so a client reads exactly what it
            needs instead of pulling a tree.
          required: [turn, turns, thread, stream]
          additionalProperties: false
          properties:
            turn:
              type: string
              description: The turn metadata read.
            turns:
              type: string
              description: The turn page to re-read after a gap.
            thread:
              type: string
              description: The conversation metadata read.
            stream:
              type: string
              description: The stream path a client uses to subscribe to this turn's display ops.
    ResetSessionResult:
      type: object
      description: >-
        Receipt of a reset: what was discarded and the new session revision, never the emptied aggregate.
      required: [reset, session_id, discarded_turns, discarded_threads, dropped_queued_tasks, revision]
      additionalProperties: false
      properties:
        reset:
          type: boolean
          enum: [true]
        session_id:
          type: string
        discarded_turns:
          type: integer
          minimum: 0
        discarded_threads:
          type: integer
          minimum: 0
        dropped_queued_tasks:
          type: integer
          minimum: 0
          description: Always 0 on a successful reset, because a running or queued session is refused with 409.
        revision:
          type: integer
          minimum: 0
    CancelSessionRequest:
      type: object
      description: An absent body or `{}` cancels the active run only and leaves queued tasks untouched.
      additionalProperties: false
      properties:
        all:
          type: boolean
          description: >-
            Also drop every queued task, which stay recorded as `cancelled` turn rows rather than disappearing.
            This is the Stop button.
    CancelSessionResult:
      type: object
      description: Outcome of a session-level cancel.
      required: [cancelled, session_id, dropped_queued_tasks, revision]
      additionalProperties: false
      properties:
        cancelled:
          type: boolean
          description: False when nothing was running and nothing was queued, which is a success, not an error.
        session_id:
          type: string
        dropped_queued_tasks:
          type: integer
          minimum: 0
          description: Queued tasks removed by this call (0 unless `all` was requested).
        active_turn_id:
          type: string
          description: The turn that was executing, when there was one.
        revision:
          type: integer
          minimum: 0
    QueuedTask:
      type: object
      description: >-
        One waiting task. The prompt is a bounded PREVIEW with the exact recorded length, because a hundred
        queued 200k-character prompts must not make a queue panel a multi-megabyte read.
      required: [turn_id, index, position, status, prompt_preview, prompt_chars]
      additionalProperties: false
      properties:
        turn_id:
          type: string
        index:
          type: integer
          minimum: 0
          description: The turn's recorded ordinal, stable from submit to terminal.
        position:
          type: integer
          minimum: 0
          description: Order in the pump's queue, 0 first.
        status:
          $ref: '#/components/schemas/SessionTurnStatus'
        prompt_preview:
          type: string
          maxLength: 280
        prompt_chars:
          type: integer
          minimum: 0
          description: EXACT recorded prompt length, which the preview stands in for.
        thread_id:
          type: string
          description: The conversation this task will continue; absent means a new host thread at execution.
        thread_label:
          type: string
        reference_labels:
          type: array
          description: The labels of the blocks this task waits on, so a client can show why it is still queued.
          items:
            type: string
        attachment_count:
          type: integer
          minimum: 0
        accepted_at:
          type: integer
    QueuedTaskPage:
      description: Page of queued tasks, in pump order.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/QueuedTask'
    # ---------------------------------------------------------------------
    # Pending actions
    # ---------------------------------------------------------------------
    PendingAction:
      type: object
      description: >-
        One question a model asked its owner, still waiting. `request` is the verbatim recorded
        `HarnessActionRequest`, so the options a client may answer with are exactly the options the model
        offered. The routing fields are projections of recorded state, included so a reconnecting client can
        send the answer to the right conversation instead of guessing.
      required: [request, turn_id, agent, received_at]
      additionalProperties: false
      properties:
        request:
          $ref: '#/components/schemas/HarnessActionRequest'
        turn_id:
          type: string
          description: The turn whose run is parked waiting for this answer.
        thread_id:
          type: string
          description: The persistent conversation the question came from.
        agent:
          type: string
          description: The agent that asked, which is also the identity the answer resumes.
        received_at:
          type: integer
          description: Epoch milliseconds when the runtime opened the request.
    PendingActionListResponse:
      type: object
      description: >-
        Envelope of the owner questions still waiting. Live requests only, in the order they were opened, at
        most 4. A request restored from disk is expired and is NOT listed, because its promise no longer
        exists.
      required: [session_id, actions, revision]
      additionalProperties: false
      properties:
        session_id:
          type: string
        actions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/PendingAction'
        revision:
          type: integer
          minimum: 0
          description: >-
            The `actions` counter of `StreamResourceKind`, the same figure a `session` subscription reports in
            `subscription_state.revisions`, so an opened or closed question can be ordered against a read. It moves
            when the waiting set changes, not when a question is merely re-read.
    AnswerActionRequest:
      type: object
      description: >-
        Exactly one field is accepted; wrapper-level extras are 400. The choice is validated against the
        RECORDED request, so an unknown option id is refused rather than quietly defaulted.
      required: [choice]
      additionalProperties: false
      properties:
        choice:
          $ref: '#/components/schemas/ActionChoiceInput'
    ActionChoiceInput:
      description: >-
        The answer a client sends, either an option id or free text, never both. Request-side spelling is
        snake_case; the recorded event keeps its own names, which the turn's event page shows.
      oneOf:
        - type: object
          required: [kind, option_id]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [option]
            option_id:
              type: string
        - type: object
          required: [kind, text]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [custom]
            text:
              type: string
              maxLength: 200000
    AnswerActionResult:
      type: object
      description: >-
        Deliberately minimal: the authoritative record is the persisted `action_answer` event on the turn, which
        every client can read, so this route does not restate the choice.
      required: [ok, request_id, resolved_at]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        request_id:
          type: string
        resolved_at:
          type: integer
    # ---------------------------------------------------------------------
    # Commands and usage
    # ---------------------------------------------------------------------
    CommandDescriptor:
      type: object
      description: >-
        One registered slash command, projected for a composer: the registry key, the line a client inserts,
        the one-line summary, and the argument template. Names are validated by the shared parser
        (`src/core/command.ts`), so an invocation is always `/`-safe and lowercase.
      required: [name, invocation, description]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
        invocation:
          type: string
          description: The exact prefix that dispatches this command, e.g. `/task`.
          pattern: '^/[a-z][a-z0-9-]{0,31}$'
        description:
          type: string
          maxLength: 500
        usage:
          type: string
          maxLength: 400
          description: Argument template shown by `/help`, for example `/task add <text>`.
    CommandPage:
      description: Page of command descriptors from this session's live registry.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/CommandDescriptor'
    UsageByThread:
      type: object
      description: One conversation's share of the session's reported usage, so cost follows what the user is looking at.
      required: [thread_id, usage]
      additionalProperties: false
      properties:
        thread_id:
          type: string
        usage:
          $ref: '#/components/schemas/HarnessUsage'
    SessionUsageResponse:
      type: object
      description: >-
        A server-computed fold of the session's per-turn tallies. Honest about unknowns: a provider that never
        reports usage contributes nothing, so `usage` is absent when no turn reported any rather than printed as
        zero, and `reported_turns` states how many turns carried a tally.
      required: [session_id, turn_count, reported_turns, by_thread, truncated, revision]
      additionalProperties: false
      properties:
        session_id:
          type: string
        turn_count:
          type: integer
          minimum: 0
          description: Recorded turns of every status.
        reported_turns:
          type: integer
          minimum: 0
          description: Turns that carried a server-summed tally; the difference had no provider usage at all.
        usage:
          description: Absent when no turn reported usage, which is not the same statement as zero.
          allOf:
            - $ref: '#/components/schemas/HarnessUsage'
        by_thread:
          type: array
          maxItems: 100
          description: >-
            Per-conversation totals, page-sized at most 100 rows and ordered by total descending. When
            `truncated` is true the omitted rows are derivable from the turn pages, which each carry their own
            usage.
          items:
            $ref: '#/components/schemas/UsageByThread'
        truncated:
          type: boolean
          description: True when `by_thread` was cut at 100 rows, so the reader never mistakes the list for a complete partition.
        revision:
          type: integer
          minimum: 0
    # ---------------------------------------------------------------------
    # Persistent conversations
    # ---------------------------------------------------------------------
    ThreadSummary:
      type: object
      description: >-
        One conversation as a roster row: identity, ownership, lifecycle, and transcript SIGNALS. The committed
        transcript - every tool result verbatim, each bounded at 65,536 bytes of text - is deliberately absent,
        which is what makes a 256-conversation roster a bounded read. `message_count` and `has_transcript` say
        whether a transcript read is worth asking for, and `preview` is a bounded tail of the last entry.
      required: [id, agent, origin, status, sequence, transcript_state, message_count, has_transcript]
      additionalProperties: false
      properties:
        id:
          type: string
        agent:
          type: string
        origin:
          type: string
          enum: [agent, host]
          description: >-
            `agent` is that agent's DEFAULT conversation, implicit and never deletable; `host` is an ADDITIONAL
            independent conversation, opened by an unfocused submit, by a client, or by a delegated child.
        status:
          type: string
          enum: [idle, running, stopped]
        sequence:
          type: integer
          minimum: 0
          description: Creation order, monotonic per session.
        owner_thread_id:
          type: string
          description: The persistent parent thread of a delegated child. This is lineage; a reference edge is not.
        label:
          type: string
          description: The stable agent-prefixed conversation label (`RR2`, `IT1`), drawn from one per-code sequence.
        transcript_state:
          type: string
          enum: [ok, unreadable]
          description: >-
            `unreadable` means the stored transcript is not a valid message list, so the live transcript is a
            valid placeholder. One hand-broken transcript must never cost the user the whole session, which is
            why this is a per-row flag rather than a load failure.
        transcript_error:
          type: string
          maxLength: 1000
          description: The validation refusal message for an `unreadable` transcript.
        message_count:
          type: integer
          minimum: 0
          description: How many transcript entries the conversation holds, never their content.
        chars:
          type: integer
          minimum: 0
          description: Exact character total of the stored transcript, so a client can size a paged read.
        has_transcript:
          type: boolean
        preview:
          type: string
          maxLength: 280
          description: Bounded tail of the last committed entry, so a roster row still shows something.
    ThreadResource:
      type: object
      description: >-
        One conversation in full: everything a roster row carries plus the invocation roster and the reference
        graph. Still no messages, because those are the transcript routes.
      allOf:
        - $ref: '#/components/schemas/ThreadSummary'
        - type: object
          required: [session_id, transcript_revision, invocation_ids, invocation_ids_truncated, revision]
          additionalProperties: false
          properties:
            session_id:
              type: string
            origin_turn_id:
              type: string
              description: The first recorded turn that ran in this conversation; absent for a runtime-created child.
            origin_invocation_id:
              type: string
              description: That first run's invocation identity, the join to the events of the turn that started it.
            invocation_id:
              type: string
              description: The invocation identity of this conversation's LATEST run.
            invocation_ids:
              type: array
              maxItems: 512
              description: >-
                EVERY invocation id observed running here, oldest first - the complete join to invocation cards
                inside turn events, which the single latest and origin slots cannot provide once a conversation
                has been resumed. Values are unique and belong to this thread only.
              items:
                type: string
            invocation_ids_truncated:
              type: boolean
              description: >-
                True when the roster exceeded 512 entries and the oldest were dropped, so a client never mistakes
                a cut list for the whole history.
            references:
              type: array
              maxItems: 16
              description: The result blocks this conversation consumes (the `#` links), deduplicated.
              items:
                $ref: '#/components/schemas/AgentResultReference'
            connected_thread_ids:
              type: array
              description: >-
                The conversations those blocks belong to. A REFERENCE EDGE, never ownership: stopping or deleting
                a connected source neither aborts nor removes this conversation.
              items:
                type: string
            transcript_revision:
              type: integer
              minimum: 0
              description: >-
                Monotonic revision of this transcript. A stream `transcript.updated` frame carries it, so a client
                that already read a newer revision ignores the frame.
            transcript_bytes:
              type: integer
              minimum: 0
              description: Stored size in bytes, so a client chooses a page size rather than guessing one.
            revision:
              type: integer
              minimum: 0
              description: Monotonic revision of this thread record (status, label, and roster changes).
    ThreadResponse:
      type: object
      description: Envelope of a conversation read or create.
      required: [thread]
      additionalProperties: false
      properties:
        thread:
          $ref: '#/components/schemas/ThreadResource'
    ThreadSummaryPage:
      description: Page of conversation rows.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ThreadSummary'
    CreateSessionThreadRequest:
      type: object
      description: >-
        Opens an additional independent conversation for one member agent. Nothing runs until a task names it,
        so thread creation is free.
      required: [agent]
      additionalProperties: false
      properties:
        agent:
          type: string
          description: Must name a member of this session's frozen harness definition.
        label:
          type: string
          maxLength: 120
          description: Trimmed display label. Grants no authority and is not an identifier.
        owner_thread_id:
          type: string
          description: >-
            Must already exist and must be a HOST thread, because an agent's default conversation is implicit and
            is never persisted as a thread record that could be restored as an owner.
    DeleteThreadResult:
      type: object
      description: >-
        Receipt of a conversation removal. It names what went with the conversation, because the cascade -
        descendants, owning turns, result references, transcripts, and their persisted copies - is the part a
        client must report to the user.
      required: [deleted, thread_id, session_id, removed_descendants, removed_turns, revision]
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          enum: [true]
        thread_id:
          type: string
        session_id:
          type: string
        removed_descendants:
          type: integer
          minimum: 0
        removed_turns:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
          description: The roster revision after the removal.
    CancelThreadResult:
      type: object
      description: Outcome of stopping one conversation.
      required: [cancelled, thread_id, session_id, status, dropped_queued_tasks, revision]
      additionalProperties: false
      properties:
        cancelled:
          type: boolean
          description: >-
            True when a live run was aborted or at least one queued turn of that conversation was dropped; false
            when the conversation was merely marked stopped because it had no work.
        thread_id:
          type: string
        session_id:
          type: string
        status:
          type: string
          enum: [stopped]
          description: The conversation's state after the call, which a later submit to this thread revives.
        dropped_queued_tasks:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
    # ---------------------------------------------------------------------
    # Transcripts
    # ---------------------------------------------------------------------
    TranscriptMetadata:
      type: object
      description: >-
        The cheap head of one transcript: size, counts, revision, and validity. No content at all, so a client
        can decide whether a paged read or a document read is the cheaper next step.
      required:
        - session_id
        - thread_id
        - agent
        - transcript_state
        - message_count
        - chars
        - bytes
        - revision
        - role_counts
      additionalProperties: false
      properties:
        session_id:
          type: string
        thread_id:
          type: string
        agent:
          type: string
        transcript_state:
          type: string
          enum: [ok, unreadable]
        message_count:
          type: integer
          minimum: 0
        chars:
          type: integer
          minimum: 0
        bytes:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
        role_counts:
          type: object
          description: Entries per role, so an operator sees the shape of a conversation before opening it.
          required: [system, user, assistant, tool]
          additionalProperties: false
          properties:
            system:
              type: integer
              minimum: 0
            user:
              type: integer
              minimum: 0
            assistant:
              type: integer
              minimum: 0
            tool:
              type: integer
              minimum: 0
        unreadable_reason:
          type: string
          maxLength: 1000
          description: >-
            Present only when `transcript_state` is `unreadable`: the validation message that refused the stored
            value.
        stored_type:
          type: string
          enum: ['object', 'array', 'string', 'number', 'boolean', 'null']
          description: >-
            Present only when `transcript_state` is `unreadable`: the JSON kind actually stored, so an editor can
            state the problem without downloading the value.
    TranscriptMetadataResponse:
      type: object
      description: Envelope of the transcript metadata read.
      required: [transcript]
      additionalProperties: false
      properties:
        transcript:
          $ref: '#/components/schemas/TranscriptMetadata'
    TranscriptMessagePage:
      description: >-
        Page of transcript entries. `total` is the entry count of the WHOLE transcript, independent of the
        `role` filter, so a client can page a filtered view and still know the conversation's size. `revision` is
        the transcript's own counter (`TranscriptMetadata.revision`), the same figure the `transcript` and
        `transcript_messages` kinds of `StreamResourceKind` report, so paging and replacing never present two
        numbers to compare. A tool entry's `content` is recorded text bounded at the model-facing 65,536 bytes,
        which is precisely why this route is paged rather than embedded in a session read.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, thread_id, agent, transcript_state, total]
          additionalProperties: false
          properties:
            thread_id:
              type: string
            agent:
              type: string
            transcript_state:
              type: string
              enum: [ok, unreadable]
              description: >-
                `unreadable` means these entries are the valid placeholder the model is sent, not the broken
                stored value; the stored value is on the document route.
            total:
              type: integer
              minimum: 0
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/HarnessMessage'
    TranscriptDocumentResponse:
      type: object
      description: >-
        The whole transcript as one JSON TEXT document - the editor's and the export surface, and the counterpart
        of the whole-document PUT. It is a separate route precisely so that reading a transcript for display and
        reading it for editing stay different, differently sized, operations.
      required: [session_id, thread_id, agent, revision, transcript_state, document]
      additionalProperties: false
      properties:
        session_id:
          type: string
        thread_id:
          type: string
        agent:
          type: string
        revision:
          type: integer
          minimum: 0
          description: >-
            The transcript revision this document was rendered from. A client sends it back with a whole-document
            write to detect that someone else edited in the meantime.
        transcript_state:
          type: string
          enum: [ok, unreadable]
        document:
          type: string
          description: >-
            The pretty-printed JSON text an editor edits. For an `unreadable` transcript this is the stored value
            VERBATIM, so what is shown is what is actually saved. Delivered as a string field, not an object,
            because formatting and key order are what an operator is editing.
        content_type:
          type: string
          enum: [application/json]
          description: The format the `document` string holds.
    UpdateThreadTranscriptRequest:
      type: object
      description: >-
        `messages` is DELIBERATELY untyped: the transcript is fully user-modifiable JSON, and a structurally
        broken value is a SUCCESSFUL write, not a 400. Only an absent `messages` property (a malformed body) is
        a 400.
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          description: >-
            The whole transcript document, valid or not: arbitrary JSON of any kind (object, array, string,
            number, boolean, or `null`).
        if_revision:
          type: integer
          minimum: 0
          description: >-
            Optional optimistic lock: the transcript revision the document was edited from. A mismatch is 409 with
            the current revision in the message, and nothing is written, so an editor cannot silently overwrite a
            concurrent change.
    TranscriptWriteReceipt:
      type: object
      description: >-
        Receipt of a whole-document write. The validation outcome is data, not a status code: a broken draft is
        accepted, stored raw, and explained, while the conversation's live transcript stays a valid placeholder -
        an invalid transcript is NEVER installed into the model's context.
      required: [session_id, thread_id, accepted_as, message_count, revision]
      additionalProperties: false
      properties:
        session_id:
          type: string
        thread_id:
          type: string
        accepted_as:
          type: string
          enum: [transcript, raw]
          description: >-
            `transcript` means the value parsed into a valid message list and is now live. `raw` means it was
            stored verbatim and the live transcript is a placeholder; `invalid` explains it.
        message_count:
          type: integer
          minimum: 0
          description: Entries now LIVE for the model, which is 0-plus-placeholder for a `raw` acceptance.
        revision:
          type: integer
          minimum: 0
          description: The new transcript revision, echoed for a client's optimistic lock.
        invalid:
          type: object
          description: Present only when `accepted_as` is `raw`.
          required: [error, stored_type]
          additionalProperties: false
          properties:
            error:
              type: string
              maxLength: 1000
              description: The exact validation refusal, so an editor can fix the real problem.
            stored_type:
              type: string
              enum: ['object', 'array', 'string', 'number', 'boolean', 'null']
        links:
          type: object
          description: The reads that show the result, so a client never receives a tree back.
          additionalProperties: false
          properties:
            transcript:
              type: string
            messages:
              type: string
            document:
              type: string
    # ---------------------------------------------------------------------
    # Turn records
    # ---------------------------------------------------------------------
    AttachmentDescriptor:
      type: object
      description: >-
        One attachment WITHOUT its bytes: identity, the prompt marker that positions it, and the size the bytes
        would have. This is what rides on a turn row, so a composer and a transcript can render chips without
        pulling megabytes; `GET .../attachments/{attachment_id}` is the route that carries `data`.
      required: [id, kind, marker, name, mime, size, has_bytes]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable and unique within one turn, so a preview can be updated in place and a record round-trips.
        kind:
          type: string
          enum: [image, video, audio, pdf, file]
        marker:
          type: string
          maxLength: 32
          description: The exact label the composer inserted into the prompt, e.g. `[Image 1]`.
        name:
          type: string
          maxLength: 256
          description: Plain file name only, never a path or a URL.
        mime:
          type: string
          maxLength: 128
          description: Lowercase MIME type without parameters, e.g. `image/png`.
        size:
          type: integer
          minimum: 0
          description: Decoded byte length of the recorded bytes.
        has_bytes:
          type: boolean
          description: >-
            True when recorded bytes exist and are served by `GET .../turns/{turn_id}/attachments/{attachment_id}`.
            A descriptor never carries bytes of its own, so this field is how a client knows a fetch would succeed.
    SteerRecord:
      type: object
      description: >-
        One steered submit, as the audit ring records it: the submit's own durable identity, when it was
        accepted, a bounded preview of the user's trimmed text plus its exact length, and the conversation it was
        delivered to when that is not the owning turn's own thread. The verbatim text lives with the context
        segment this entry's `id` keys, so the audit ring never carries a megabyte of task text on one turn.
        Never contains attachments, because attachments are never steered.
      required: [at, prompt_preview, prompt_chars]
      additionalProperties: false
      properties:
        id:
          type: string
          description: >-
            The submit's durable identity, minted once by the server. It is also the context bar's key for this
            segment, which is what keeps two submits in one millisecond distinct and lets an archived entry be
            resolved after the ring truncates.
        at:
          type: integer
        prompt_preview:
          type: string
          maxLength: 280
        prompt_chars:
          type: integer
          minimum: 0
          description: EXACT character count of the submitted text, which the preview stands in for.
        thread_id:
          type: string
        references:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/AgentResultReference'
    TurnResource:
      type: object
      description: >-
        The durable record of one task, projected as metadata plus COUNTS. The heavy members of a turn record -
        `events`, `eventTimes`, `steerTexts`, attachment bytes - are counted here and fetched from their own
        routes, because a turn that ran for an hour must not be unreadable in one request. This route is a
        projection; the events route is the verbatim record.
      required:
        - session_id
        - id
        - index
        - status
        - prompt
        - event_count
        - attachment_count
        - steer_count
        - updated_at
        - revision
      additionalProperties: false
      properties:
        session_id:
          type: string
        id:
          type: string
        index:
          type: integer
          minimum: 0
          description: Position in the session, monotonic, stable from submit to terminal.
        status:
          $ref: '#/components/schemas/SessionTurnStatus'
        prompt:
          type: string
          maxLength: 200000
          description: The trimmed task text the harness received, verbatim.
        thread_id:
          type: string
          description: The persistent conversation this turn executed in. Absent on a command turn and on a fresh-block run.
        thread_label:
          type: string
          description: The conversation's stable display label; it names the thread, so every continuation turn repeats it.
        started_at:
          type: integer
          description: Absent while `queued`, always present once running or terminal.
        updated_at:
          type: integer
          description: Moves on every recorded event and again when the turn reaches a terminal status.
        usage:
          description: The server-summed tally across every agent request in this turn, absent when no request reported any.
          allOf:
            - $ref: '#/components/schemas/HarnessUsage'
        error:
          description: The recorded failure, present for a turn that ended in `error`.
          allOf:
            - $ref: '#/components/schemas/HarnessErrorInfo'
        references:
          type: array
          maxItems: 16
          description: The result blocks this task was submitted with, bound at enqueue.
          items:
            $ref: '#/components/schemas/AgentResultReference'
        attachments:
          type: array
          maxItems: 4
          description: Descriptors only; bytes are one named subresource each.
          items:
            $ref: '#/components/schemas/AttachmentDescriptor'
        event_count:
          type: integer
          minimum: 0
          description: >-
            Recorded events for this turn, including events from a delegation it reached. Page them with
            `GET .../turns/{turn_id}/events`.
        event_time_count:
          type: integer
          minimum: 0
          description: Entries in `eventTimes`; equals `event_count` for a fully recorded turn, and a difference is stated rather than hidden.
        attachment_count:
          type: integer
          minimum: 0
        steer_count:
          type: integer
          minimum: 0
          description: >-
            Entries in the audit ring (at most `steer_records`), not the number of submits - the archive below is
            the complete count.
        steer_text_count:
          type: integer
          minimum: 0
          description: >-
            Steered submits whose TEXT is archived for this turn. Archived text is never ring-truncated, so a
            context-bar segment always resolves, but the text is served per segment, not as a list.
        steers:
          type: array
          maxItems: 64
          description: The bounded audit ring itself, newest last.
          items:
            $ref: '#/components/schemas/SteerRecord'
        revision:
          type: integer
          minimum: 0
    TurnResponse:
      type: object
      description: Envelope of the turn metadata read.
      required: [turn]
      additionalProperties: false
      properties:
        turn:
          $ref: '#/components/schemas/TurnResource'
    TurnEventRow:
      type: object
      description: >-
        One recorded event with its ordinal and the server's wall-clock time for it. The two parallel arrays of
        the durable record (`events` and `eventTimes`) arrive paired, so a client never re-pairs indices by
        position and cannot get them wrong after a filtered page.
      required: [index, event]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
          description: >-
            The event's ordinal inside this turn - the same number `src/server/journal.ts` addresses as
            `(turn_id, index)`, and the number a step or block id is derived from.
        at:
          type: integer
          description: Epoch milliseconds the server recorded this event, from the record's `eventTimes`.
        event:
          $ref: '#/components/schemas/HarnessEvent'
    TurnEventPage:
      description: >-
        Page of one turn's verbatim recorded events. `revision` is the owning turn's `TurnResource.revision` (the
        `turn_events` counter of `StreamResourceKind` is DEFINED to be that figure), and `total_events` is the
        position within it, so a client holding the turn revision already knows whether this page is current - one
        counter per comparison, never two. `partial` is true while the turn is still running, so a client keeps
        polling from `next_cursor` instead of assuming the record is complete.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, turn_id, total_events, partial]
          additionalProperties: false
          properties:
            turn_id:
              type: string
            total_events:
              type: integer
              minimum: 0
              description: Events recorded so far, independent of the `type` filter.
            partial:
              type: boolean
              description: True when the turn is still executing and more events will follow.
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/TurnEventRow'
    AttachmentResponse:
      type: object
      description: >-
        Envelope carrying one attachment's recorded bytes. `data` is canonical base64 with no prefix and no
        whitespace, and `size` agrees with its decoded length - the same invariant the submit route validates.
      required: [attachment]
      additionalProperties: false
      properties:
        attachment:
          $ref: '#/components/schemas/HarnessAttachment'
    # ---------------------------------------------------------------------
    # Display projection (projector-native field names)
    # ---------------------------------------------------------------------
    DisplayState:
      type: string
      description: >-
        The folded state a row prints verbatim. `streaming` is the server's mapping of a running turn onto what
        a live row should show, so the pre-computed state travels instead of a status plus a client rule.
      enum: [queued, streaming, done, error, cancelled]
    SectionDisplayState:
      type: string
      description: One agent flow's state. `open` means started with nothing committed yet.
      enum: [open, streaming, done, error, cancelled]
    StepDisplayState:
      type: string
      description: One tool or action row's state.
      enum: [running, ok, error, cancelled]
    DisplayAttachmentSummary:
      type: object
      description: >-
        A chip-sized attachment summary, carrying NO bytes at all. Base64 exists in exactly two places in this
        contract - a task submit body and the single-attachment bytes route - and that route is the ONLY read
        location for recorded media, so a list, a turn row, a display tree, and a stream frame can never be sized
        by an image. `hasBytes` states that recorded bytes exist and are read from there.
      required: [id, marker, name, kind, mime, size, hasBytes]
      additionalProperties: false
      properties:
        id:
          type: string
        marker:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 256
        kind:
          type: string
          enum: [image, video, audio, pdf, file]
        mime:
          type: string
          maxLength: 128
        size:
          type: integer
          minimum: 0
        hasBytes:
          type: boolean
          description: >-
            True when recorded bytes exist and are served by `GET .../turns/{turn_id}/attachments/{attachment_id}`;
            false states that the turn was recorded without media for this marker. This summary has no byte field at
            all, so no reader can accidentally inline one.
    DisplayBlockSummary:
      type: object
      description: >-
        One referenceable result block WITHOUT its text: the reference-picker's source, with `referenceable`
        decided server-side so a popup applies one boolean instead of restating a status rule.
      required: [turnId, label, agent, status, referenceable]
      additionalProperties: false
      properties:
        turnId:
          type: string
        threadId:
          type: string
          description: >-
            Absent means the ROOT invocation; otherwise the invocation key, which is a runtime thread id or the
            stable synthetic key `call:<callId>` or `inline:<agent>`.
        label:
          type: string
        agent:
          type: string
        status:
          type: string
          enum: [queued, running, done, error, cancelled]
        preview:
          type: string
          maxLength: 200
          description: Bounded snippet of the block's latest committed prose.
        referenceable:
          type: boolean
    DisplaySteerSummary:
      type: object
      description: >-
        One steered submit as the compact row sees it, keyed by the submit's own durable identity so two submits
        in one millisecond stay distinct and a truncated ring never renumbers a survivor. The text is a bounded
        preview; the submit's verbatim text is the user context segment this row's `id` keys, so a click reaches
        the full bytes by one identified read.
      required: [at, promptPreview, promptChars]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The submit's durable identity, which is also the context bar's key for this segment.
        at:
          type: integer
        promptPreview:
          type: string
          maxLength: 280
        promptChars:
          type: integer
          minimum: 0
          description: EXACT recorded length of the submitted text.
        sectionId:
          type: string
          description: Set only when the steer belongs to a nested invocation of this turn.
        threadId:
          type: string
          description: The conversation the text was delivered to, when it is not this turn's own thread.
        references:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/AgentResultReference'
    TurnSummary:
      type: object
      description: >-
        Everything one turn tile shows, computed by the server from the recorded turn: no event list, no
        `eventTimes`, no full block content, no full panel, no attachment bytes, no instruction or reasoning
        text, and NO verbatim prompt - a row carries a bounded preview plus the EXACT recorded length, because a
        page of 100 turns must stay bounded however long each task text is. The verbatim prompt is one
        identified read away on the turn metadata route, and the user bubble's full text is also a context
        segment. A page of these is the default conversation surface, and its size is bounded by the page limit
        alone.
      required: [id, index, promptPreview, promptChars, status, state, updatedAt, sectionCount, stepCount, activeAgents, blocks]
      additionalProperties: false
      properties:
        id:
          type: string
        index:
          type: integer
          minimum: 0
        promptPreview:
          type: string
          maxLength: 280
          description: Bounded head of the recorded prompt, at `DISPLAY_PREVIEW_CHARS`, standing in for the full task text.
        promptChars:
          type: integer
          minimum: 0
          description: >-
            EXACT recorded prompt length, so a client states "showing 280 of 12,400 characters" instead of
            implying the row holds the whole task.
        status:
          $ref: '#/components/schemas/SessionTurnStatus'
        state:
          $ref: '#/components/schemas/DisplayState'
        threadId:
          type: string
        threadLabel:
          type: string
        startedAt:
          type: integer
        updatedAt:
          type: integer
        usage:
          description: The server-owned token tally, absent when no request reported usage.
          allOf:
            - $ref: '#/components/schemas/HarnessUsage'
        latestInput:
          type: integer
          minimum: 0
          description: The LATEST request's input tokens, precomputed so a tile never derives a figure.
        cachedInput:
          type: integer
          minimum: 0
          description: Turn-wide cached input, precomputed.
        detail:
          type: string
          maxLength: 500
          description: Short bounded status line for a settled tile (the model name, the error text, the cancellation reason).
        sectionCount:
          type: integer
          minimum: 0
        stepCount:
          type: integer
          minimum: 0
        activeAgents:
          type: array
          description: Agent names with live work in this turn. Empty means nothing runs, replacing a walk over every event.
          items:
            type: string
        attachments:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/DisplayAttachmentSummary'
        references:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/AgentResultReference'
        steers:
          type: array
          maxItems: 64
          description: The bounded audit ring of steered submits, as display summaries.
          items:
            $ref: '#/components/schemas/DisplaySteerSummary'
        blocks:
          type: array
          maxItems: 64
          description: The reference-picker source, decided server-side.
          items:
            $ref: '#/components/schemas/DisplayBlockSummary'
    TurnSummaryPage:
      description: Page of turn rows, in the requested order.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/TurnSummary'
    DisplayNode:
      type: object
      description: >-
        One node of a section's flow, discriminated by `kind`: `text`, `reasoning`, `step`, or `notice`. Identity
        is the recorded event index that OPENED the node's window, so an addressed patch never depends on arrival
        order. A bounded node carries a preview plus the EXACT `chars`, and `redacted` is stated in the same patch
        that replaces text with a preview, so redaction is never inferred from a length.
      required: [kind, id]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [text, reasoning, step, notice]
        id:
          type: string
        text:
          type: string
          maxLength: 320
          description: A preview, bounded at `DISPLAY_NODE_PREVIEW_CHARS`, unless this node holds a designated full payload.
        committed:
          type: boolean
          description: True once the node's window is final, so a later retry cannot discard it.
        chars:
          type: integer
          minimum: 0
          description: EXACT recorded length in UTF-16 code units, whether or not `text` is the whole thing.
        redacted:
          type: boolean
          description: >-
            Tri-state by presence: absent means "no statement", true means `text` is a preview, false means `text`
            is the whole recorded bytes again because the block that superseded it was discarded.
        share:
          type: number
          description: Fraction of the section's output this node accounts for, used for a proportional bar.
        tone:
          type: string
          enum: [retry, wake, error, steer, answer, info]
          description: Notice tone only.
        at:
          type: integer
        stepId:
          type: string
          description: For a notice, the step it explains.
    DisplayStep:
      type: object
      description: >-
        One tool or action row. `id` is the opening event index as a decimal string, which is also the step detail
        route's key, so a click needs no lookup and the id survives a display-tree rebuild.
      required: [kind, id, turnId, sectionId, name, state]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [tool, action]
        id:
          type: string
        turnId:
          type: string
        sectionId:
          type: string
        callId:
          type: string
          description: Carried so a renderer can keep its own per-call handle; wire identity stays `id`.
        name:
          type: string
          description: Tool name, or the action's question title for kind `action`.
        argsPreview:
          type: string
          maxLength: 200
          description: Preview of the recorded raw arguments string, bounded at `DISPLAY_ARGS_PREVIEW_CHARS`.
        preview:
          type: string
          maxLength: 280
          description: Settled tool result preview shown on a collapsed row, bounded at `DISPLAY_PREVIEW_CHARS`.
        state:
          $ref: '#/components/schemas/StepDisplayState'
        durationMs:
          type: integer
          minimum: 0
        panels:
          type: array
          maxItems: 8
          description: Declarative panels the recorded result carried, previewed rather than inlined in full.
          items:
            $ref: '#/components/schemas/ToolUiPanel'
        media:
          type: array
          maxItems: 8
          description: Media DESCRIPTORS only; the bytes belong to the step detail route.
          items:
            $ref: '#/components/schemas/ToolMediaDescriptor'
    ContextBlock:
      type: object
      description: >-
        One segment of the ONE context bar: METADATA ONLY, carrying no text, which is what lets the default wire
        grow with the NUMBER of segments and never with their length. The bytes are exactly one identified read
        away at the block detail route. The display and block routes transport the projector's record VERBATIM
        (./api.ts `getSessionTurnDisplay` and `getSessionTurnBlock` cast, never restate, `projector.display()` and
        `store.blockDetail()`), so these property names ARE the projector's field names
        (src/shared/turn-display.ts `ContextBlock`): `name`, never a renamed `label`, is what the server sends.
        No time figure, no span, and no `inPrompt` verdict is dropped by this record either, because every one of
        them is a figure the durable record already holds and a client may not re-derive.
      required: [kind, id, turnId, sectionId, chars]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [user, system, reasoning, assistant, tool]
        id:
          type: string
          description: >-
            Stable and unique WITHIN the turn, and the detail route's key: `${sectionOrdinal}-${kind}-${key}`.
            `key` is the recorded event index that opens a tool, reasoning, or assistant block, `instructions` for
            the single system block, and `prompt` or a steered submit's own identity for a user block. A block
            discarded with a failed attempt is removed by id and never renumbered.
        turnId:
          type: string
        sectionId:
          type: string
        name:
          type: string
          description: >-
            THE server-decided display name, in the projector's own spelling, and the spelling this server actually
            transports: the recorded tool name for a tool block, and `instructions` / `reasoning` / `answer` /
            `prompt` / `steer` for the others. Optional so a client reads `name`, then `label`, then `kind`, and
            never synthesizes a figure the record does hold; a server producer always states it, and
            `context:set` re-stamps it ONLY when the recorded name changes.
        label:
          type: string
          maxLength: 200
          description: >-
            The same server-decided display figure under its older spelling. No harness producer sends it (the
            display and block routes carry the projector's `name`, and `TurnBlockDetail` is this record plus its
            text), so it is OPTIONAL and a client prefers `name` over it. It stays in the closed set because
            `additionalProperties: false` would otherwise forbid a record a bounded producer may still publish.
        chars:
          type: integer
          minimum: 0
          description: EXACT recorded length of the segment's text, the figure a preview stands in for.
        state:
          $ref: '#/components/schemas/StepDisplayState'
          description: >-
            `tool` only: the call's own state, in the STEP vocabulary the projector mints (`running` while the
            call is open, `ok` / `error` / `cancelled` once it settles, src/server/turn-projector.ts:2022 and
            :2482, and the same figure `DisplayStep.state` carries). ABSENT for a `user` / `system` / `reasoning` /
            `assistant` segment and before a call settles - a system segment answers with NO `state` key at all,
            which is the closed key set the block route returns (src/server/api.test.ts:2195-2206). A record that
            carries a SECTION-vocabulary value anyway is mapped, not narrowed, by the client
            (src/frontend/display-project.ts `segmentStateOf`).
        at:
          type: integer
          minimum: 0
          description: >-
            Recorded time this block's text entered the conversation: the opening event's timestamp, a steered
            submit's own `at`, or the turn's `startedAt` for the prompt. ABSENT when the record carries no
            timestamp, and never `0`, so a renderer never paints a fake time.
        endedAt:
          type: integer
          minimum: 0
          description: Settle time of a tool block (its `tool_result`'s recorded time). Absent while the call is still running, and for every other kind.
        durationMs:
          type: integer
          minimum: 0
          description: >-
            Time taken, so a segment states its own duration without a fetch, and ONLY ever a figure the record
            supports - never a re-derivation or an estimate: the tool's own measured span for a `tool` block (the
            same value `DisplayStep.durationMs` carries, deliberately NOT `endedAt - at`), the recorded stream
            window's span for a `reasoning` / `assistant` window with two distinct timestamped events, and absent
            for `user` / `system`, which have no recorded span.
        argsChars:
          type: integer
          minimum: 0
          description: '`tool` only: EXACT length of the recorded `tool_call.arguments` string (raw JSON); while the call runs, every argument byte recorded SO FAR, which is all the record holds.'
        resultChars:
          type: integer
          minimum: 0
          description: '`tool` only: EXACT length of the recorded `tool_result.content`. ABSENT while no result is recorded (then `chars === argsChars`), exact once the call settles, including a failed or cancelled result.'
        inPrompt:
          type: boolean
          description: >-
            True when this block's recorded text is part of what the requests that follow replay: instructions,
            the user prompt, a steered submit, a committed answer, and a tool block whose text is a settled
            (including failed or cancelled) result or only the arguments of a call still running. False for a
            `reasoning` block, which is streamed and recorded but NEVER replayed into the next request. Stated
            explicitly so a bar never assumes every counted segment is prompt text.
        eventFrom:
          type: integer
          minimum: 0
          description: Recorded event range the block's text is served from, so the lazy answer is reproducible after a restart.
        eventTo:
          type: integer
          minimum: 0
        callId:
          type: string
    DisplayTail:
      type: object
      description: >-
        The ONE block a section displays in full: a POINTER plus that block's own payload, never a copy of the
        tree. For `reasoning` or `assistant` the body is the node's `text`, which is complete while the node holds
        the designation, so the descriptor duplicates nothing; for `tool` the body is the complete recorded
        `args` and, once settled, `result`.
      required: [kind, nodeId, chars, truncated]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [reasoning, assistant, tool]
        nodeId:
          type: string
          description: The node this body renders - a text or reasoning node id, or a step id for a tool. Addressed, never searched for by name or position.
        blockId:
          type: string
          description: The context segment of this same block, when the section recorded one.
        chars:
          type: integer
          minimum: 0
          description: EXACT recorded characters as of this designation.
        truncated:
          type: boolean
          description: >-
            True when the payload below is strictly less than what the record holds. A server producer never sets
            it, so a designated payload is the exact recorded bytes; the field stays so a bounding producer states
            it instead of letting a prefix read as the whole block.
        args:
          type: string
          description: '`tool` only: the complete recorded `tool_call.arguments` string (raw JSON).'
        result:
          type: string
          description: >-
            '`tool` only: the complete recorded `tool_result.content`. Absent while the call has no recorded
            result - still running, cancelled, or an abandoned attempt - which is the same honest absence the
            step's `preview` uses.'
    TurnSection:
      type: object
      description: >-
        One agent flow: the turn's root invocation, or one nested invocation or branch. Nesting is resolved by the
        SERVER from the recorded invocation identity, so a renderer never infers a parent.
      required: [id, role, agent, agentLabel, state]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Server-minted and stable, `${turnId}:${ordinal}` in allocation order.
        parentSectionId:
          type: string
        role:
          type: string
          enum: [primary, subagent]
        agent:
          type: string
        agentLabel:
          type: string
          description: The block label (`RR2`), from one sequence shared with the conversation label.
        model:
          type: string
        invocationId:
          type: string
          description: The runtime invocation identity this section's events carry.
        threadId:
          type: string
          description: >-
            The PERSISTENT conversation, which is what focus, steer, and delete act on. Set for a delegated child
            section as well as the root. Absent honestly means "no recorded join", NEVER "the root conversation".
        threadLabel:
          type: string
        branchId:
          type: string
        state:
          $ref: '#/components/schemas/SectionDisplayState'
        startedAt:
          type: integer
        endedAt:
          type: integer
        latestInput:
          type: integer
          minimum: 0
        cachedInput:
          type: integer
          minimum: 0
        answerNodeId:
          type: string
          description: Pointer to the node holding this section's copy target (the last committed answer). A pointer, not a copy, so prose travels once.
        nodes:
          type: array
          description: Ordered flow content.
          items:
            $ref: '#/components/schemas/DisplayNode'
        steps:
          type: array
          description: Tool and action rows, addressable by their opening event index.
          items:
            $ref: '#/components/schemas/DisplayStep'
        context:
          type: array
          description: The ONE context bar, metadata only, so the frame never grows with the length of the conversation.
          items:
            $ref: '#/components/schemas/ContextBlock'
        tail:
          description: The one block this section displays in full; absent means this producer designated nothing.
          allOf:
            - $ref: '#/components/schemas/DisplayTail'
        pending:
          type: array
          description: Background calls still running for this invocation.
          items:
            $ref: '#/components/schemas/HarnessPendingTool'
    TurnDisplay:
      type: object
      description: >-
        One turn's compiled display tree. `revision` is the `turn_display` counter of `StreamResourceKind`, defined
        to equal the owning turn's `TurnResource.revision`, because the tree is a pure fold of that record and
        minting a second counter would create a comparison that cannot be made honestly: a client that has the
        turn revision already knows whether this tree is current.
      required: [turnId, sections, revision]
      additionalProperties: false
      properties:
        turnId:
          type: string
        revision:
          type: integer
          minimum: 0
          description: The `turn_display` counter of `StreamResourceKind`, defined to equal the owning turn's revision.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TurnSection'
        lastSectionOrdinal:
          type: integer
          minimum: 0
          description: >-
            Counter a client needs to keep numbering consistent when it adopts a PARTIAL tree. Absent on a full
            tree, which never needs it.
    TurnDisplayResponse:
      type: object
      description: Envelope of one turn's display tree.
      required: [display]
      additionalProperties: false
      properties:
        display:
          $ref: '#/components/schemas/TurnDisplay'
    TurnBlockDetail:
      description: >-
        One context segment answered with its recorded text, by exactly one payload shape per kind: `text` for a
        user, reasoning, or assistant segment; `args` and `result` for a tool call's two halves; `entries` for a
        system segment (one entry per recorded system message, in send order, which is how "what prompt did this
        agent actually run" is answered). Served from the durable record, so it answers identically live, after a
        restart, and for a session folded from a checkpoint with no journal.
      allOf:
        - $ref: '#/components/schemas/ContextBlock'
        - type: object
          additionalProperties: false
          properties:
            sessionId:
              type: string
            text:
              type: string
              description: The whole recorded text of the segment, never truncated and never re-projected.
            args:
              type: string
              description: The recorded raw arguments string of the call this segment represents.
            result:
              type: string
              description: The recorded result content, absent while the call is still running.
            entries:
              type: array
              description: The instruction text the agent ACTUALLY ran with, one entry per recorded system message.
              items:
                type: string
    TurnBlockDetailResponse:
      type: object
      description: Envelope of one context segment detail.
      required: [block]
      additionalProperties: false
      properties:
        block:
          $ref: '#/components/schemas/TurnBlockDetail'
    RecordedEventRef:
      type: object
      description: One recorded event with its ordinal and recorded time, so the two travel together.
      required: [index, event]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        at:
          type: integer
        event:
          $ref: '#/components/schemas/HarnessEvent'
    TurnStepDetail:
      type: object
      description: >-
        The recorded OPENING event and the recorded RESULT event of one step, both VERBATIM, each with its index
        and its `eventTimes` entry. Nothing is truncated and nothing is re-projected, and the pair comes together
        because fetching separately would double the round trips and could pair same-name siblings differently.
      required: [sessionId, turnId, stepId, sectionId, opening]
      additionalProperties: false
      properties:
        sessionId:
          type: string
        turnId:
          type: string
        stepId:
          type: string
          description: Echo of the requested key, equal to the opening event's index as a decimal string.
        sectionId:
          type: string
          description: The invocation this step belongs to, for identity scoping.
        callId:
          type: string
          description: The tool-call identity the two events share, when both carry one.
        opening:
          $ref: '#/components/schemas/RecordedEventRef'
        result:
          description: >-
            Absent while the step is running or for a call that never settled, which is the honest answer and
            never a synthesized one.
          allOf:
            - $ref: '#/components/schemas/RecordedEventRef'
    TurnStepDetailResponse:
      type: object
      description: Envelope of one step detail, carrying the recorded request and its recorded result together.
      required: [detail]
      additionalProperties: false
      properties:
        detail:
          $ref: '#/components/schemas/TurnStepDetail'
    # ---------------------------------------------------------------------
    # Verbatim recorded payloads (record-native field names)
    # ---------------------------------------------------------------------
    HarnessErrorInfo:
      type: object
      description: >-
        Error shape that survives serialisation. Events and tool failures cross CLI and in-process boundaries, so failures
        travel as data rather than as `Error` instances.
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
    HarnessEventType:
      type: string
      description: >-
        Recorded event kinds, the authoritative list of `HarnessEvent` in `src/types/index.ts`: `start` opens a
        run with its agent and model; `text` and `reasoning` are deltas; `tool_call` is the requested call and
        `tool_result` its answer; `usage` is per-request accounting, emitted for EVERY model request including
        tool rounds, so usage events rather than `done` are the complete cost record; `done` is the committed
        answer plus still-pending background calls; `retry` is a discarded attempt with its delay and preserved
        error; `attempt_commit` is the boundary that makes everything since the previous boundary final;
        `wakeup` is a heartbeat while background calls are pending; `action_request` and `action_answer` are the
        owner-question pair; `branch_start` and `branch_end` delimit an automatic owner fork; `error` ends a run
        with a failure. A consumer must treat an unrecognised `type` as data to tolerate, not as a failure.
      enum:
        - start
        - text
        - reasoning
        - tool_call
        - tool_result
        - usage
        - done
        - retry
        - attempt_commit
        - wakeup
        - action_request
        - action_answer
        - branch_start
        - branch_end
        - error
    HarnessUsage:
      type: object
      description: Token accounting, normalised from the provider's usage block.
      required: [input, output, total]
      additionalProperties: false
      properties:
        input:
          type: integer
          minimum: 0
          description: Prompt tokens for the request INCLUDING any replayed cache prefix (OpenAI usage semantics).
        output:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        cached:
          type: integer
          minimum: 0
          description: >-
            How much of `input` the provider served from its prefix cache, WHEN IT SAYS SO AT ALL. Never
            defaulted: "not reported" and "reported, zero cached" are different facts, so absent means unknown
            and not zero.
    HarnessToolCall:
      type: object
      description: >-
        A tool invocation requested by the model. `arguments` stays a raw JSON STRING because that is what the
        provider wire delivers and because malformed JSON is the harness's problem to report back to the model
        rather than a parse crash.
      required: [id, name, arguments]
      additionalProperties: false
      properties:
        id:
          type: string
          description: >-
            Unique across the whole CONVERSATION, not just the turn: the harness keys scheduled work and paired
            tool results by it, and a turn that repeats an id is rejected before any call executes rather than
            letting one result silently stand in for another.
        name:
          type: string
        arguments:
          type: string
    HarnessPendingTool:
      type: object
      description: >-
        One background tool call still running when a model request is made or a run pauses: the wire-safe view
        of in-flight work - ids plus monotonic elapsed time, never a promise, controller, or implementation.
        `elapsedMs` is measured from LAUNCH, so a client renders "running for 12s" without keeping its own clock.
      required: [callId, name, elapsedMs]
      additionalProperties: false
      properties:
        callId:
          type: string
        name:
          type: string
        elapsedMs:
          type: integer
          minimum: 0
    HarnessThread:
      type: object
      description: >-
        INVOCATION identity carried by a NON-ROOT event (one row per run, a new id every time an agent is
        invoked). It is not the persistent conversation: that is `ThreadSummary`, whose `invocation_ids` is the
        join to these ids. Present only for a non-root run, so a root run's events keep their recorded shape.
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable for the whole invocation and unique within the owning turn, so two sequential delegations to the SAME agent get different ids.
        parentId:
          type: string
          description: Omitted for a direct child of the root, set to the parent invocation's id for anything deeper.
        callId:
          type: string
          description: The parent tool call that spawned this run.
        input:
          type: string
          description: The child prompt, present on the `start` event only; later events carry identity fields alone.
        kind:
          type: string
          enum: [delegation, fork, autoanswer]
          description: Omitted for historical recorded events, so a reader must not require it.
        branchId:
          type: string
          description: Branch identity for a fork or autoanswer thread; absent for a delegation thread.
    HarnessActionOption:
      type: object
      description: One choice the model offers, where `id` is the stable value an answer names and `label` is what a client shows.
      required: [id, label]
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
    HarnessActionRequest:
      type: object
      description: A bounded question a model asked its owner, exactly as recorded.
      required: [requestId, question, recommended, options, allowCustom]
      additionalProperties: false
      properties:
        requestId:
          type: string
          description: Generated by the runtime, never by the model, and the path identifier of the answer route.
        question:
          type: string
        recommended:
          type: string
          description: >-
            MUST be one of the option ids: an unknown id is rejected rather than silently falling back to the
            first option, so a client can always highlight a real recommendation.
        options:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/HarnessActionOption'
        allowCustom:
          type: boolean
          enum: [true]
          description: Free-text answers are part of the contract, not a switch a model may disable.
    HarnessAttachment:
      type: object
      description: >-
        One composer or tool attachment, the single shape owner for a submit body, a recorded turn, and the
        lazy bytes route. `data` is raw canonical base64 with no prefix and no whitespace, and `size` must agree
        with the decoded byte length of `data`.
      required: [id, kind, marker, name, mime, size, data]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable and unique within one turn, so a preview can be updated in place and a record round-trips.
        kind:
          type: string
          enum: [image, video, audio, pdf, file]
          description: >-
            An UPLOAD `file` is refused with an explicit unsupported error, because a browser may not push an
            arbitrary binary into a request body; a tool-media `file` attached by a download travels as a provider
            file part, and the provider decides whether to accept it and answers explicitly rather than silently
            dropping it.
        marker:
          type: string
          maxLength: 32
          description: The exact text label the composer inserted into the prompt, e.g. `[Image 1]`; the transport uses it to place the media part where the user referenced it.
        name:
          type: string
          maxLength: 256
          description: Plain file name only. No paths and no URLs.
        mime:
          type: string
          maxLength: 128
          description: Lowercase MIME type without parameters, e.g. `image/png`.
        size:
          type: integer
          minimum: 0
          description: Decoded byte length of `data`.
        data:
          type: string
          description: >-
            Raw canonical base64, no prefix and no whitespace. It is the only field in this contract that carries
            binary, and it appears in exactly two places: a submit body and the single-attachment bytes route.
    AgentResultReference:
      type: object
      description: One reference a client submits with a task, or that the server derives from a typed `#LABEL` in the input.
      required: [turnId, label]
      additionalProperties: false
      properties:
        turnId:
          type: string
        threadId:
          type: string
          description: Omitted means the ROOT block of `turnId`; a nested block names the runtime thread id recorded on its events.
        label:
          type: string
          description: >-
            Normalised display label, e.g. `SU1`: uppercase two letters (the fallback `AG`) followed by the
            occurrence. Occurrences are conversation-scoped and continue across the session's turns, so a label
            identifies one block.
    HarnessMessage:
      description: >-
        One transcript entry in the shape the harness manipulates internally; the transport maps these onto the
        provider wire format. Discriminated by `role`, and the entry shape the transcript routes read and write.
      oneOf:
        - type: object
          required: [role, content]
          additionalProperties: false
          properties:
            role:
              type: string
              enum: [system]
            content:
              type: string
        - type: object
          required: [role, content]
          additionalProperties: false
          properties:
            role:
              type: string
              enum: [user]
            content:
              type: string
            attachments:
              type: array
              maxItems: 4
              items:
                $ref: '#/components/schemas/HarnessAttachment'
        - type: object
          required: [role, content]
          additionalProperties: false
          properties:
            role:
              type: string
              enum: [assistant]
            content:
              type: string
            toolCalls:
              type: array
              description: Present only when the turn requested tools.
              items:
                $ref: '#/components/schemas/HarnessToolCall'
            reasoning:
              type: string
              description: Kept out of the provider payload and retained so a turn can be replayed or edited.
        - type: object
          required: [role, content, toolCallId, name]
          additionalProperties: false
          properties:
            role:
              type: string
              enum: [tool]
            content:
              type: string
              description: >-
                The model-facing result text, bounded at 65,536 bytes by the record itself; the step detail route
                answers the recorded bytes from the durable event rather than this projection.
            toolCallId:
              type: string
            name:
              type: string
            attachments:
              type: array
              maxItems: 4
              description: >-
                Media a tool produced OUT OF BAND, deliberately NOT part of `content`, because the model-facing
                result budget bounds serialised TEXT only and a large image must never be truncated to a filename.
                The transport flushes these as a labelled user-role multimodal message after the complete tool
                block, which keeps strict tool-call pairing intact.
              items:
                $ref: '#/components/schemas/HarnessAttachment'
    HarnessEvent:
      type: object
      description: >-
        One progress event as recorded, discriminated by `type`. Every event names its `agent`, so a multi-agent
        run stays readable in one stream, and carries `thread` (invocation identity) ONLY for a non-root run. The
        payload fields below are per-variant and documented there because a recorded turn keeps them verbatim
        forever; a consumer reads the variant list on `HarnessEventType` and treats an unknown `type` as data.
      required: [type, agent]
      properties:
        type:
          $ref: '#/components/schemas/HarnessEventType'
        agent:
          type: string
        model:
          type: string
          description: '`start` only (and the answer events): the model the request was made against.'
        delta:
          type: string
          description: '`text` and `reasoning` only: the incremental content.'
        call:
          description: '`tool_call` only: the invocation the model requested.'
          allOf:
            - $ref: '#/components/schemas/HarnessToolCall'
        name:
          type: string
          description: '`tool_result` and the state-change events: the tool or action name.'
        callId:
          type: string
          description: The id of the `tool_call` this result answers; optional so an older recording stays valid.
        content:
          type: string
          description: '`tool_result` and `done`: the result or answer text.'
        isError:
          type: boolean
          description: '`tool_result` only: the tool reported a failure rather than a value.'
        outcome:
          description: '`tool_result` only: the tool''s structured value, presentation-unwrapped.'
        ui:
          type: array
          maxItems: 8
          description: '`tool_result` only: declarative panels the tool supplied.'
          items:
            $ref: '#/components/schemas/ToolUiPanel'
        media:
          type: array
          maxItems: 8
          description: '`tool_result` only: media DESCRIPTORS. Bytes live in the transcript entry, never in the event.'
          items:
            $ref: '#/components/schemas/ToolMediaDescriptor'
        durationMs:
          type: integer
          minimum: 0
          description: '`tool_result`: wall-clock duration of the call.'
        pending:
          type: array
          description: '`done` only, and present when the run is NOT terminal because background calls are still live.'
          items:
            $ref: '#/components/schemas/HarnessPendingTool'
        usage:
          description: '`usage` only: this request''s accounting, already summed into the turn tally.'
          allOf:
            - $ref: '#/components/schemas/HarnessUsage'
        error:
          description: '`error`, `retry`, and a failed `done`: the serialised failure.'
          allOf:
            - $ref: '#/components/schemas/HarnessErrorInfo'
        delayMs:
          type: integer
          minimum: 0
          description: '`retry` only: how long the harness waits before the next attempt.'
        request:
          description: '`action_request` only: the bounded question the model asked its owner.'
          allOf:
            - $ref: '#/components/schemas/HarnessActionRequest'
        answer:
          description: '`action_answer` only: the choice that resolved the request, with its `requestId` and `source`.'
        branchId:
          type: string
          description: '`branch_start` and `branch_end`: the automatic owner fork this event delimits.'
        thread:
          description: 'Non-root runs only: the invocation identity this event belongs to.'
          allOf:
            - $ref: '#/components/schemas/HarnessThread'
    # ---------------------------------------------------------------------
    # Display operations (the stream's high-frequency payload)
    # ---------------------------------------------------------------------
    TurnDisplayOp:
      type: object
      description: >-
        One display mutation, ADDRESSED by id with a bounded payload, so a client applies it without understanding
        what happened. ORDERING CONTRACT: `section:open` precedes every op naming that section; `node:insert`
        precedes every `node:append`, `node:set`, or `node:remove` naming that node, and precedes a `step:set` for
        a step not yet present; `step:set` and `tail:set` REPLACE the whole object they name (no field merging, so
        no stale field survives); `section:set`, `node:set`, and `context:set` patch only the fields they name,
        while `context:add` carries the whole block and never merges; `attempt:discard` names the exact nodes to
        drop, so a retry never depends on the client tracking an attempt window; `index` on an insert or add is the
        position WITHIN the section's own list and only out-of-order recovery uses it. Identity fields never change
        in place, so a re-minted block is always a remove plus add pair. A `node:append` delta is capped at
        `delta_chars_per_append_op` on the stream, so a frame is bounded regardless of how fast a model streams.
      required: [op]
      properties:
        op:
          type: string
          enum:
            - turn
            - 'section:open'
            - 'section:set'
            - 'section:remove'
            - 'node:insert'
            - 'node:append'
            - 'node:set'
            - 'node:remove'
            - 'step:set'
            - 'context:add'
            - 'context:set'
            - 'context:remove'
            - 'tail:set'
            - 'tail:clear'
            - 'pending:set'
            - usage
            - 'attempt:commit'
            - 'attempt:discard'
        turnId:
          type: string
        turn:
          description: "For the `turn` op: the whole row to upsert by id (queued, running, and terminal transitions all ride this one place)."
          allOf:
            - $ref: '#/components/schemas/TurnSummary'
        sectionId:
          type: string
          description: For a `usage` op the literal `turn` means the turn-wide figures, a section id means that invocation's own line.
        section:
          description: '`section:open` only: the whole section, established before anything names it.'
          allOf:
            - $ref: '#/components/schemas/TurnSection'
        node:
          description: '`node:insert` only: the whole node.'
          allOf:
            - $ref: '#/components/schemas/DisplayNode'
        step:
          description: '`step:set` only: the whole step object, replacing whatever held the same id.'
          allOf:
            - $ref: '#/components/schemas/DisplayStep'
        block:
          description: '`context:add` only: the whole context segment, metadata only.'
          allOf:
            - $ref: '#/components/schemas/ContextBlock'
        tail:
          description: '`tail:set` only: the whole descriptor, identity plus payload, replacing the previous designation.'
          allOf:
            - $ref: '#/components/schemas/DisplayTail'
        nodeId:
          type: string
        nodeIds:
          type: array
          maxItems: 256
          description: '`attempt:discard` only: exactly which nodes to drop.'
          items:
            type: string
        blockId:
          type: string
        stepId:
          type: string
        delta:
          type: string
          maxLength: 2000
          description: '`node:append` only: bounded incremental text. Deltas for one node arrive in order, so concatenation is the whole rule.'
        index:
          type: integer
          minimum: 0
          description: Position WITHIN the section's own list, used only for out-of-order recovery, which keeps the normal stream free of bookkeeping.
        patch:
          type: object
          description: >-
            Field-level patch whose keys mirror the addressed object (`section:set`, `node:set`, `context:set`):
            `TurnSectionPatch`, `DisplayNodePatch`, `ContextBlockPatch`. A key the patch omits is unchanged; a key
            it names is replaced.
          additionalProperties: true
        pending:
          type: array
          description: '`pending:set` only, and ABSENT means "nothing is pending", which is a statement, not an omission.'
          items:
            $ref: '#/components/schemas/HarnessPendingTool'
        usage:
          description: '`usage` op only: the turn''s running tally AFTER this point, as the server summed it.'
          allOf:
            - $ref: '#/components/schemas/HarnessUsage'
        latestInput:
          type: integer
          minimum: 0
        cachedInput:
          type: integer
          minimum: 0
    # ---------------------------------------------------------------------
    # WebSocket conversation payloads.
    #
    # The envelope of every frame is snake_case; the payload objects inside a
    # frame are the very resources the REST reads return, with their own field
    # names. That is deliberate: one vocabulary per fact, so a client parses a
    # stream row and a REST row with the same code.
    # ---------------------------------------------------------------------
    WsStreamLimits:
      type: object
      description: >-
        The stream's numbers, delivered in `welcome` so a client reads them from the connection it is on rather
        than assuming them. Every value here is the SAME constant as the `x-websocket` entry of the same name,
        carried as this property's `default`, so prose, extension, schema, and the frame on the wire cannot drift
        apart. A property whose `minimum` equals its `maximum` (or whose `enum` has one member) is
        `fixed_by_contract`; a property with a range is `deployment_tunable_within_declared_bounds`, and the value
        IN FORCE is still the one delivered here. A client that treats these as advisory will mis-time a
        reconnect, a resume, or a heartbeat reply.
      required:
        - subscriptions_per_connection
        - ops_per_update_frame
        - delta_chars_per_append_op
        - events_per_update_frame
        - ids_per_invalidation_frame
        - max_client_frame_bytes
        - max_server_frame_bytes
        - client_messages_per_second
        - heartbeat_interval_ms
        - heartbeat_timeout_intervals
        - heartbeat_timeout_close_code
        - replay_frames
        - replay_seconds
        - send_queue_frames
        - send_queue_bytes
        - sustained_stall_ms
        - ack_timeout_ms
        - revision_records_per_state
      additionalProperties: false
      properties:
        subscriptions_per_connection:
          type: integer
          minimum: 1
          maximum: 256
          default: 64
          description: Deployment-tunable. A 65th concurrent subscription answers `too_many_subscriptions`, then close 4401.
        ops_per_update_frame:
          type: integer
          minimum: 32
          maximum: 32
          default: 32
          description: >-
            Fixed. Maximum `TurnDisplayOp` entries in one `display.ops` frame; more ops become more frames, never
            a bigger one. Mirrors `x-websocket.limits.ops_per_update_frame` and `WsUpdateDisplayOps.ops.maxItems`.
        delta_chars_per_append_op:
          type: integer
          minimum: 2000
          maximum: 2000
          default: 2000
          description: Fixed. Maximum characters in one `node:append` delta, which bounds a frame against a fast model. Mirrors `TurnDisplayOp.delta.maxLength`.
        events_per_update_frame:
          type: integer
          minimum: 16
          maximum: 16
          default: 16
          description: Fixed. Maximum recorded events in one opt-in `run.event` frame. Mirrors `WsUpdateRunEvent.events.maxItems`.
        ids_per_invalidation_frame:
          type: integer
          minimum: 64
          maximum: 64
          default: 64
          description: Fixed. Maximum ids in one invalidation frame. Mirrors `WsUpdateToolRegistry.ids.maxItems` and `WsUpdateCatalogue.ids.maxItems`.
        max_client_frame_bytes:
          type: integer
          minimum: 16384
          maximum: 16384
          default: 16384
          description: Fixed. A larger client frame is `frame_too_large`, then close 1009. Mirrors `x-websocket.framing.max_client_frame_bytes`.
        max_server_frame_bytes:
          type: integer
          minimum: 65536
          maximum: 65536
          default: 65536
          description: Fixed. The server never emits a larger frame, so a client can size one buffer and keep it.
        client_messages_per_second:
          type: integer
          minimum: 1
          maximum: 100
          default: 32
          description: Deployment-tunable. Sustained excess answers `rate_limited`, then close 4429. Mirrors `x-websocket.framing.client_messages_per_second`.
        heartbeat_interval_ms:
          type: integer
          minimum: 15000
          maximum: 15000
          default: 15000
          description: Fixed. Mirrors `x-websocket.heartbeat.interval_ms`.
        heartbeat_timeout_intervals:
          type: integer
          minimum: 3
          maximum: 3
          default: 3
          description: Fixed. Missed `pong` replies before the server closes. Mirrors `x-websocket.heartbeat.timeout_intervals`.
        heartbeat_timeout_close_code:
          type: integer
          enum: [4408]
          default: 4408
          description: Fixed. The close code used when the heartbeat budget is exhausted.
        replay_frames:
          type: integer
          minimum: 512
          maximum: 512
          default: 512
          description: Fixed. Frames retained per subscription for a reconnecting cursor. Mirrors `x-websocket.replay.retained_frames_per_subscription`.
        replay_seconds:
          type: integer
          minimum: 60
          maximum: 60
          default: 60
          description: Fixed. How long retained frames stay valid; whichever of the two bounds ends first applies.
        send_queue_frames:
          type: integer
          minimum: 1
          maximum: 4096
          default: 256
          description: Deployment-tunable. Backlog at which the server starts dropping update frames. Mirrors `x-websocket.backpressure.send_queue_frames`.
        send_queue_bytes:
          type: integer
          minimum: 65536
          maximum: 16777216
          default: 1048576
          description: Deployment-tunable. Byte half of the backlog bound. Mirrors `x-websocket.backpressure.send_queue_bytes`.
        sustained_stall_ms:
          type: integer
          minimum: 1000
          maximum: 60000
          default: 10000
          description: Deployment-tunable. How long a full send queue may persist before close 1013. Mirrors `x-websocket.backpressure.sustained_stall_ms`.
        ack_timeout_ms:
          type: integer
          minimum: 1000
          maximum: 60000
          default: 5000
          description: >-
            Deployment-tunable. On a `pace: ack` subscription, how long the server waits for the next `ack`
            before it converts that subscription to `resync_required` instead of queueing without bound. Mirrors
            `x-websocket.backpressure.ack_paced_rule`.
        revision_records_per_state:
          type: integer
          minimum: 20
          maximum: 20
          default: 20
          description: >-
            Fixed. The size of the per-scope revision baseline array (`WsSubscriptionState.revisions`), which is
            the number of `StreamResourceKind` values a scope can publish. Bounding it is what keeps a
            subscription answer a constant-size frame.
    WsSubscriptionScope:
      type: string
      description: >-
        One scope per subscription. Narrow on purpose: a client asks for the session, thread, or turn it is
        actually drawing, and `global` only when it is a catalogue or configuration view.
      enum: [global, session, thread, turn]
    WsSubscriptionFilters:
      type: object
      description: >-
        Narrowing a subscription may only REMOVE frames, never widen a payload. A filter change is a new
        subscription (unsubscribe then subscribe), never an in-place mutation, so a client can never be unsure
        which frames a subscription has already promised it.
      additionalProperties: false
      properties:
        status:
          description: "`session` scope only: publish turn rows in these recorded statuses."
          allOf:
            - $ref: '#/components/schemas/SessionTurnStatus'
        thread_id:
          type: string
          description: '`session` scope only: rows for one conversation.'
        events:
          type: boolean
          description: >-
            '`session` scope only, default false: add `run.event` frames carrying verbatim recorded events. Debug
            and inspection traffic; a render path never turns this on.'
        sections:
          type: boolean
          description: '`turn` scope, default true: when false, node and step payloads are suppressed and only metadata-bearing ops arrive.'
        context:
          type: boolean
          description: '`turn` scope, default true: when false, `context:*` ops are suppressed for a client not drawing the context bar.'
    StreamResourceKind:
      type: string
      description: >-
        The closed vocabulary of addressable counters and re-read targets. One kind names ONE counter domain,
        and the column below states which field of which REST response carries it, so a stream revision and a REST
        revision are always comparable - and only ever within the same kind, id, and epoch. Collection pages use
        the `PageMeta.revision` of that collection; single resources use their own `revision` field; two kinds
        are DERIVED and mint no new counter: `turn_display` and `turn_events` carry the owning turn's `revision`
        (the display tree and the recorded events are pure folds of that record, and `TurnEventPage.total_events`
        is the event position within it), and `transcript_messages` carries the owning `transcript` revision,
        because paging messages and replacing them move one counter. The per-scope baseline sets are:
        `global` = [harnesses, agents, tools, config]; `session` = [session, definition, turns, queue, actions,
        usage, threads, session_agents, session_tools, commands]; `thread` = [thread, transcript];
        `turn` = [turn, turn_display, turn_events]. A frame never reports a kind outside its scope's set, which is
        what keeps a revision baseline small and the comparison rule meaningful. `transcript_messages` is the one
        kind that is a LINK target only: reading paged messages and replacing them move the SAME `transcript`
        counter, so it appears in `WsResyncRequired.resources` to name the read to perform but never as a separate
        baseline record, and a client must treat its freshness as the `transcript` record of the same id.
      enum:
        - session
        - definition
        - turns
        - turn
        - turn_display
        - turn_events
        - threads
        - thread
        - transcript
        - transcript_messages
        - actions
        - usage
        - queue
        - session_agents
        - session_tools
        - harnesses
        - agents
        - tools
        - config
        - commands
    WsRevisionRecord:
      type: object
      description: >-
        ONE counter, keyed by kind and instance id, so there is no free-form map and no ambiguity about which
        revision a comparison refers to. `id` is the instance the counter belongs to (the session id for
        session-scoped kinds, the thread id for `thread` and `transcript`, the turn id for the turn kinds) or
        `null` for a host-wide resource with no id (`harnesses`, `agents`, `tools`, `config`). A revision is
        comparable ONLY against another record with the same `resource`, the same `id`, and the same `epoch`;
        comparing across kinds or epochs is meaningless and never required by this contract.
      required: [resource, id, revision, epoch]
      additionalProperties: false
      properties:
        resource:
          $ref: '#/components/schemas/StreamResourceKind'
        id:
          type: string
          nullable: true
          maxLength: 128
        revision:
          type: integer
          minimum: 0
        epoch:
          type: string
          maxLength: 64
    WsResourceLink:
      type: object
      description: >-
        A pointer to the REST read that restores one resource, never the resource itself. `link` is a concrete
        path including its page size, so recovery is one bounded page rather than an aggregate, and the carried
        `revision` plus `epoch` identify the counter the client is behind on, so it can decide whether a read is
        still necessary at all.
      required: [resource, id, revision, epoch, link]
      additionalProperties: false
      properties:
        resource:
          $ref: '#/components/schemas/StreamResourceKind'
        id:
          type: string
          nullable: true
          maxLength: 128
          description: The instance the counter belongs to, or null for a host-wide resource.
        revision:
          type: integer
          minimum: 0
          description: The current revision of THAT counter at the moment the resync was issued.
        epoch:
          type: string
          maxLength: 64
        link:
          type: string
          maxLength: 512
          description: Absolute path under the mount, e.g. `/v1/harness/sessions/8c1b/turns?limit=25`.
    WsUpdateKind:
      type: string
      description: >-
        What one update frame carries. Every kind names a bounded payload or an invalidation, and no kind carries
        a session tree: `session.updated` is a metadata patch, `turn.upsert` is one row, `display.ops` is at most
        32 addressed ops, `transcript.updated` is counts, `run.event` is opt-in raw events, and the
        `*.registry_updated` and `catalogue.updated` kinds are id lists a re-read resolves.
      enum:
        - session.updated
        - turn.upsert
        - turn.removed
        - display.ops
        - usage.updated
        - action.opened
        - action.closed
        - thread.upsert
        - thread.removed
        - transcript.updated
        - tool.registry_updated
        - agent.registry_updated
        - run.event
        - catalogue.updated
        - config.updated
    WsHello:
      type: object
      description: >-
        Optional first client frame, and the ONLY resume input in the contract: the handshake carries no
        resume state, so there is one place a cursor is sent. It carries the last `epoch` and `cursor` the
        client processed. It is honoured only as the FIRST frame of the connection; a `hello` that arrives after
        the first `subscribe` is refused with `late_hello` and changes nothing (see
        `x-websocket.validation_precedence`). With no `hello` the server simply starts every subscription fresh at
        its own current position. No identity, token, or role is sent, because this contract has no client
        identities.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [hello]
        protocol:
          type: string
          enum: [harness.v1]
        epoch:
          type: string
          maxLength: 64
        cursor:
          type: string
          maxLength: 256
    WsSubscribeGlobal:
      type: object
      description: >-
        `global` scope: NO id field is accepted, because this subscription addresses the host-wide catalogues and
        the global configuration themselves. It publishes `catalogue.updated` and `config.updated` only.
      required: [type, subscription_id, scope]
      additionalProperties: false
      properties:
        type: { type: string, enum: [subscribe] }
        subscription_id: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
        scope: { type: string, enum: [global] }
        filters: { type: object, maxProperties: 0, description: No filter is published for this scope; any key answers unsupported_filter. }
        pace: { type: string, enum: [ordered, ack], default: ordered }
        cursor: { type: string, maxLength: 256 }
    WsSubscribeSession:
      type: object
      description: >-
        `session` scope: requires `session_id` and accepts no `thread_id` or `turn_id`, so a conversation or a
        turn can never be addressed by two different subscriptions. Narrowing by conversation is the `thread_id`
        FILTER, which is a different thing: it removes frames, it does not name the resource.
      required: [type, subscription_id, scope, session_id]
      additionalProperties: false
      properties:
        type: { type: string, enum: [subscribe] }
        subscription_id: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
        scope: { type: string, enum: [session] }
        session_id: { type: string, maxLength: 128 }
        filters:
          $ref: '#/components/schemas/WsSubscriptionFilters'
        pace: { type: string, enum: [ordered, ack], default: ordered }
        cursor: { type: string, maxLength: 256 }
    WsSubscribeThread:
      type: object
      description: '`thread` scope: requires `session_id` AND `thread_id`, and accepts no `turn_id`.'
      required: [type, subscription_id, scope, session_id, thread_id]
      additionalProperties: false
      properties:
        type: { type: string, enum: [subscribe] }
        subscription_id: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
        scope: { type: string, enum: [thread] }
        session_id: { type: string, maxLength: 128 }
        thread_id: { type: string, maxLength: 128 }
        filters: { type: object, maxProperties: 0, description: No filter is published for this scope; any key answers unsupported_filter. }
        pace: { type: string, enum: [ordered, ack], default: ordered }
        cursor: { type: string, maxLength: 256 }
    WsSubscribeTurn:
      type: object
      description: '`turn` scope: requires `session_id` AND `turn_id`, and accepts no `thread_id`.'
      required: [type, subscription_id, scope, session_id, turn_id]
      additionalProperties: false
      properties:
        type: { type: string, enum: [subscribe] }
        subscription_id: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
        scope: { type: string, enum: [turn] }
        session_id: { type: string, maxLength: 128 }
        turn_id: { type: string, maxLength: 128 }
        filters:
          $ref: '#/components/schemas/WsSubscriptionFilters'
        pace: { type: string, enum: [ordered, ack], default: ordered }
        cursor: { type: string, maxLength: 256 }
    WsSubscribe:
      description: >-
        Opens one subscription, discriminated by `scope`, with exactly one variant per scope so the id contract is
        machine-checked rather than prose: `global` takes no ids, `session` takes `session_id`, `thread` takes
        `session_id` plus `thread_id`, `turn` takes `session_id` plus `turn_id`, and an id outside that set is
        rejected by the schema. A scope value outside the fixed enum is a schema failure (`invalid_payload`), and
        a scope whose required id does not exist is `unknown_resource` - two different conditions, never both for
        one frame (see `x-websocket.validation_precedence`). `subscription_id` is chosen by the client and must be
        unique on this connection, so a client correlates frames without a round trip; a failing `subscribe` is
        reported for its own `subscription_id` and does not close the connection or disturb the others. `pace:
        ack` makes the server wait for an `ack` naming the highest sequence before sending more frames on THIS
        subscription, which is how a slow but loss-averse client applies backpressure to itself instead of being
        dropped. A `cursor` here resumes THIS subscription and is authoritative for it, ahead of any `hello`
        cursor. A filter that the scope does not publish answers `unsupported_filter` for that subscription; the
        set of filters per scope is stated in `x-websocket.subscription_scopes`.
      oneOf:
        - $ref: '#/components/schemas/WsSubscribeGlobal'
        - $ref: '#/components/schemas/WsSubscribeSession'
        - $ref: '#/components/schemas/WsSubscribeThread'
        - $ref: '#/components/schemas/WsSubscribeTurn'
      discriminator:
        propertyName: scope
        mapping:
          global: '#/components/schemas/WsSubscribeGlobal'
          session: '#/components/schemas/WsSubscribeSession'
          thread: '#/components/schemas/WsSubscribeThread'
          turn: '#/components/schemas/WsSubscribeTurn'
    WsUnsubscribe:
      type: object
      description: >-
        Ends one subscription and releases its replay buffer. A filter change is expressed as an unsubscribe plus
        a subscribe with a new `subscription_id`, which is why there is no in-place mutation to define.
      required: [type, subscription_id]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [unsubscribe]
        subscription_id:
          type: string
    WsAck:
      type: object
      description: >-
        Confirms the highest sequence the client has APPLIED on an `pace: ack` subscription. Acking is optional
        everywhere else, and an `ack` on a subscription that did not ask for pacing is ignored rather than an
        error, so a client may always ack.
      required: [type, subscription_id, sequence]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [ack]
        subscription_id:
          type: string
        sequence:
          type: integer
          minimum: 0
    WsPing:
      type: object
      description: Client-initiated liveness probe; the server answers `pong` echoing `at`.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [ping]
        at:
          type: integer
    WsBye:
      type: object
      description: >-
        A clean goodbye. The server closes with code 1000 after receiving it, which is how a client releases its
        subscriptions without looking like a dropped connection in the server's diagnostics.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [bye]
        reason:
          type: string
          maxLength: 200
    WsClientMessage:
      description: >-
        The complete client-to-server union, discriminated by `type`. Nothing in it mutates a resource: the stream
        subscribes, paces, and probes, and every state change is a REST write. An unknown `type` is a protocol
        error, never a silent no-op, so a client cannot believe it subscribed when it did not.
      oneOf:
        - $ref: '#/components/schemas/WsHello'
        - $ref: '#/components/schemas/WsSubscribe'
        - $ref: '#/components/schemas/WsUnsubscribe'
        - $ref: '#/components/schemas/WsAck'
        - $ref: '#/components/schemas/WsPing'
        - $ref: '#/components/schemas/WsBye'
    WsWelcome:
      type: object
      description: >-
        First server frame after the upgrade, before any `subscription_state`. It hands the client the epoch and
        the numbers the conversation is bounded by, so a client learns it is on a different server (epoch change)
        before it sends a single subscribe.
      required: [type, protocol, epoch, at, limits]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [welcome]
        protocol:
          type: string
          enum: [harness.v1]
        epoch:
          type: string
        at:
          type: integer
        limits:
          $ref: '#/components/schemas/WsStreamLimits'
    WsSubscriptionState:
      type: object
      description: >-
        The reconciliation anchor for one subscription, and the reason no snapshot frame is needed: it is the
        atomic state at registration. `revisions` plus `sequence` tell a client exactly which later frames are
        already covered by a REST read it issues afterwards, and `replayed_frames` counts what the server re-sent
        from a retained buffer, so a resuming client knows whether it received history or must re-read.
      required: [type, subscription_id, scope, epoch, sequence, cursor, revisions, publishes]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [subscription_state]
        subscription_id:
          type: string
        scope:
          $ref: '#/components/schemas/WsSubscriptionScope'
        epoch:
          type: string
        sequence:
          type: integer
          minimum: 0
          description: Always 0 for a new subscription; frames above it are new information.
        cursor:
          type: string
          maxLength: 256
        revisions:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            The atomic counter baseline at registration: one `WsRevisionRecord` per kind THIS scope publishes,
            keyed by resource kind and instance id (see `StreamResourceKind` for the per-scope sets). A REST read
            issued after this frame that returns a revision at or above the matching record already reflects
            everything the stream has said, so any frame at or below `sequence` is redundant for that kind.
            Comparisons are per kind, per id, per epoch - never across kinds and never across epochs.
          items:
            $ref: '#/components/schemas/WsRevisionRecord'
        filters_applied:
          $ref: '#/components/schemas/WsSubscriptionFilters'
        replayed_frames:
          type: integer
          minimum: 0
        publishes:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          description: >-
            The authoritative kind set THIS subscription may send, after its scope and applied filters. It is
            stated per connection rather than assumed from the document, so a client knows whether `run.event` is
            coming (the `events` filter) and can ignore a kind it was never promised. Adding a kind means
            re-subscribing, never renegotiating.
          items:
            $ref: '#/components/schemas/WsUpdateKind'
    SessionStatePatch:
      type: object
      description: >-
        A session metadata delta: status, queue depth, model map, and the last error - the fields a rail or a
        header draws. No turns, threads, transcripts, events, or definition data, and `revision` always present so
        the frame can be ordered against a read.
      required: [id, revision]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 200
          description: Present only when the display name changed.
        status:
          $ref: '#/components/schemas/SessionStatus'
        queue_depth:
          type: integer
          minimum: 0
          description: Present whenever the depth changed, including the honest 0 that clears a "N waiting" badge.
        model:
          type: string
        agent_models:
          type: object
          description: Present only when a model assignment changed; the WHOLE live map, never a partial merge.
          additionalProperties:
            type: string
        last_error:
          type: string
          maxLength: 2000
        revision:
          type: integer
          minimum: 0
    UsagePatch:
      type: object
      description: >-
        The server's running token figures for a turn or for a session. Figures travel precomputed because the
        server is the one that summed them from per-request `usage` events; a client never accumulates anything
        and therefore can never double-count a replay.
      required: [revision]
      additionalProperties: false
      properties:
        turn_id:
          type: string
        usage:
          description: Absent means no request has reported usage yet, which is not the same statement as zero.
          allOf:
            - $ref: '#/components/schemas/HarnessUsage'
        latest_input:
          type: integer
          minimum: 0
        cached_input:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
    TranscriptSignal:
      type: object
      description: >-
        A transcript changed, stated as counts and a revision. Message bodies never ride the stream: an editor
        re-pages, and a render path that is not showing this transcript ignores the frame entirely.
      required: [thread_id, revision, message_count, transcript_state]
      additionalProperties: false
      properties:
        thread_id:
          type: string
        revision:
          type: integer
          minimum: 0
        message_count:
          type: integer
          minimum: 0
        transcript_state:
          type: string
          enum: [ok, unreadable]
    WsActionClosed:
      type: object
      description: >-
        One question stopped waiting: `reason` says which of the honest outcomes happened, so a client clears the
        card without guessing whether the run was cancelled, the answer arrived, or the request expired.
      required: [request_id, reason]
      additionalProperties: false
      properties:
        request_id:
          type: string
        reason:
          type: string
          enum: [answered, expired, cancelled, ended]
    # Per-kind update variants. Each one is closed (`additionalProperties: false`) and names
    # its own payload, so an impossible combination is a validation failure rather than a
    # convention. `kind` is the discriminator and repeats the shared metadata contract.
    WsUpdateSession:
      type: object
      description: '`session.updated` carries `session` (a metadata patch) and no other payload field.'
      required: [type, subscription_id, sequence, cursor, kind, at, session]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [session.updated] }
        at: { type: integer }
        session:
          $ref: '#/components/schemas/SessionStatePatch'
    WsUpdateTurnUpsert:
      type: object
      description: >-
        `turn.upsert` carries `turn`, one whole row keyed by its own `id`, and no other payload field. The row id
        is inside the row, so a redundant `turn_id` is rejected: there is one place a turn identity can come from.
      required: [type, subscription_id, sequence, cursor, kind, at, turn]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [turn.upsert] }
        at: { type: integer }
        turn:
          $ref: '#/components/schemas/TurnSummary'
    WsUpdateTurnRemoved:
      type: object
      description: >-
        `turn.removed` is PURE INVALIDATION: `turn_id` only, no body, because the row is gone and a re-read of
        `GET .../turns` is the cheapest truth. It is not the `ids` form, because exactly one row is addressed.
      required: [type, subscription_id, sequence, cursor, kind, at, turn_id]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [turn.removed] }
        at: { type: integer }
        turn_id: { type: string, maxLength: 128 }
    WsUpdateDisplayOps:
      type: object
      description: >-
        `display.ops` carries `turn_id` AND `ops`: the ops themselves are addressed by section, node, step, and
        block id, so the turn id is required for routing but never duplicated inside each op.
      required: [type, subscription_id, sequence, cursor, kind, at, turn_id, ops]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [display.ops] }
        at: { type: integer }
        turn_id: { type: string, maxLength: 128 }
        ops:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/TurnDisplayOp'
    WsUpdateUsage:
      type: object
      description: >-
        `usage.updated` carries `usage_patch`; `turn_id` is optional inside it or beside it, because a turn
        figure and a session figure share one kind and the patch itself says which it is.
      required: [type, subscription_id, sequence, cursor, kind, at, usage_patch]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [usage.updated] }
        at: { type: integer }
        turn_id: { type: string, maxLength: 128 }
        usage_patch:
          $ref: '#/components/schemas/UsagePatch'
    WsUpdateActionOpened:
      type: object
      description: '`action.opened` carries `action`, one ready-to-answer question, and no other payload field.'
      required: [type, subscription_id, sequence, cursor, kind, at, action]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [action.opened] }
        at: { type: integer }
        action:
          $ref: '#/components/schemas/PendingAction'
    WsUpdateActionClosed:
      type: object
      description: >-
        `action.closed` carries `action_closed` (the request id plus which honest outcome ended it) and no other
        payload field, so a client clears exactly one card.
      required: [type, subscription_id, sequence, cursor, kind, at, action_closed]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [action.closed] }
        at: { type: integer }
        action_closed:
          $ref: '#/components/schemas/WsActionClosed'
    WsUpdateThreadUpsert:
      type: object
      description: >-
        `thread.upsert` carries `thread`, one whole roster row, and no other payload field. Roster rows carry
        transcript SIGNALS only, so this never becomes a transcript transfer.
      required: [type, subscription_id, sequence, cursor, kind, at, thread]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [thread.upsert] }
        at: { type: integer }
        thread:
          $ref: '#/components/schemas/ThreadSummary'
    WsUpdateThreadRemoved:
      type: object
      description: '`thread.removed` is PURE INVALIDATION: `thread_id` only, no body.'
      required: [type, subscription_id, sequence, cursor, kind, at, thread_id]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [thread.removed] }
        at: { type: integer }
        thread_id: { type: string, maxLength: 128 }
    WsUpdateTranscript:
      type: object
      description: >-
        `transcript.updated` carries `transcript` (counts plus a revision) and no other payload field. Message
        bodies are never streamed: a client that is showing this transcript re-pages the messages route.
      required: [type, subscription_id, sequence, cursor, kind, at, transcript]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [transcript.updated] }
        at: { type: integer }
        transcript:
          $ref: '#/components/schemas/TranscriptSignal'
    WsUpdateToolRegistry:
      type: object
      description: >-
        `tool.registry_updated` is PURE INVALIDATION with a non-empty `ids` list (the tool names that changed).
        It carries no descriptor, because the toolbox page is one bounded read away and is the truth.
      required: [type, subscription_id, sequence, cursor, kind, at, ids]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [tool.registry_updated] }
        at: { type: integer }
        ids:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
    WsUpdateAgentRegistry:
      type: object
      description: '`agent.registry_updated` is PURE INVALIDATION with a non-empty `ids` list (the roster keys that changed).'
      required: [type, subscription_id, sequence, cursor, kind, at, ids]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [agent.registry_updated] }
        at: { type: integer }
        ids:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
    WsUpdateRunEvent:
      type: object
      description: >-
        `run.event` carries `turn_id` AND `events`, and is only ever sent to a `session` subscription whose
        `events` filter is true. This is the one kind that ships verbatim recorded bytes, and it is opt-in debug
        traffic.
      required: [type, subscription_id, sequence, cursor, kind, at, turn_id, events]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [run.event] }
        at: { type: integer }
        turn_id: { type: string, maxLength: 128 }
        events:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/TurnEventRow'
    WsUpdateCatalogue:
      type: object
      description: >-
        `catalogue.updated` carries `catalogue` (which global collection moved) AND a non-empty `ids` list. It is
        invalidation with names, so a client re-reads one page or one identified resource, never all three
        catalogues.
      required: [type, subscription_id, sequence, cursor, kind, at, catalogue, ids]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [catalogue.updated] }
        at: { type: integer }
        catalogue: { type: string, enum: [harnesses, agents, tools] }
        ids:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
    WsUpdateConfig:
      type: object
      description: >-
        `config.updated` carries NO payload field at all, and that is deliberate: the global configuration is one
        named resource with no id set, so the subscription itself identifies what changed and `revision` in
        `GET /config` says whether the client is already current. A frame with `ids` here is invalid, because it
        would imply a set that does not exist.
      required: [type, subscription_id, sequence, cursor, kind, at]
      additionalProperties: false
      properties:
        type: { type: string, enum: [update] }
        subscription_id: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        cursor: { type: string, maxLength: 256 }
        kind: { type: string, enum: [config.updated] }
        at: { type: integer }
    WsUpdate:
      description: >-
        One bounded delta on one subscription, discriminated by `kind`, with exactly one variant per kind.
        `sequence` is monotonic per subscription and `cursor` is its opaque resume token, so a client detects a
        gap by arithmetic rather than by inference and a server that dropped frames says so instead of leaving the
        client with a silently wrong view. KIND TO PAYLOAD (exhaustive, machine-enforced by the variants):
        `session.updated` requires `session`; `turn.upsert` requires `turn`; `turn.removed` requires `turn_id`
        and nothing else; `display.ops` requires `turn_id` and `ops`; `usage.updated` requires `usage_patch`
        and may also carry `turn_id`; `action.opened` requires `action`; `action.closed` requires
        `action_closed`; `thread.upsert` requires `thread`; `thread.removed` requires `thread_id`;
        `transcript.updated` requires `transcript`; `tool.registry_updated` requires a non-empty `ids`;
        `agent.registry_updated` requires a non-empty `ids`; `run.event` requires `turn_id` and `events`;
        `catalogue.updated` requires `catalogue` and a non-empty `ids`; `config.updated` requires no payload.
        Every variant forbids every other payload field, so no frame can be both a body and an invalidation. A
        frame that names a resource a client is not showing is ignored, which is what makes one shared session
        scope cheap for several panes.
      oneOf:
        - $ref: '#/components/schemas/WsUpdateSession'
        - $ref: '#/components/schemas/WsUpdateTurnUpsert'
        - $ref: '#/components/schemas/WsUpdateTurnRemoved'
        - $ref: '#/components/schemas/WsUpdateDisplayOps'
        - $ref: '#/components/schemas/WsUpdateUsage'
        - $ref: '#/components/schemas/WsUpdateActionOpened'
        - $ref: '#/components/schemas/WsUpdateActionClosed'
        - $ref: '#/components/schemas/WsUpdateThreadUpsert'
        - $ref: '#/components/schemas/WsUpdateThreadRemoved'
        - $ref: '#/components/schemas/WsUpdateTranscript'
        - $ref: '#/components/schemas/WsUpdateToolRegistry'
        - $ref: '#/components/schemas/WsUpdateAgentRegistry'
        - $ref: '#/components/schemas/WsUpdateRunEvent'
        - $ref: '#/components/schemas/WsUpdateCatalogue'
        - $ref: '#/components/schemas/WsUpdateConfig'
      discriminator:
        propertyName: kind
        mapping:
          session.updated: '#/components/schemas/WsUpdateSession'
          turn.upsert: '#/components/schemas/WsUpdateTurnUpsert'
          turn.removed: '#/components/schemas/WsUpdateTurnRemoved'
          display.ops: '#/components/schemas/WsUpdateDisplayOps'
          usage.updated: '#/components/schemas/WsUpdateUsage'
          action.opened: '#/components/schemas/WsUpdateActionOpened'
          action.closed: '#/components/schemas/WsUpdateActionClosed'
          thread.upsert: '#/components/schemas/WsUpdateThreadUpsert'
          thread.removed: '#/components/schemas/WsUpdateThreadRemoved'
          transcript.updated: '#/components/schemas/WsUpdateTranscript'
          tool.registry_updated: '#/components/schemas/WsUpdateToolRegistry'
          agent.registry_updated: '#/components/schemas/WsUpdateAgentRegistry'
          run.event: '#/components/schemas/WsUpdateRunEvent'
          catalogue.updated: '#/components/schemas/WsUpdateCatalogue'
          config.updated: '#/components/schemas/WsUpdateConfig'
    WsResyncRequired:
      type: object
      description: >-
        The only recovery frame, and the only place a client is told to re-read. It carries a reason, the current
        epoch and cursor to resume from, and at most 16 resource links. It NEVER carries a session, a snapshot, an
        event array, or a display tree, which is the rule that keeps the stream from reintroducing the payload
        class the resource design removed.
      required: [type, subscription_id, reason, epoch, cursor, resources]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [resync_required]
        subscription_id:
          type: string
        reason:
          type: string
          enum: [cursor_expired, epoch_mismatch, frames_dropped]
          description: >-
            Exactly three causes, and each one says what the client must do. `cursor_expired` = the resume cursor
            is older than the replay window (the advertised `replay_frames` / `replay_seconds`), so the client
            re-reads the listed resources. `epoch_mismatch` = the cursor came from a previous server lifetime, so
            every retained position is dead. `frames_dropped` = the server is still live and this subscription
            lost frames it could not deliver (send-queue backpressure or an expired ack), so the client re-reads
            the listed resources and keeps its cursor at `cursor`. A filter problem is NOT a reason here: it is
            reported by `WsProtocolError{ code: unsupported_filter }` at subscribe time, which is the single
            place that condition is ever stated.
        epoch:
          type: string
        cursor:
          type: string
          description: The cursor a client resumes FROM, which is the oldest position still retained.
        lost_frames:
          type: integer
          minimum: 0
          description: How many frames this subscription can no longer receive, so a client can bound its re-reads.
        resources:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/WsResourceLink'
    WsProtocolError:
      type: object
      description: >-
        A protocol-level problem, reported as a frame rather than a status code because the connection already
        answered 101. `retryable` distinguishes a client that should resend from one that must not. The connection
        stays open unless the close code is present, in which case the server closes immediately after this frame.
      required: [type, code, message, retryable]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [error]
        code:
          type: string
          enum:
            - invalid_payload
            - unknown_subscription
            - unknown_resource
            - unsupported_filter
            - late_hello
            - too_many_subscriptions
            - frame_too_large
            - rate_limited
            - internal
          description: >-
            One code per condition, decided in the single precedence order in `x-websocket.validation_precedence`.
            `invalid_payload` covers every client-union failure, INCLUDING a `scope` value outside the fixed enum
            (there is no negotiated scope, so there is no separate scope code). `unknown_resource` is a valid
            frame whose required session, thread, or turn id does not exist. `unknown_subscription` names a
            `subscription_id` this connection never opened or already closed. `late_hello` is a `hello` that
            arrived after the first `subscribe`. `too_many_subscriptions` and `rate_limited` carry the advertised
            close code when the deployment closes; `frame_too_large` and `internal` may also close.
        message:
          type: string
          maxLength: 500
          description: Names the offending field or budget, and never contains a credential.
        subscription_id:
          type: string
        retryable:
          type: boolean
          description: >-
            True when resending the same frame after the stated condition changes can succeed (a full subscription
            budget, an internal stall); false when the frame itself is wrong.
        close_code:
          type: integer
          description: Present when this error is fatal to the connection.
    WsHeartbeat:
      type: object
      description: >-
        Server keep-alive every `heartbeat_interval_ms`. A client that misses three in a row must assume the
        connection is gone and reconnect with its cursor, rather than waiting for a TCP timeout that may never
        fire.
      required: [type, at]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [heartbeat]
        at:
          type: integer
    WsPong:
      type: object
      description: Answer to a `heartbeat` or a client `ping`, echoing the `at` it was given.
      required: [type, at]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [pong]
        at:
          type: integer
    WsServerMessage:
      description: >-
        The complete server-to-client union, discriminated by `type`: `welcome`, one `subscription_state` per
        subscription, `update` deltas, `resync_required` recovery, `error` for protocol problems, and the
        `heartbeat` / `pong` keep-alive pair. Nothing in it mutates a resource.
      oneOf:
        - $ref: '#/components/schemas/WsWelcome'
        - $ref: '#/components/schemas/WsSubscriptionState'
        - $ref: '#/components/schemas/WsUpdate'
        - $ref: '#/components/schemas/WsResyncRequired'
        - $ref: '#/components/schemas/WsProtocolError'
        - $ref: '#/components/schemas/WsHeartbeat'
        - $ref: '#/components/schemas/WsPong'








